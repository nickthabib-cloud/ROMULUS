[project]
name = "romulus"
version = "0.1.0"
description = "Defensive AI-assisted threat hunting for CPT analysts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "idna>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# the Claude Messages API adapter (AGENT_PROVIDER=anthropic); imported only when that provider is selected
anthropic = ["anthropic>=2.4.0,<3"]

[project.scripts]
romulus = "romulus.cli:main"

[dependency-groups]
# the anthropic extra is listed so its adapter tests run instead of being skipped
dev = ["pytest>=8.2", "respx>=0.21", "ruff>=0.6", "anthropic>=2.4.0,<3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/romulus"]

[tool.hatch.build.targets.wheel.force-include]
"src/romulus/agent/prompts" = "romulus/agent/prompts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: large synthetic volume tests (deselect with -m \"not slow\")"]

[tool.ruff]
line-length = 110
target-version = "py312"
