<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ROMULUS{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div class="banner">{{ banner }}</div>
<header class="top">
  <a class="brand" href="/">ROMULUS</a>
  {% if user %}
  <nav><a href="/">Hunts</a><a href="/hunts/new">New hunt</a>{% if user.r == 'lead' %}<a href="/site">Site setup</a>{% endif %}</nav>
  <form method="post" action="/logout" class="logout">
    <span class="who">{{ user.u }} ({{ user.r }})</span>
    <input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit">Sign out</button>
  </form>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
<div class="banner">{{ banner }}</div>
</body>
</html>
