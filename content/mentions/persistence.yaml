- id: mention.persist_ld_preload_temp_library
  title: 'LD_PRELOAD= with a temp-directory library path'
  match:
    anchored: 'LD_PRELOAD= {0,2}[\"'']?(?:/tmp/|/dev/shm/|/var/tmp/)'
  case_sensitive: true
  strength: strong
  attack: [T1574.006]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1574.006 Dynamic Linker Hijacking
    url: https://attack.mitre.org/techniques/T1574/006
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1574.006
  rationale: >-
    Author-composed shape from T1574.006: preloading a shared object from /tmp, /dev/shm or /var/tmp injects code into
    the next program and is a classic local privilege escalation with sudo env_keep. Legitimate preloads (jemalloc,
    tcmalloc, libfaketime) come from system library paths. The current-directory form is a separate medium entry.
  examples:
    positive:
      - 'Nov 20 13:08:00 web01 bash[820]: HISTORY: sudo LD_PRELOAD=/tmp/x.so apache2'
    negative:
      - 'Nov 20 13:08:01 web01 systemd[1]: app.service: Environment LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2'
      - 'Nov 20 13:08:02 web01 bash[821]: HISTORY: echo $LD_LIBRARY_PATH'

- id: mention.persist_ld_preload_cwd_library
  title: LD_PRELOAD= with a current-directory library path
  match:
    anchored: 'LD_PRELOAD= {0,2}["'']?\./'
  case_sensitive: true
  strength: medium
  attack: [T1574.006]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1574.006 Dynamic Linker Hijacking
    url: https://attack.mitre.org/techniques/T1574/006
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1574.006
  rationale: >-
    Author-composed shape from the technique text: a library preloaded from the current directory. Exploit code uses
    it, and so do developers testing their own builds, so it is medium.
  examples:
    positive:
      - 'Nov 20 13:08:03 web01 bash[822]: HISTORY: LD_PRELOAD=./libhook.so /usr/bin/passwd'
    negative:
      - 'Nov 20 13:08:04 web01 systemd[1]: app.service: Environment LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2'
      - 'Nov 20 13:08:05 web01 bash[823]: HISTORY: LD_LIBRARY_PATH=./lib ./app'

- id: mention.persist_ld_so_preload_write
  title: 'echo into /etc/ld.so.preload (command text)'
  match:
    anchored: 'echo [^\n]{1,200}>{1,2} {0,2}/etc/ld\.so\.preload'
  case_sensitive: true
  strength: strong
  attack: [T1574.006, T1014]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1574.006 Dynamic Linker Hijacking
    url: https://attack.mitre.org/techniques/T1574/006
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1574.006
  rationale: >-
    Author-composed shape; ATT&CK procedure examples (Rocke, Hildegard, TeamTNT) write /etc/ld.so.preload, and no
    package echoes into it, hence strong. Writing a library path into the global preload file loads it into every
    dynamically linked program; userland rootkits and miner kits install this way. Packages that need preloading ship
    the file, they do not echo into it.
  examples:
    positive:
      - 'Nov 20 13:09:00 web01 sh[822]: echo /usr/local/lib/libprocesshider.so >> /etc/ld.so.preload'
    negative:
      - 'Nov 20 13:09:01 web01 bash[823]: HISTORY: cat /etc/ld.so.preload'
      - 'Nov 20 13:09:02 web01 bash[824]: HISTORY: echo /opt/lib > /etc/ld.so.conf.d/opt.conf'

- id: mention.persist_setuid_in_temp
  title: 'chmod setuid mode on a temp-directory path'
  match:
    anchored: 'chmod {1,3}(?:u\+s|\+s|[4567][0-7]{3}) {1,3}(?:/tmp/|/dev/shm/|/var/tmp/)[^\s;&|]{1,100}'
  case_sensitive: true
  strength: strong
  attack: [T1548.001]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Setuid and Setgid (Ömer Günal)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/process_creation/proc_creation_lnx_setgid_setuid.yml
    license: DRL-1.1
    upstream_id: c21c4eaa-ba2e-419a-92b2-8371703cbe21
  rationale: >-
    Narrows the rule (chown root plus chmod u+s or g+s on one command line) to a setuid mode applied directly to a
    path in a world-writable temp directory, a planted privilege-escalation backdoor. The rule's 'chown root'
    requirement is dropped because the chown is often a separate log line; setgid modes (2775 on shared directories)
    and paths after '&&' or ';' are not matched. Packages install setuid binaries under /usr, never in /tmp.
  examples:
    positive:
      - 'Nov 20 13:10:00 web01 bash[825]: HISTORY: chmod 4755 /tmp/.bash'
      - 'Nov 20 13:10:01 web01 bash[826]: HISTORY: chmod u+s /dev/shm/rootme'
    negative:
      - 'Nov 20 13:10:02 web01 bash[827]: HISTORY: chmod 1777 /tmp'
      - 'Nov 20 13:10:03 web01 bash[828]: HISTORY: chmod 755 /tmp/build/run.sh'
      - 'Nov 20 13:10:04 web01 bash[828]: HISTORY: chmod 2775 /tmp/shared'
      - 'Nov 20 13:10:05 web01 bash[828]: HISTORY: chmod 4755 /usr/local/bin/tool && cp build.log /tmp/'

- id: mention.persist_setuid_system_shell
  title: 'chmod setuid mode on a system shell (command text)'
  match:
    anchored: 'chmod {1,3}(?:u\+s|\+s|[4567][0-7]{3}) {1,3}(?:/usr)?/bin/(?:ba|da|z|k|a)?sh\b'
  case_sensitive: true
  strength: strong
  attack: [T1548.001]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1548.001 Setuid and Setgid
    url: https://attack.mitre.org/techniques/T1548/001
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1548.001
  rationale: >-
    Author-composed shape from the technique text (chmod, setuid); strong because no distribution ships a setuid
    shell. A setuid shell ('bash -p' then gives a root shell to anyone) is the simplest root backdoor; no distribution
    ships a setuid shell.
  examples:
    positive:
      - 'Nov 20 13:11:00 web01 bash[829]: HISTORY: chmod u+s /bin/bash'
    negative:
      - 'Nov 20 13:11:01 web01 bash[830]: HISTORY: chmod 755 /bin/backup-wrapper'
      - 'Nov 20 13:11:02 web01 bash[831]: HISTORY: ls -l /bin/bash'

- id: mention.persist_shell_copied_to_temp
  title: 'cp of a system shell into a temp directory (command text)'
  match:
    anchored: 'cp /(?:usr/)?bin/(?:ba|da|z|k|a)?sh {1,3}(?:/tmp/|/dev/shm/|/var/tmp/)'
  case_sensitive: true
  strength: medium
  attack: [T1548.001]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1548.001 Setuid and Setgid
    url: https://attack.mitre.org/techniques/T1548/001
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1548.001
  rationale: >-
    Author-composed shape from the technique text. Copying a shell into a temp directory is the first step of a setuid
    shell backdoor (copy, then chmod 4755). Test harnesses occasionally copy shells into sandboxes, so alone it is
    medium.
  examples:
    positive:
      - 'Nov 20 13:12:00 web01 sh[832]: cp /bin/bash /tmp/.sh; chmod +s /tmp/.sh'
    negative:
      - 'Nov 20 13:12:01 web01 bash[833]: HISTORY: cp /bin/ls /tmp/ls.bak'
      - 'Nov 20 13:12:02 web01 bash[834]: HISTORY: cp /etc/bash.bashrc /tmp/bashrc.orig'

- id: mention.persist_sudoers_nopasswd_append
  title: 'echo of a NOPASSWD: ALL grant with >> into /etc/sudoers'
  match:
    anchored: 'echo [^\n]{1,160}NOPASSWD: {0,2}ALL[^\n]{0,80}>> {0,2}/etc/sudoers(?:[^.\w/]|$)'
  case_sensitive: true
  strength: medium
  attack: [T1548.003, T1098]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Persistence Via Sudoers Files (Nasreddine Bencherchali, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/file_event/file_event_lnx_persistence_sudoers_files.yml
    license: DRL-1.1
    upstream_id: ddb26b76-4447-4807-871f-1b035b2bfa5d
  rationale: >-
    The rule flags writes to sudoers; this is the command-line form of the most dangerous write, an unrestricted
    passwordless grant appended to /etc/sudoers itself (drop-in files under /etc/sudoers.d are not matched). Vagrant
    and Packer base-image builds append exactly this line for their build user, so it is medium; the account named and
    the host role decide.
  examples:
    positive:
      - 'Nov 20 13:13:00 web01 sh[835]: echo "www-data ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers'
    negative:
      - 'Nov 20 13:13:01 web01 sudo[836]: alice : TTY=pts/0 ; PWD=/home/alice ; USER=root ; COMMAND=/usr/sbin/visudo'
      - 'Nov 20 13:13:02 web01 bash[837]: HISTORY: grep NOPASSWD /etc/sudoers.d/*'

- id: mention.persist_useradd_duplicate_uid0
  title: useradd creating a non-unique UID 0 account
  match:
    anchored: 'useradd [^\n]{0,100}(?:-o {1,3}-u {1,3}0|-u {1,3}0 {1,3}-o)\b'
  case_sensitive: true
  strength: strong
  attack: [T1136.001]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1136.001 Local Account
    url: https://attack.mitre.org/techniques/T1136/001
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1136.001
  rationale: >-
    Author-composed shape from the technique text (useradd); strong because a duplicate UID 0 has no administrative
    use. '-o -u 0' creates a second account with root's UID, a root backdoor under another name. There is no
    administrative reason for a duplicate UID 0.
  examples:
    positive:
      - 'Nov 20 13:14:00 web01 bash[838]: HISTORY: useradd -o -u 0 -g 0 -M -d /root -s /bin/bash sysupd'
    negative:
      - 'Nov 20 13:14:01 web01 bash[839]: HISTORY: useradd -m -u 1005 -s /bin/bash carol'
      - 'Nov 20 13:14:02 web01 bash[840]: HISTORY: useradd -r -u 999 svc_app'

- id: mention.persist_passwd_uid0_append
  title: 'echo of a UID 0 line with >> into /etc/passwd'
  match:
    anchored: 'echo [^\n]{1,120}:0:0:[^\n]{0,120}>> {0,2}/etc/passwd'
  case_sensitive: true
  strength: strong
  attack: [T1136.001, T1098]
  telemetry: [linux_text]
  source:
