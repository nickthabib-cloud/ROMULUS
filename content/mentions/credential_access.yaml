# Mention patterns for credential-dumping shapes that do not depend on a named tool: LSASS memory dumps through
# signed binaries, registry hive saves, NTDS.dit theft through shadow copies or IFM, and copies of the Linux account
# databases into temp paths. Named credential tools (Mimikatz, Rubeus, Impacket, LaZagne) are in tools.yaml.

- id: mention.cred_comsvcs_minidump
  title: 'comsvcs.dll MiniDump command text'
  match:
    anchored: 'comsvcs(?:\.dll)?[^\n]{0,10}(?:MiniDump|#\+?-?[0-9]{1,5})[^\n]{0,120}\bfull\b'
  case_sensitive: false
  strength: strong
  attack: [T1003.001]
  telemetry: [windows_text]
  source:
    name: 'SigmaHQ: Process Memory Dump Via Comsvcs.DLL (Florian Roth, Modexp, Nasreddine Bencherchali, Swachchhanda Shrawan Poudel)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_rundll32_process_dump_via_comsvcs.yml
    license: DRL-1.1
    upstream_id: 646ea171-dded-4578-8a4d-65e9822892e3
  rationale: >-
    'rundll32 comsvcs.dll, MiniDump <pid> <file> full' (or the #24 ordinal) writes a full memory dump of a process,
    almost always LSASS, with a signed Windows DLL. The rule rates false positives as unlikely.
  examples:
    positive:
      - 'rundll32.exe C:\windows\System32\comsvcs.dll, MiniDump 624 C:\Users\Public\l.dmp full'
      - 'rundll32 comsvcs.dll #24 624 C:\Windows\Temp\x.bin full'
    negative:
      - 'regsvr32 /s C:\Windows\System32\comsvcs.dll'
      - 'C:\Windows\System32\dllhost.exe /Processid:{02D4B3F1-FD88-11D1-960D-00805FC79235} comsvcs loaded'

- id: mention.cred_procdump_lsass
  title: ProcDump writing a dump of LSASS
  match:
    anchored: 'procdump(?:64)?(?:\.exe)?["'']?[^\n]{0,60}[-/]m[amp] [^\n]{0,60}\blsass'
  case_sensitive: false
  strength: strong
  attack: [T1003.001]
  telemetry: [windows_text]
  source:
    name: 'SigmaHQ: Potential LSASS Process Dump Via Procdump (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_sysinternals_procdump_lsass.yml
    license: DRL-1.1
    upstream_id: 5afee48e-67dd-4e03-a783-f74259dcf998
  rationale: >-
    Sysinternals ProcDump with a full, mini or miniplus dump flag aimed at lsass captures credential material with a
    Microsoft-signed tool. The rule's own note: no one should dump LSASS memory outside a supervised support case.
  examples:
    positive:
      - 'C:\Users\Public\procdump64.exe -accepteula -ma lsass.exe C:\Users\Public\ls.dmp'
    negative:
      - 'procdump.exe -ma w3wp.exe C:\dumps\w3wp.dmp'
      - 'procdump -e 1 -f "" sqlservr.exe'

- id: mention.cred_reg_save_hive
  title: 'reg save of the SAM, SYSTEM or SECURITY hive (command text)'
  match:
    anchored: 'save {1,3}["'']?(?:HKLM|HKEY_LOCAL_MACHINE)\\(?:SAM|SYSTEM|SECURITY)(?:["'' ]|$)'
  case_sensitive: false
  strength: strong
  attack: [T1003.002, T1003.004]
  telemetry: [windows_text]
  source:
    name: 'SigmaHQ: Dumping of Sensitive Hives Via Reg.EXE (Teymur Kheirkhabarov, Endgame, JHasenbusch, Daniil Yugoslavskiy, oscd.community, frack113)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_reg_dumping_sensitive_hives.yml
    license: DRL-1.1
    upstream_id: fd877b94-9bb5-4191-bb25-d79cbd93c167
  rationale: >-
    Saving the SAM, SYSTEM or SECURITY hive yields local password hashes, the boot key and LSA secrets for offline
    extraction. Backup products read hives through VSS rather than 'reg save'; forensic collection is the benign case.
  examples:
    positive:
      - 'reg save HKLM\SAM C:\Users\Public\sam.save'
      - 'reg.exe save "HKLM\SYSTEM" C:\Windows\Temp\sys'
    negative:
      - 'reg save HKCU\Software\Corp C:\backup\corp.hiv'
      - 'reg query HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters'

- id: mention.cred_reg_export_hive
  title: 'reg export of the SAM, SYSTEM or SECURITY hive (command text)'
  match:
    anchored: 'export {1,3}["'']?(?:HKLM|HKEY_LOCAL_MACHINE)\\(?:SAM|SYSTEM|SECURITY)(?:["'' ]|$)'
  case_sensitive: false
  strength: strong
  attack: [T1003.002, T1003.004]
  telemetry: [windows_text]
  source:
    name: 'SigmaHQ: Dumping of Sensitive Hives Via Reg.EXE (Teymur Kheirkhabarov, Endgame, JHasenbusch, Daniil Yugoslavskiy, oscd.community, frack113)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_reg_dumping_sensitive_hives.yml
    license: DRL-1.1
    upstream_id: fd877b94-9bb5-4191-bb25-d79cbd93c167
  rationale: >-
    The rule's 'export' form: exporting a whole credential hive to a file serves the same offline extraction as
    'reg save'. Exports of specific subkeys under SYSTEM\CurrentControlSet are not matched.
  examples:
    positive:
      - 'reg export HKLM\SECURITY C:\Windows\Temp\sec.reg'
    negative:
      - 'reg export "HKLM\SYSTEM\CurrentControlSet\Services\Tcpip" C:\backup\tcpip.reg'
      - 'reg export HKLM\SOFTWARE\Corp C:\backup\corp.reg'

- id: mention.cred_shadowcopy_credential_store
  title: Credential store read from a volume shadow copy path
  match:
    anchored: 'GLOBALROOT\\Device\\HarddiskVolumeShadowCopy[0-9]{1,4}\\[^\n]{0,100}(?:ntds\.dit|\\config\\(?:SAM|SYSTEM|SECURITY)\b)'
  case_sensitive: false
  strength: strong
  attack: [T1003.003, T1003.002]
  telemetry: [windows_text]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1003.003 NTDS
    url: https://attack.mitre.org/techniques/T1003/003
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1003.003
  rationale: >-
    Author-composed shape from the technique text (ntds.dit, Volume Shadow Copy); strong because no backup product
    copies these files by shadow-copy path in a command line. Copying ntds.dit or a registry hive out of a shadow copy
    bypasses the file locks that protect them; it is the standard way to steal the domain database or local hashes.
    Backup software reads shadow copies through APIs, not with copy commands naming these files.
  examples:
    positive:
      - 'copy \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy3\Windows\NTDS\ntds.dit C:\Users\Public\n.dit'
      - 'cmd /c copy \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy1\Windows\System32\config\SAM C:\Temp\s'
    negative:
      - 'vssadmin list shadows'
      - 'dir \\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy3\Users\alice\Documents'

- id: mention.cred_ntdsutil_ifm
  title: ntdsutil creating install-from-media output
  match:
    anchored: 'ntdsutil(?:\.exe)?["'']?[^\n]{1,120}\bifm\b'
  case_sensitive: false
  strength: medium
  attack: [T1003.003]
  telemetry: [windows_text]
  source:
    name: 'SigmaHQ: Invocation of Active Directory Diagnostic Tool (ntdsutil.exe) (Thomas Patzke)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_ntdsutil_usage.yml
    license: DRL-1.1
    upstream_id: 2afafd61-6aae-4df4-baed-139fa1f4c345
  rationale: >-
    Narrows the rule (any ntdsutil run) to the IFM subcommand, which writes a copy of ntds.dit and the SYSTEM hive:
    the whole domain's password hashes. Domain admins use IFM to promote domain controllers, so it is medium; who ran
    it and where the output went decide.
  examples:
    positive:
      - 'ntdsutil "ac i ntds" "ifm" "create full C:\Users\Public\x" q q'
    negative:
      - 'ntdsutil "metadata cleanup" q'
      - 'ntdsutil snapshot "list all" q q'

- id: mention.cred_account_db_to_temp
  title: 'cp of a Linux account database into a temp directory (command text)'
  match:
    anchored: 'cp /etc/(?:shadow|gshadow|passwd|master\.passwd) {1,3}(?:/tmp/|/dev/shm/|/var/tmp/)'
  case_sensitive: true
  strength: strong
  attack: [T1003.008]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Copy Passwd Or Shadow From TMP Path (Joseliyo Sanchez)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/process_creation/proc_creation_lnx_cp_passwd_or_shadow_tmp.yml
    license: DRL-1.1
    upstream_id: fa4aaed5-4fe0-498d-bbc0-08e3346387ba
  rationale: >-
    Copying shadow or passwd into a world-writable temp directory stages hashes for cracking or exfiltration. Backup
    tools copy /etc wholesale to protected locations, not single account files into /tmp.
  examples:
    positive:
      - 'Nov 20 14:00:00 web01 bash[900]: HISTORY: cp /etc/shadow /tmp/.s; chmod 644 /tmp/.s'
    negative:
      - 'Nov 20 14:00:01 web01 bash[901]: HISTORY: cp /etc/hosts /tmp/hosts.bak'
      - 'Nov 20 14:00:02 web01 bash[902]: HISTORY: cp /etc/passwd /root/passwd.2026-11-20'

- id: mention.cred_kerberos_requestor_token
  title: '.NET KerberosRequestorSecurityToken class name'
  match:
    literal: ['KerberosRequestorSecurityToken']
  case_sensitive: false
  strength: medium
  attack: [T1558.003]
  telemetry: [windows_text]
  source:
    name: 'SigmaHQ: Suspicious Kerberos Ticket Request via PowerShell Script - ScriptBlock (frack113)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/powershell/powershell_script/posh_ps_request_kerberos_ticket.yml
    license: DRL-1.1
    upstream_id: a861d835-af37-4930-bcd6-5b178bfb54df
  rationale: >-
    PowerShell Kerberoasting (PowerView's Invoke-Kerberoast, Empire, and Rubeus per ATT&CK T1558.003) requests
    service tickets through this .NET class to crack them offline. The rule lists Kerberos development and
    troubleshooting scripts as false positives, so it is medium.
  examples:
    positive:
      - 'Add-Type -AssemblyName System.IdentityModel; New-Object System.IdentityModel.Tokens.KerberosRequestorSecurityToken -ArgumentList "MSSQLSvc/sql01.corp.example.org:1433"'
    negative:
      - 'Add-Type -AssemblyName System.IdentityModel'
      - 'klist tickets'
