- id: mention.sigma_git_internals_request
  title: 'GET request line for .git internals (narrow form of Sigma "Source Code Enumeration Detection by Keyword")'
  match:
    anchored: 'GET /[^ \n]{0,200}\.git/(?:config|HEAD|index|logs/HEAD|ORIG_HEAD|packed-refs)'
  case_sensitive: false
  strength: medium
  attack: [T1595.003]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Source Code Enumeration Detection by Keyword (James Ahearn)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/web/webserver_generic/web_source_code_enumeration.yml
    license: DRL-1.1
    upstream_id: 953d460b-f810-420a-97a2-cfca4c98e602
  rationale: >-
    The upstream keyword is just '.git/', which matches every CI and deployment log. It is narrowed to an HTTP GET for
    repository internals, the request a source-code dumper makes against an exposed .git directory. Scanners make it
    constantly against internet-facing servers, so it is medium.
  examples:
    positive:
      - '203.0.113.55 - - [20/Nov/2026:16:10:00 +0000] "GET /.git/config HTTP/1.1" 200 312 "-" "Mozilla/5.0"'
    negative:
      - 'Nov 20 16:11:00 ci01 runner[700]: Cloning into /builds/app/.git/ ... done'
      - '10.0.3.8 - - [20/Nov/2026:16:12:00 +0000] "GET /docs/git/config.html HTTP/1.1" 200 812 "-" "Mozilla/5.0"'

- id: mention.sigma_cisco_clear_logs
