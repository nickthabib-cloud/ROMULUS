    license: DRL-1.1
    upstream_id: ceb407f6-8277-439b-951f-e4210e3ed956
  rationale: >-
    In AAA command accounting, clearing the local log buffer or configuration archive removes evidence on the device.
    Administrators sometimes clear buffers while troubleshooting, so it is medium.
