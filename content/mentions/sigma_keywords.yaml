- id: mention.sigma_jvm_jndimanager
  title: 'Log4j JndiManager class name in application text (Sigma JVM JNDI injection rule)'
  match:
    literal: ['org.apache.logging.log4j.core.net.JndiManager']
  case_sensitive: false
  strength: medium
  attack: [T1190]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Potential JNDI Injection Exploitation In JVM Based Application (Moti Harmats)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/application/jvm/java_jndi_injection_exploitation_attempt.yml
    license: DRL-1.1
    upstream_id: bb0e9cec-d4da-46f5-997f-22efc59f3dca
  rationale: >-
    Log4j's JndiManager shows up in stack traces when a JNDI lookup inside a logged message is resolved, which is the
    Log4Shell path. Applications that use JNDI appenders on purpose also log it, so it is medium.
  examples:
    positive:
      - '2026-11-20 15:31:00 WARN  [main] org.apache.logging.log4j.core.net.JndiManager: Error looking up JNDI resource [ldap://203.0.113.52:1389/a]'
    negative:
      - '2026-11-20 15:32:00 INFO  [main] org.apache.logging.log4j.core.config.ConfigurationFactory: using log4j2.xml'
      - '2026-11-20 15:33:00 INFO  [main] org.apache.logging.log4j.core.appender.RollingFileAppender: rolled over'

- id: mention.sigma_jvm_jndi_ldap
  title: 'JDK LDAP JNDI class names in application text (Sigma JVM JNDI injection rule)'
  match:
    literal: ['com.sun.jndi.ldap.']
  case_sensitive: false
  strength: weak
  attack: [T1190]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Potential JNDI Injection Exploitation In JVM Based Application (Moti Harmats)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/application/jvm/java_jndi_injection_exploitation_attempt.yml
    license: DRL-1.1
    upstream_id: bb0e9cec-d4da-46f5-997f-22efc59f3dca
  rationale: >-
    Exploited JNDI lookups leave com.sun.jndi.ldap frames in stack traces, but every Java application that talks to
    a directory uses the same classes (LdapCtxFactory), so this is a weak candidate.
  examples:
    positive:
      - '2026-11-20 15:34:00 ERROR [exec-4] javax.naming.CommunicationException: 203.0.113.52:1389 at com.sun.jndi.ldap.Connection.<init>(Connection.java:252)'
    negative:
      - '2026-11-20 15:35:00 INFO  [main] org.springframework.ldap.core.LdapTemplate: bound to ldaps://dc01.corp.example.org'
      - '2026-11-20 15:36:00 INFO  [main] javax.naming.InitialContext: environment loaded'

- id: mention.sigma_jvm_ognl_exception
  title: 'OGNL exception name in application text (Sigma "Potential OGNL Injection Exploitation In JVM Based Application")'
  match:
    literal: ['org.apache.commons.ognl.OgnlException']
  case_sensitive: false
  strength: medium
  attack: [T1190]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Potential OGNL Injection Exploitation In JVM Based Application (Moti Harmats)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/application/jvm/java_ognl_injection_exploitation_attempt.yml
    license: DRL-1.1
    upstream_id: 4d0af518-828e-4a04-a751-a7d03f3046ad
  rationale: >-
    OGNL evaluation failures follow injection attempts against Struts and Confluence (CVE-2017-5638, CVE-2022-26134).
    Application bugs throw the same exception, so it is medium. The rule's 'ExpressionSyntaxException' keyword is a
    separate weak entry.
  examples:
    positive:
      - '2026-11-20 15:37:00 ERROR [http-8090-3] org.apache.commons.ognl.OgnlException: source is null for getProperty(null, "class")'
    negative:
      - '2026-11-20 15:38:00 INFO  [main] com.opensymphony.xwork2.config.providers.XmlConfigurationProvider: Parsing struts.xml'
      - '2026-11-20 15:39:00 ERROR [http-8090-3] java.lang.NullPointerException: user is null'

- id: mention.sigma_jvm_weak_exceptions
  title: JVM process-execution and expression exceptions (Sigma JVM application rules)
  match:
    literal: ['ExpressionSyntaxException', 'java.lang.ProcessImpl', 'java.lang.ProcessBuilder', 'Cannot run program']
  case_sensitive: false
  strength: weak
  attack: [T1190]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Process Execution Error In JVM Based Application (Moti Harmats)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/application/jvm/java_rce_exploitation_attempt.yml
    license: DRL-1.1
    upstream_id: d65f37da-a26a-48f8-8159-3dde96680ad2
  rationale: >-
    A JVM failing to start an external program, or an expression syntax error, can be an injected command that did not
    resolve. Ordinary applications start helper programs and hit missing binaries too, so these are weak candidates.
    ExpressionSyntaxException comes from the OGNL rule 4d0af518-828e-4a04-a751-a7d03f3046ad.
  examples:
    positive:
      - '2026-11-20 15:40:00 ERROR [exec-7] java.io.IOException: Cannot run program "curl": error=2, No such file or directory at java.lang.ProcessBuilder.start'
    negative:
      - '2026-11-20 15:41:00 INFO  [main] com.example.App: started in 2.1s'
      - '2026-11-20 15:42:00 WARN  [main] com.example.Cache: eviction took 120ms'

