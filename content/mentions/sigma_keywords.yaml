- id: mention.sigma_jvm_local_file_read
  title: FileNotFoundException on a traversal path (Sigma "Potential Local File Read Vulnerability In JVM Based Application")
  match:
    anchored: 'FileNotFoundException[^\n]{0,200}/\.\./\.\./\.\.'
  case_sensitive: false
  strength: medium
  attack: [T1190, T1083]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Potential Local File Read Vulnerability In JVM Based Application (Moti Harmats)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/application/jvm/java_local_file_read.yml
    license: DRL-1.1
    upstream_id: e032f5bc-4563-4096-ae3b-064bab588685
  rationale: >-
    The rule needs both 'FileNotFoundException' and '/../../..'. Java prints the exception class before the path, so
    the anchored form keeps the meaning. A traversal path that reached the file API is a path-traversal attempt; a
    buggy relative path can produce it too, so it is medium.
  examples:
    positive:
      - '2026-11-20 15:52:00 ERROR [exec-5] java.io.FileNotFoundException: /opt/app/static/../../../../etc/shadow (Permission denied)'
    negative:
      - '2026-11-20 15:53:00 ERROR [exec-5] java.io.FileNotFoundException: /opt/app/static/logo.png (No such file or directory)'
      - '2026-11-20 15:54:00 INFO  [exec-5] com.example.Files: resolved ../config/app.yml'

- id: mention.sigma_ssti_strong
  title: Template-injection gadget strings (Sigma "Server Side Template Injection Strings")
  match:
    literal:
      - 'freemarker.template.utility.Execute'
      - '.getClass().forName(''javax.script.ScriptEngineManager'')'
      - 'T(org.apache.commons.io.IOUtils)'
  case_sensitive: false
  strength: strong
  attack: [T1190]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Server Side Template Injection Strings (Nasreddine Bencherchali, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/web/webserver_generic/web_ssti_in_access_logs.yml
    license: DRL-1.1
    upstream_id: ada3bc4f-f0fd-42b9-ba91-e105e8af7342
  rationale: >-
    FreeMarker Execute, the ScriptEngineManager reflection chain and the SpEL IOUtils type reference are
    command-execution gadgets; they appear in requests only as injection payloads. The rule's GET-only and not-404
    conditions cannot be expressed and are dropped.
  examples:
    positive:
      - '203.0.113.53 - - [20/Nov/2026:15:55:00 +0000] "GET /preview?t=<#assign ex=\"freemarker.template.utility.Execute\"?new()>${ex(\"id\")} HTTP/1.1" 200 12 "-" "-"'
      - '203.0.113.71 - - [21/Nov/2026:09:01:59 +0000] "GET /preview?t=${.getClass().forName(''javax.script.ScriptEngineManager'').toString()} HTTP/1.1" 400 0 "-" "-"'
      - '203.0.113.71 - - [21/Nov/2026:09:02:00 +0000] "GET /preview?t=${T(org.apache.commons.io.IOUtils).toString()} HTTP/1.1" 400 0 "-" "-"'
    negative:
      - '10.0.3.8 - - [20/Nov/2026:15:56:00 +0000] "GET /docs/freemarker/template-guide HTTP/1.1" 200 812 "-" "Mozilla/5.0"'
      - '2026-11-20 15:57:00 INFO  [main] freemarker.cache: Template loaded: welcome.ftl'

- id: mention.sigma_ssti_openers
  title: Template expression openers in a parameter (Sigma "Server Side Template Injection Strings")
  match:
    literal: ['=%7B%7B', '=<%=', '=%3C%25=']
  case_sensitive: false
  strength: medium
  attack: [T1190]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Server Side Template Injection Strings (Nasreddine Bencherchali, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/web/webserver_generic/web_ssti_in_access_logs.yml
    license: DRL-1.1
    upstream_id: ada3bc4f-f0fd-42b9-ba91-e105e8af7342
  rationale: >-
    A parameter value that starts with a template opener ({{ or <%=) is the usual SSTI probe. Search boxes can carry
    the same text, so it is medium. The three-character keywords '={{', '=${' and '=@(' are below the minimum
    literal length and are not imported; '=$%7B' is a weak entry.
  examples:
    positive:
      - '203.0.113.53 - - [20/Nov/2026:15:58:00 +0000] "GET /greet?name=%7B%7B7*7%7D%7D HTTP/1.1" 200 12 "-" "-"'
    negative:
      - '10.0.3.8 - - [20/Nov/2026:15:59:00 +0000] "GET /greet?name=alice HTTP/1.1" 200 12 "-" "Mozilla/5.0"'
      - '10.0.3.8 - - [20/Nov/2026:16:00:00 +0000] "GET /static/%7Bhash%7D.js HTTP/1.1" 404 0 "-" "Mozilla/5.0"'

- id: mention.sigma_ssti_dollar_brace
