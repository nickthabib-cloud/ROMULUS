    upstream_id: e09eb557-96d2-4de9-ba2d-30f712a5afd3
  rationale: >-
    Combines the 'rm -r', 'rm -f' and 'rm -rf' keywords; the rotated-file exclusion is kept as in the plain rm entry.
  examples:
    positive:
      - 'Nov 20 14:57:00 web01 bash[673]: HISTORY: rm -rf /var/log/syslog; rm -rf /var/log/auth.log'
    negative:
