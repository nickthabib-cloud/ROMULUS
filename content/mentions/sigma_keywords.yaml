- id: mention.sigma_cisco_pki_export
  title: Cisco PKI key export (Sigma "Cisco Crypto Commands")
  match:
    literal: ['crypto pki export']
  case_sensitive: false
  strength: medium
  attack: [T1552.004]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Cisco Crypto Commands (Austin Clark)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/network/cisco/aaa/cisco_cli_crypto_actions.yml
    license: DRL-1.1
    upstream_id: 1f978c6a-4415-47fb-aca5-736a44d7ca3d
  rationale: >-
    Exporting a trustpoint's keys and certificates takes private key material off the device. It is rare in normal
    operations but done during migrations, so it is medium. The import and trustpoint keywords are a weak entry.
  examples:
    positive:
      - 'Nov 20 16:16:00 tacacs01 tac_plus[900]: 10.0.0.1 netadmin tty1 10.0.9.9 stop cmd=crypto pki export TP-SELF pkcs12 tftp://203.0.113.56/k.p12 password ***** <cr>'
    negative:
      - 'Nov 20 16:17:00 tacacs01 tac_plus[900]: 10.0.0.1 netadmin tty1 10.0.9.9 stop cmd=show crypto pki certificates <cr>'
      - 'Nov 20 16:18:00 tacacs01 tac_plus[900]: 10.0.0.1 netadmin tty1 10.0.9.9 stop cmd=crypto key generate rsa modulus 2048 <cr>'

- id: mention.sigma_cisco_pki_import
  title: Cisco PKI import or trustpoint change (Sigma "Cisco Crypto Commands")
  match:
