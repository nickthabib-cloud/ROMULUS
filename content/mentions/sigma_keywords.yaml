  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Linux Command History Tampering (Patrick Bareiss)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_shell_clear_cmd_history.yml
    license: DRL-1.1
    upstream_id: fdc88d25-96fb-4b7c-9633-c0e417fdbd4e
  rationale: >-
    Setting the history file size to zero or turning the bash history option off stops the session from being
    recorded; the strings come from intrusion kits and campaign reports the rule cites. 'unset HISTFILE' is
    commented out upstream as false-positive prone and is not imported.
  examples:
    positive:
      - 'Nov 20 13:53:00 web01 bash[657]: HISTORY: export HISTFILESIZE=0; export HISTSIZE=0'
      - 'Nov 21 09:01:08 web01 bash[4100]: HISTORY: empty_bash_history'
      - 'Nov 21 09:01:09 web01 bash[4100]: HISTORY: shopt -ou history; cd /tmp'
