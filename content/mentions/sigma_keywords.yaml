      - 'Nov 20 16:39:00 sw01 %DOT1X-5-SUCCESS: Authentication successful for client (0011.2233.4455) on Interface Gi1/0/5'

- id: mention.sigma_cisco_kron
  title: 'Cisco kron policy-list or occurrence command text (Sigma "Cisco Modify Configuration")'
  match:
