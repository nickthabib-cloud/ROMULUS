      - '10.0.3.8 - - [20/Nov/2026:16:03:00 +0000] "GET /a?b=%7Bc%7D HTTP/1.1" 200 12 "-" "Mozilla/5.0"'

- id: mention.sigma_webshell_query_commands
  title: 'Windows commands as URL parameter values (Sigma "Windows Webshell Strings")'
  match:
    literal:
      - '=whoami'
      - '=net%20user'
      - '=net+user'
      - '=net%2Buser'
      - '=cmd%20/c%'
      - '=cmd+/c+'
      - '=cmd%2B/c%'
      - '=cmd%20/r%'
      - '=cmd+/r+'
      - '=cmd%2B/r%'
      - '=cmd%20/k%'
      - '=cmd+/k+'
      - '=cmd%2B/k%'
      - '=powershell%'
      - '=powershell+'
      - '=tasklist%'
      - '=tasklist+'
      - '=wmic%'
      - '=wmic+'
      - '=ipconfig'
      - '=certutil'
      - '=copy%20%5C%5C'
      - '=dsquery%'
      - '=dsquery+'
      - '=nltest%'
      - '=nltest+'
  case_sensitive: false
  strength: medium
  attack: [T1505.003]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Windows Webshell Strings (Florian Roth, Nasreddine Bencherchali, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/web/webserver_generic/web_win_webshells_in_access_logs.yml
    license: DRL-1.1
    upstream_id: 7ff9db12-1b94-4a79-ba68-a2402c5d6729
  rationale: >-
    A query parameter whose value starts with a Windows recon or execution command is how operators drive web shells
    over GET. Internet scanners probe the same way and wikis about OS commands can match, so it is medium; the
    response code and whether the script exists decide it. A search for a phrase that starts with one of these
    commands ('?q=net+user+guide') matches too; that is the rule's documented false positive. The rule's GET-method
    condition cannot be expressed.
  examples:
    positive:
      - '203.0.113.54 - - [20/Nov/2026:16:04:00 +0000] "GET /aspnet_client/system_web/s.aspx?c=cmd+/c+whoami HTTP/1.1" 200 41 "-" "-"'
    negative:
      - '10.0.3.8 - - [20/Nov/2026:16:05:00 +0000] "GET /search?q=network+users HTTP/1.1" 200 812 "-" "Mozilla/5.0"'
      - '10.0.3.8 - - [20/Nov/2026:16:06:00 +0000] "GET /reports?type=cmdb HTTP/1.1" 200 812 "-" "Mozilla/5.0"'

