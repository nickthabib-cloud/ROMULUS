- id: mention.sigma_crontab_replace
  title: 'crontab REPLACE log text (narrow form of Sigma "Modifying Crontab")'
  match:
    anchored: '\) REPLACE \('
  case_sensitive: true
  strength: weak
  attack: [T1053.003]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Modifying Crontab (Pawel Mazur)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/cron/lnx_cron_crontab_file_modification.yml
    license: DRL-1.1
    upstream_id: af202fd3-7bff-4212-a25a-fb34606cfcbe
  rationale: >-
    The upstream keyword is the bare word REPLACE, which would match SQL and countless other lines. It is narrowed to
    the crontab daemon's own form '(user) REPLACE (user)'. Any crontab edit produces it, so it is a weak candidate: the
    question is which user and what the new crontab runs.
  examples:
    positive:
      - 'Nov 20 14:30:00 web01 crontab[4410]: (www-data) REPLACE (www-data)'
    negative:
      - 'Nov 20 14:31:00 db01 mysqld[700]: Query REPLACE INTO sessions VALUES (1, ''x'')'
      - 'Nov 20 14:32:00 web01 crontab[4411]: (root) LIST (root)'

