- id: mention.sigma_clamav_trojan
  title: ClamAV Trojan detection (Sigma "Relevant ClamAV Message")
  match:
    anchored: 'Trojan[^\n]{0,200}FOUND'
  case_sensitive: true
  strength: strong
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Relevant ClamAV Message (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/clamav/lnx_clamav_relevant_message.yml
    license: DRL-1.1
    upstream_id: 36aa86ca-fd9d-4456-814e-d3b1b8e1e0bb
  rationale: >-
    Translation of 'Trojan*FOUND', matched case-sensitively as ClamAV prints it (signature family, then FOUND) so that
    prose such as 'no trojan found' does not match. A ClamAV trojan hit is a scanner verdict on a real file; the
    benign case is a test signature or a researcher's sample directory.
  examples:
    positive:
      - 'Nov 20 14:15:00 web01 clamd[880]: /var/www/uploads/inv.php: Unix.Trojan.Mirai-7100807-0 FOUND'
    negative:
      - 'Nov 20 14:16:00 web01 clamd[880]: /var/www/uploads/inv.pdf: OK'
      - 'Nov 20 14:17:00 web01 clamd[880]: SelfCheck: Database status OK. no trojan found in quarantine'

