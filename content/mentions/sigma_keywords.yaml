      - 'Nov 20 14:20:00 web01 freshclam[881]: daily.cld updated (version: 27100, sigs: 2063000)'

- id: mention.sigma_clamav_webshell
  title: ClamAV web shell detection (Sigma "Relevant ClamAV Message")
