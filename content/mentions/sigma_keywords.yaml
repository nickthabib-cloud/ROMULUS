- id: mention.sigma_syslog_rm
  title: 'rm /var/log/syslog command text (Sigma "Commands to Clear or Remove the Syslog - Builtin")'
  match:
    anchored: 'rm /var/log/syslog(?:[^.]|$)'
  case_sensitive: false
  strength: medium
  attack: [T1685.006]
  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Commands to Clear or Remove the Syslog - Builtin (Max Altgelt, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_clear_syslog.yml
    license: DRL-1.1
    upstream_id: e09eb557-96d2-4de9-ba2d-30f712a5afd3
  rationale: >-
    Deleting the live syslog destroys evidence. The upstream rule excludes rotated files ('/syslog.'); the trailing
    '(?:[^.]|$)' keeps that exclusion without a lookahead. Admins freeing a full disk do this too, so it is medium.
  examples:
    positive:
      - 'Nov 20 14:54:00 web01 bash[670]: HISTORY: rm /var/log/syslog'
    negative:
      - 'Nov 20 14:55:00 web01 bash[671]: HISTORY: rm /var/log/syslog.4.gz'
      - 'Nov 20 14:56:00 web01 bash[672]: HISTORY: rm /var/log/nginx/old.log'

