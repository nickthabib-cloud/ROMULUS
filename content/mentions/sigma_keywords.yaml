- id: mention.sigma_history_disable
  title: 'History-off settings text (Sigma "Linux Command History Tampering")'
  match:
    literal: ['empty_bash_history', 'export HISTFILESIZE=0', 'shopt -ou history', 'shopt -uo history']
  case_sensitive: false
  strength: strong
