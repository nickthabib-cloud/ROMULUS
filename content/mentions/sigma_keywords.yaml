- id: mention.sigma_cisco_config_register
  title: 'Cisco config-register 0x2142 or 0x2100 command text (Sigma "Cisco Denial of Service")'
  match:
    literal: ['config-register 0x2100', 'config-register 0x2142']
  case_sensitive: false
  strength: medium
  telemetry: [any]
  source:
    name: 'SigmaHQ: Cisco Denial of Service (Austin Clark)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/network/cisco/aaa/cisco_cli_dos.yml
    license: DRL-1.1
    upstream_id: d94a35f0-7a29-45f6-90a0-80df6159967c
  rationale: >-
    0x2142 makes the router ignore its startup configuration (the password-recovery path) and 0x2100 boots into
    ROMMON; both take the device out of its intended configuration. Password recovery by the owner is the benign
    case, so it is medium. 'shutdown' is not imported: it is an everyday interface command.
  examples:
    positive:
      - 'Nov 20 16:34:00 rtr01 %PARSER-5-CFGLOG_LOGGEDCMD: User:netadmin logged command:config-register 0x2142'
    negative:
      - 'Nov 20 16:35:00 rtr01 %PARSER-5-CFGLOG_LOGGEDCMD: User:netadmin logged command:config-register 0x2102'
      - 'Nov 20 16:36:00 rtr01 %SYS-5-RELOAD: Reload requested by netadmin on vty0. Reload Reason: Reload Command.'

- id: mention.sigma_cisco_dot1x_disabled
  title: '802.1X ''force-authorized'' or port-control removal command text (Sigma "Cisco Dot1x Disabled")'
  match:
    literal:
      - 'access-session port-control force-authorized'
      - 'authentication port-control force-authorized'
      - 'dot1x port-control force-authorized'
      - 'no access-session port-control'
      - 'no authentication port-control'
      - 'no dot1x port-control'
      - 'no dot1x system-auth-control'
  case_sensitive: false
  strength: medium
  attack: [T1599]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Cisco Dot1x Disabled (Luc Génaux)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/network/cisco/aaa/cisco_cli_dot1x_disabled.yml
    license: DRL-1.1
    upstream_id: ef0ff092-a24a-4fbc-beea-06c08d53e085
  rationale: >-
    Forcing a port authorized or removing 802.1X lets any device onto the access network without network access
    control. Technicians do it for printers or troubleshooting, so it is medium.
  examples:
