- id: mention.sigma_java_payload_strings
  title: OGNL and Java expression payloads (Sigma "Java Payload Strings")
  match:
    literal:
      - '%24%7B%28%23a%3D%40'
      - '${(#a=@'
      - '%24%7B%40java'
      - '${@java'
      - '%2F%24%7B%23'
  case_sensitive: false
  strength: strong
  attack: [T1190]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Java Payload Strings (frack113, Harjot Singh, @cyb3rjy0t)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/web/webserver_generic/web_java_payload_in_access_logs.yml
    license: DRL-1.1
    upstream_id: 583aa0a2-30b1-4d62-8bf3-ab73689efe6c
  rationale: >-
    OGNL expression openers and Runtime.exec calls, plain and URL-encoded, from Confluence (CVE-2022-26134,
    CVE-2021-26084) and Struts exploits. They do not occur in normal requests or application logs. The short keywords
    '/${#' and 'new+java.' and the Runtime.exec keywords, which Java applications also log, are a separate medium
    entry.
  examples:
    positive:
      - '203.0.113.51 - - [20/Nov/2026:15:21:00 +0000] "GET /%24%7B%40java.lang.Runtime%40getRuntime%28%29.exec%28%22id%22%29%7D/ HTTP/1.1" 302 0 "-" "python-requests/2.31"'
      - '203.0.113.71 - - [21/Nov/2026:09:01:34 +0000] "GET /%24%7B%28%23a%3D%40java.lang.Runtime%40getRuntime%28%29.exec%28%22id%22%29%7D/ HTTP/1.1" 400 0 "-" "-"'
      - '203.0.113.51 - - [21/Nov/2026:09:01:35 +0000] "POST /struts2/upload.action HTTP/1.1" 200 0 "-" "-" body="queryString=aaa${(#a=@org.apache.commons.io.IOUtils@toString(@java.lang.Runtime@getRuntime().exec(\"id\").getInputStream(),\"utf-8\"))}"'
      - '203.0.113.51 - - [21/Nov/2026:09:01:36 +0000] "POST /pages/createpage-entervariables.action HTTP/1.1" 200 0 "-" "-" body="queryString=${@java.lang.Runtime@getRuntime().exec(\"id\")}"'
      - '203.0.113.71 - - [21/Nov/2026:09:01:37 +0000] "GET /%2F%24%7B%23java.lang.Runtime%40getRuntime%28%29.exec%28%22id%22%29%7D/ HTTP/1.1" 400 0 "-" "-"'
    negative:
      - '10.0.3.8 - - [20/Nov/2026:15:22:00 +0000] "GET /wiki/spaces/ENG/pages/123 HTTP/1.1" 200 812 "-" "Mozilla/5.0"'
      - '2026-11-20 15:23:00 INFO  [main] java.lang.Runtime: available processors 8'

- id: mention.sigma_java_payload_unicode_quote
  title: 'Unicode escape u0022 before a java.* class name (Sigma "Java Payload Strings")'
  match:
    anchored: 'u0022java\.lang\.(?:Runtime|ProcessBuilder|ProcessImpl)\b'
  case_sensitive: false
  strength: strong
  attack: [T1190]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Java Payload Strings (frack113, Harjot Singh, @cyb3rjy0t)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/web/webserver_generic/web_java_payload_in_access_logs.yml
    license: DRL-1.1
    upstream_id: 583aa0a2-30b1-4d62-8bf3-ab73689efe6c
  rationale: >-
    The rule's 'u0022java' keyword with the class-name context it is there for: OGNL payloads against Confluence and
    Struts escape the quote as \u0022 before java.lang.Runtime or ProcessBuilder. The bare keyword is too short to
    stand alone, and escaped class names in ordinary JSON error output (\u0022java.lang.NullPointerException) are
    not matched.
  examples:
    positive:
      - '203.0.113.51 - - [20/Nov/2026:15:21:30 +0000] "GET /pages/x.action?q=%7B%40java.lang.Class%40forName(%5Cu0022java.lang.Runtime%5Cu0022) HTTP/1.1" 302 0 "-" "-" decoded="\u0022java.lang.Runtime\u0022"'
    negative:
      - '2026-11-20 15:21:31 INFO  [main] api: {"lang":"\u0022javascript\u0022"}'
      - '10.0.3.8 - - [20/Nov/2026:15:21:32 +0000] "GET /search?q=java HTTP/1.1" 200 812 "-" "Mozilla/5.0"'
      - '2026-11-20 15:21:33 ERROR [api] {"error":"\u0022java.lang.NullPointerException\u0022"}'

- id: mention.sigma_java_payload_short
  title: Short Java payload fragments (Sigma "Java Payload Strings")
  match:
    literal: ['/${#', 'new+java.', 'getRuntime().exec(', 'getRuntime%28%29.exec%28']
  case_sensitive: false
  strength: medium
  attack: [T1190]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Java Payload Strings (frack113, Harjot Singh, @cyb3rjy0t)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/web/webserver_generic/web_java_payload_in_access_logs.yml
    license: DRL-1.1
    upstream_id: 583aa0a2-30b1-4d62-8bf3-ab73689efe6c
  rationale: >-
    Short fragments of OGNL and Java object creation in URLs, and the Runtime.exec call that most Java RCE payloads
    end in. The fragments are short enough that search parameters and template URLs can contain them, and
    applications that run helper programs log Runtime.exec calls, so they are medium.
  examples:
    positive:
      - '203.0.113.51 - - [20/Nov/2026:15:24:00 +0000] "GET /${#context[\"xwork.MethodAccessor.denyMethodExecution\"]=false}.action HTTP/1.1" 404 0 "-" "-"'
    negative:
      - '10.0.3.8 - - [20/Nov/2026:15:25:00 +0000] "GET /search?q=java+tutorial HTTP/1.1" 200 812 "-" "Mozilla/5.0"'
      - '10.0.3.8 - - [20/Nov/2026:15:26:00 +0000] "GET /static/${version}/app.js HTTP/1.1" 404 0 "-" "Mozilla/5.0"'

- id: mention.sigma_log4j_jndi_lookup
  title: Log4Shell JNDI lookup strings (Sigma "Log4j RCE CVE-2021-44228 Generic")
  match:
    literal:
      - '${jndi:ldap:/'
      - '${jndi:rmi:/'
      - '${jndi:ldaps:/'
      - '${jndi:dns:/'
      - '/$%7bjndi:'
      - '%24%7bjndi:'
      - '$%7Bjndi:'
      - '%2524%257Bjndi'
      - '%2F%252524%25257Bjndi%3A'
      - '${jndi:${lower:'
      - '${::-j}${'
      - '${jndi:nis'
      - '${jndi:nds'
      - '${jndi:corba'
      - '${jndi:iiop'
      - 'Reference Class Name: foo'
      - '${${env:BARFOO:-j}'
      - '${::-l}${::-d}${::-a}${::-p}'
      - '${base64:JHtqbmRp'
      - '${${env:ENV_NAME:-j}ndi${env:ENV_NAME:-:}$'
      - '${${lower:j}ndi:'
      - '${${upper:j}ndi:'
      - '${${::-j}${::-n}${::-d}${::-i}:'
  case_sensitive: false
  strength: strong
  attack: [T1190]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Log4j RCE CVE-2021-44228 Generic (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules-emerging-threats/2021/Exploits/CVE-2021-44228/web_cve_2021_44228_log4j.yml
    license: DRL-1.1
    upstream_id: 5ea8faa8-db8b-45be-89b0-151b84c82702
  rationale: >-
    JNDI lookup expressions and their obfuscations are Log4Shell exploitation or scanning wherever they appear (URLs,
    headers, usernames, application logs). The upstream rule excludes Nessus probes ('w.nessus.org/nessus',
    '/nessus}'); the schema has no exclusion, so an authorized Nessus scan is the known benign match here and the
    probe's callback host tells them apart.
