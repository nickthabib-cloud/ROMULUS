  telemetry: [linux_text]
  source:
    name: 'SigmaHQ: Potential Suspicious BPF Activity - Linux (Red Canary idea, Nasreddine Bencherchali)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/builtin/lnx_potential_susp_ebpf_activity.yml
