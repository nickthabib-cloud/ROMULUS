- id: mention.tool_cryptominer_user_agent
  title: Cryptominer user agent
  match:
    literal: ['"XMRig/', '"ccminer']
  case_sensitive: false
  strength: strong
  attack: [T1496.001]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Crypto Miner User Agent (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/web/proxy_generic/proxy_ua_cryptominer.yml
    license: DRL-1.1
    upstream_id: fa935401-513b-467b-81f4-f9e77aa0dd78
  rationale: >-
    The rule's 'startswith' on the user agent becomes a match right after the opening quote of a quoted user-agent
    field (combined log format). XMRig and ccminer contacting a pool or proxy over HTTP mean resource hijacking; no business software uses
    these agents.
  examples:
    positive:
      - '10.0.5.17 - - [20/Nov/2026:16:21:00 +0000] "GET /job HTTP/1.1" 200 120 "-" "XMRig/6.21.0 (Linux x86_64) libuv/1.44.2 gcc/12.2.0"'
    negative:
      - '10.0.3.8 - - [20/Nov/2026:16:21:01 +0000] "GET / HTTP/1.1" 200 812 "-" "Mozilla/5.0 (X11; Linux x86_64)"'
      - '10.0.3.8 - - [20/Nov/2026:16:21:02 +0000] "GET /mining-faq HTTP/1.1" 404 0 "-" "curl/8.5.0"'

- id: mention.tool_mining_pool_url
  title: Stratum mining pool URL
  match:
    literal: ['stratum+tcp://', 'stratum+ssl://', 'stratum+tls://', 'stratum1+tcp://', 'stratum2+tcp://']
  case_sensitive: false
  strength: strong
  attack: [T1496.001]
  telemetry: [any]
  source:
    name: MITRE ATT&CK Enterprise 20.0, T1496.001 Compute Hijacking
    url: https://attack.mitre.org/techniques/T1496/001
    license: MITRE ATT&CK Terms of Use (royalty-free, copyright notice retained)
    upstream_id: T1496.001
  rationale: >-
    Stratum is the pool protocol miners use; a stratum URL in a command line, config or log means a miner is
    configured. Procedure examples under the technique (Lucifer, TeamTNT, Hildegard) deploy XMRig against pools.
    Sanctioned mining is not expected on mission networks.
  examples:
    positive:
      - 'Nov 20 16:22:00 web01 bash[1018]: HISTORY: ./kswapd0 -o stratum+tcp://pool.supportxmr.com:3333 -u 4A1b... -k --donate-level 1'
    negative:
      - 'Nov 20 16:22:01 web01 bash[1019]: HISTORY: curl -s https://api.example.org/strata/v1'
      - 'Nov 20 16:22:02 web01 app[700]: connected to tcp://mq01:5672'

- id: mention.tool_xmrig_options
  title: XMRig name or donation option
  match:
    literal: ['xmrig', '--donate-level']
  case_sensitive: false
  strength: strong
  attack: [T1496.001]
  telemetry: [any]
  source:
    name: XMRig README (xmrig)
    url: https://github.com/xmrig/xmrig/blob/b2ca72480c58d197e18c885d9fc1a0c8d517e60a/README.md
    license: GPL-3.0
    upstream_id: donate-level
  rationale: >-
    XMRig is the miner in most Linux and container compromises; its name and the --donate-level option persist even
    when the binary is renamed to look like a kernel thread.
  examples:
    positive:
      - 'Nov 20 16:23:00 web01 bash[1020]: HISTORY: nohup /tmp/.k/kworker --donate-level 1 -o 203.0.113.80:443 &'
    negative:
      - 'Nov 20 16:23:01 web01 bash[1021]: HISTORY: nice -n 10 ./build.sh --level 3'
      - 'Nov 20 16:23:02 web01 top: 1022 www-data 20 0 kworker/u8:2'

