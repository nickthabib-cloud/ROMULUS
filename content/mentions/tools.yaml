- id: mention.tool_impacket_wmiexec_output
  title: Impacket wmiexec output file on the ADMIN$ share
  match:
    anchored: '\\\\127\.0\.0\.1\\ADMIN\$\\__[0-9]{10}\.[0-9]{1,7}'
  case_sensitive: false
  strength: strong
  attack: [T1047, T1021.002]
  telemetry: [windows_text]
  source:
    name: Impacket examples/wmiexec.py (Fortra)
    url: https://github.com/fortra/impacket/blob/691fc1836693c4fdb78dc776c88f0b58ed5ac96f/examples/wmiexec.py
    license: Apache-1.1-style (Impacket modified Apache Software License)
    upstream_id: OUTPUT_FILENAME
  rationale: >-
    wmiexec runs 'cmd.exe /Q /c <command> 1> \\127.0.0.1\ADMIN$\__<epoch.fraction> 2>&1' and reads the file back
    over SMB; the double-underscore epoch file name is set in the script. No Windows component writes command output
    to ADMIN$ this way.
  examples:
    positive:
      - 'cmd.exe /Q /c whoami 1> \\127.0.0.1\ADMIN$\__1700000000.123456 2>&1'
    negative:
      - 'net use \\127.0.0.1\ADMIN$ /user:corp\admin'
      - 'copy C:\Temp\agent.msi \\fileserver\ADMIN$\Temp\'

- id: mention.tool_impacket_smbexec_artifacts
  title: Impacket smbexec service command and output name
  match:
    literal: ['%COMSPEC% /Q /c ', '\__output_']
  case_sensitive: false
  strength: strong
  attack: [T1569.002, T1021.002]
  telemetry: [windows_text]
  source:
    name: Impacket examples/smbexec.py (Fortra)
    url: https://github.com/fortra/impacket/blob/691fc1836693c4fdb78dc776c88f0b58ed5ac96f/examples/smbexec.py
    license: Apache-1.1-style (Impacket modified Apache Software License)
    upstream_id: RemoteShell
  rationale: >-
    smbexec creates a service whose binary path starts with the literal '%COMSPEC% /Q /c ' and writes output to
    '\__output_<8 letters>' on a share; both strings are fixed in the script. Service installs (event 7045) carrying
    them are lateral movement.
  examples:
    positive:
      - 'A service was installed in the system. Service Name: XKcDeFgH Service File Name: %COMSPEC% /Q /c echo cd ^> \\%COMPUTERNAME%\C$\__output_aBcDeFgH 2^>^&1 > %SYSTEMROOT%\x.bat'
    negative:
      - 'A service was installed in the system. Service Name: CorpAgent Service File Name: "C:\Program Files\Corp\agent.exe"'
      - 'C:\Windows\system32\cmd.exe /c echo backup complete'

- id: mention.tool_netexec_pwned_label
  title: NetExec/CrackMapExec admin-access banner
  match:
    literal: ['Pwn3d!']
  case_sensitive: true
  strength: strong
  attack: [T1078, T1021.002]
  telemetry: [any]
  source:
    name: NetExec default configuration (nxc.conf)
    url: https://github.com/Pennyw0rth/NetExec/blob/955a6b5b3c35cfe1f30a40d4ec2bc96e6c74c238/nxc/data/nxc.conf
    license: BSD-2-Clause
    upstream_id: pwn3d_label
  rationale: >-
    NetExec and CrackMapExec print 'Pwn3d!' when tested credentials give administrative access to a host; captured
    terminal output or logs with it record a successful credential test across the network.
  examples:
    positive:
      - 'SMB  10.0.0.12  445  WS012  [+] corp\svc_backup:Summer2026! (Pwn3d!)'
    negative:
      - 'SMB  10.0.0.12  445  WS012  [-] corp\svc_backup:Summer2026! STATUS_LOGON_FAILURE'
      - 'Nov 20 16:03:00 ws01 app[700]: user pwned the leaderboard'

