# Mention patterns for offensive and dual-use tools: command syntax, banners, default artefact names, user agents
# and protocol strings that the tools themselves emit. Names are the weakest layer (a tool is renamed in seconds),
# so command and artefact strings are preferred, and a match never says the tool ran. Post-exploitation tools are
# strong because an authorized test is the only realistic benign source; scanners and tunnels are medium because
# administrators and authorized testers use them.

- id: mention.tool_mimikatz_modules
  title: Mimikatz module commands
  match:
    literal:
      - 'sekurlsa::'
      - 'lsadump::'
      - 'kerberos::golden'
      - 'kerberos::ptt'
      - 'kerberos::list'
      - 'privilege::debug'
      - 'token::elevate'
      - 'dpapi::'
      - 'crypto::capi'
      - 'crypto::cng'
      - 'vault::cred'
      - 'vault::list'
      - 'misc::skeleton'
      - 'misc::memssp'
      - 'misc::printnightmare'
      - 'ts::multirdp'
      - 'ts::mstsc'
      - '::aadcookie'
      - '::ngcsign'
  case_sensitive: false
  strength: strong
  attack: [T1003.001, T1003.006, T1558.001, T1550.003]
  telemetry: [any]
  source:
    name: 'SigmaHQ: HackTool - Mimikatz Execution (Teymur Kheirkhabarov, oscd.community, David ANDRE, Tim Shelton)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_hktl_mimikatz_command_line.yml
    license: DRL-1.1
    upstream_id: a642964e-bead-4bed-8910-1bb4d63e3b4d
  rationale: >-
    The module::command syntax is Mimikatz's own (and of its ports such as pypykatz and Invoke-Mimikatz): LSASS
    secrets, DCSync, golden tickets, skeleton keys, DPAPI. The rule's generic module prefixes ('process::', 'rpc::',
    'token::', 'crypto::') are narrowed to specific commands because C++ and Rust logs print such scopes.
  examples:
    positive:
      - 'C:\Users\Public\m.exe "privilege::debug" "sekurlsa::logonpasswords" exit'
      - 'powershell -c "Invoke-Mimikatz -Command ''\"lsadump::dcsync /domain:corp.example.org /user:krbtgt\"''"'
    negative:
      - '2026-11-20 16:00:00 ERROR [worker] boost::process::child exited with code 1'
      - '2026-11-20 16:00:01 WARN  [main] crypto::hash: sha256 backend selected'

