- id: mention.tool_cobalt_strike_msse_pipe
  title: Cobalt Strike artifact-kit default pipe (MSSE-<n>-server)
  match:
    anchored: '\\MSSE-[0-9]{1,5}-server\b'
  case_sensitive: false
  strength: strong
  attack: [T1071, T1570]
  telemetry: [windows_text]
  source:
    name: 'SigmaHQ: CobaltStrike Named Pipe (Florian Roth, Wojciech Lesicki)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/pipe_created/pipe_created_hktl_cobaltstrike.yml
    license: DRL-1.1
    upstream_id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
  rationale: >-
    Cobalt Strike's default artifact kit stages the beacon through a pipe named MSSE-<number>-server. The rule's
    other prefixes (status_, mojo_, samr_ and similar) imitate legitimate pipes and are left out as too
    collision-prone for free text; the postex_ and msagent_ defaults are separate entries.
  examples:
    positive:
      - 'Pipe Created: PipeName: \MSSE-1234-server Image: C:\Windows\System32\rundll32.exe'
    negative:
      - 'Pipe Created: PipeName: \MsFteWds Image: C:\Windows\System32\SearchIndexer.exe'
      - 'Pipe Created: PipeName: \MSSQL$SQLEXPRESS\sql\query Image: C:\Program Files\Microsoft SQL Server\sqlservr.exe'

