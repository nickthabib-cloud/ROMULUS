- id: mention.tool_mirai_loader_tokens
  title: Mirai loader shell tokens
  match:
    literal: ['/bin/busybox ECCHI', 'ECCHI: applet not found', '/bin/busybox IHCCE', '/bin/busybox wget; /bin/busybox tftp;']
  case_sensitive: true
  strength: strong
  attack: [T1110.001, T1105, T1059.004]
  telemetry: [any]
  source:
    name: Mirai source code, loader headers and server (jgamblin mirror)
    url: https://github.com/jgamblin/Mirai-Source-Code/blob/4889a6f797237f1d4210839bcefd9f89c57c0770/loader/src/headers/includes.h
    license: GPL-3.0
    upstream_id: TOKEN_QUERY
  rationale: >-
    The Mirai loader probes each shell it brute-forces with '/bin/busybox ECCHI' and expects 'ECCHI: applet not
    found', then checks for wget and tftp; derivatives keep these tokens. They appear in telnet/SSH session captures,
    honeypot and IoT shell logs only when Mirai-family loaders are at work.
  examples:
    positive:
      - 'cmd: enable; system; shell; sh; /bin/busybox ECCHI'
      - 'telnet session 203.0.113.90 -> 10.0.9.5: /bin/busybox wget; /bin/busybox tftp; /bin/busybox ECCHI'
    negative:
      - 'Nov 20 16:25:00 cam01 sh[300]: /bin/busybox --help'
      - 'Nov 20 16:25:01 cam01 sh[300]: busybox: applet ifconfig started'

- id: mention.tool_onion_address
  title: Tor onion service address
  match:
    anchored: '\.onion\b'
  case_sensitive: false
  strength: medium
  attack: [T1090.003, T1573]
  telemetry: [any]
  source:
    name: IETF RFC 7686, The ".onion" Special-Use Domain Name
    url: https://www.rfc-editor.org/rfc/rfc7686
    license: IETF Trust Legal Provisions (BCP 78)
    upstream_id: RFC 7686
  rationale: >-
    .onion names resolve only through Tor; one in a command line, proxy log or DNS log means Tor is in use or is being
    attempted, which ransomware negotiation pages, C2 over Tor and exfiltration all rely on. Users with Tor Browser
    are the benign case, so it is medium. Word boundaries keep names such as 'theonion.com' out.
  examples:
    positive:
      - 'Nov 20 16:26:00 web01 bash[1023]: HISTORY: curl --socks5-hostname 127.0.0.1:9050 http://abcdefghijklmnopqrstuvwxyz234567abcdefghijklmnopqrstuv.onion/u'
    negative:
      - '10.0.3.8 - - [20/Nov/2026:16:26:01 +0000] "GET https://www.theonion.com/ HTTP/1.1" 200 812 "-" "Mozilla/5.0"'
      - 'Nov 20 16:26:02 web01 app[700]: loaded recipe: onion soup'
