- id: mention.lolbin_regsvr32_scrobj_scriptlet
  title: 'regsvr32 /i: scriptlet text with scrobj.dll'
  match:
    anchored: 'regsvr32(?:\.exe)?["'']? [^\n]{0,60}[/-]i:[^\n]{0,200}scrobj\.dll'
  case_sensitive: false
  strength: strong
  attack: [T1218.010]
  telemetry: [any]
  source:
    name: LOLBAS project, Regsvr32.exe
