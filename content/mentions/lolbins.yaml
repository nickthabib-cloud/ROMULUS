- id: mention.lolbin_rundll32_vbscript
  title: 'rundll32 text with a vbscript: argument'
  match:
    anchored: 'rundll32(?:\.exe)?["'']? {1,3}["'']?vbscript:'
  case_sensitive: false
  strength: strong
  attack: [T1218.011, T1059.005]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Suspicious Rundll32 Invoking Inline VBScript (Florian Roth, Nextron Systems)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_rundll32_inline_vbs.yml
    license: DRL-1.1
    upstream_id: 1cc50f3f-1fc8-4acf-b2e9-6f172e1fdebd
  rationale: >-
    The rule's inline-VBScript case keyed on its protocol handler: rundll32 given a vbscript: argument runs script
    through mshtml (Poweliks-style). Windows components never start rundll32 with a vbscript: argument.
  examples:
    positive:
      - 'rundll32.exe vbscript:"\..\mshtml,#135 "+String(CreateObject("WScript.Shell").Run("powershell -nop -c whoami"),0)'
    negative:
      - 'rundll32.exe shell32.dll,Control_RunDLL desk.cpl'
      - 'C:\Windows\System32\rundll32.exe C:\Windows\System32\printui.dll,PrintUIEntry /il'

