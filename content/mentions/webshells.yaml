    license: DRL-1.1
    upstream_id: 818f7b24-0fba-4c49-a073-8b755573b9c7
  rationale: >-
    Author-composed request-side shape. The cited rule detects these recon commands (whoami, id, uname, ifconfig,
    hostname, cat, pwd) as children of a web server process; this entry looks for the same commands passed in a cmd
    parameter. Internet scanners send the same probes to guessed shell paths, so it is medium; a 200 response from an
    unexpected script decides.
  examples:
    positive:
      - '203.0.113.65 - - [20/Nov/2026:17:10:00 +0000] "GET /uploads/x.php?cmd=whoami HTTP/1.1" 200 9 "-" "curl/8.0"'
      - '203.0.113.65 - - [20/Nov/2026:17:10:01 +0000] "GET /uploads/x.php?cmd=cat%20/etc/passwd HTTP/1.1" 200 1802 "-" "curl/8.0"'
    negative:
      - '10.0.3.8 - - [20/Nov/2026:17:10:02 +0000] "GET /api?cmd=identify HTTP/1.1" 200 12 "-" "Mozilla/5.0"'
      - '10.0.3.8 - - [20/Nov/2026:17:10:03 +0000] "GET /portal?cmd=list&page=2 HTTP/1.1" 200 812 "-" "Mozilla/5.0"'

- id: mention.webshell_php_double_extension
  title: Upload name with a PHP extension before an image extension
  match:
    anchored: '\.php[0-9s]?\.(?:jpe?g|png|gif|bmp)\b'
  case_sensitive: false
  strength: medium
  attack: [T1505.003, T1036.008]
  telemetry: [any]
  source:
    name: PayloadsAllTheThings, Upload Insecure Files
    url: https://github.com/swisskyrepo/PayloadsAllTheThings/blob/08ea40e77db3f42ef8f20c65196f3936a19b6c86/Upload%20Insecure%20Files/README.md
    license: MIT
    upstream_id: Upload Insecure Files
  rationale: >-
    'shell.php.jpg' (reverse double extension) passes image-only upload filters but executes as PHP on misconfigured
    Apache. Users rarely name images this way, so it is medium; whether the file was requested afterwards decides.
  examples:
    positive:
      - '203.0.113.66 - - [20/Nov/2026:17:11:00 +0000] "POST /profile/avatar HTTP/1.1" 200 12 "-" "-" filename="shell.php.jpg"'
    negative:
      - '10.0.3.8 - - [20/Nov/2026:17:11:01 +0000] "GET /img/photo.jpg HTTP/1.1" 200 81234 "-" "Mozilla/5.0"'
      - '10.0.3.8 - - [20/Nov/2026:17:11:02 +0000] "GET /docs/php.html HTTP/1.1" 200 812 "-" "Mozilla/5.0"'

- id: mention.webshell_rtlo_filename
  title: 'Right-to-left override in a request or upload name'
  match:
    literal: ['%E2%80%AE']
  case_sensitive: false
  strength: medium
  attack: [T1036.002, T1505.003]
  telemetry: [any]
  source:
    name: PayloadsAllTheThings, Upload Insecure Files
    url: https://github.com/swisskyrepo/PayloadsAllTheThings/blob/08ea40e77db3f42ef8f20c65196f3936a19b6c86/Upload%20Insecure%20Files/README.md
    license: MIT
    upstream_id: Upload Insecure Files
  rationale: >-
    The URL-encoded right-to-left override character makes 'name.%E2%80%AEphp.jpg' display as an image name while the
    real extension is different. Bidirectional text in URLs is rare outside this trick, so it is medium.
  examples:
    positive:
      - '203.0.113.67 - - [20/Nov/2026:17:12:00 +0000] "POST /upload HTTP/1.1" 200 12 "-" "-" filename="name.%E2%80%AEphp.jpg"'
    negative:
      - '10.0.3.8 - - [20/Nov/2026:17:12:01 +0000] "GET /search?q=%E2%80%9Cquoted%E2%80%9D HTTP/1.1" 200 812 "-" "Mozilla/5.0"'
      - '10.0.3.8 - - [20/Nov/2026:17:12:02 +0000] "GET /files/report%20final.pdf HTTP/1.1" 200 81234 "-" "Mozilla/5.0"'
