    license: LGPL-3.0
    upstream_id: DodgyStrings
  rationale: >-
    Names of widely distributed PHP web shells. Inside a file or response it is the shell itself; in an access log it
    is often an internet scanner probing for an existing copy, so it is medium. The c99shell name is carried by the
    antivirus-family entry.
  examples:
    positive:
      - '203.0.113.62 - - [20/Nov/2026:17:05:00 +0000] "POST /images/r57shell.php HTTP/1.1" 200 5120 "-" "Mozilla/5.0"'
