- id: mention.webshell_chopper_command_markers
  title: China Chopper command output markers
  match:
    literal: ['&ipconfig&echo', '&quser&echo', '&whoami&echo', '&c:&echo', '&cd&echo', '&dir&echo', '&echo [E]', '&echo [S]']
  case_sensitive: false
  strength: strong
  attack: [T1505.003, T1059.003]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Chopper Webshell Process Pattern (Florian Roth, MSTI)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/windows/process_creation/proc_creation_win_webshell_chopper.yml
    license: DRL-1.1
    upstream_id: fa3c117a-bc0d-416e-a31b-0c0e80653efb
  rationale: >-
    China Chopper wraps every command as 'cd /d "path"&<cmd>&echo [S]&cd&echo [E]' so its client can split output;
    a cmd.exe line with these markers is a Chopper session. The rule ties it to w3wp.exe; as free text the markers
    alone are distinctive.
  examples:
    positive:
      - 'cmd.exe /c cd /d "c:\inetpub\wwwroot\"&whoami&echo [S]&cd&echo [E]'
      - 'cmd.exe /c cd /d "c:\inetpub\wwwroot\"&ipconfig&echo [S]&cd&echo [E]'
      - 'cmd.exe /c cd /d "c:\inetpub\wwwroot\"&quser&echo [S]&cd&echo [E]'
      - 'cmd.exe /c cd /d "c:\inetpub\wwwroot\"&c:&echo [S]&cd&echo [E]'
      - 'cmd.exe /c cd /d "c:\inetpub\wwwroot\"&dir&echo [S]&cd&echo [E]'
    negative:
      - 'cmd.exe /c echo backup started & robocopy C:\data D:\data'
      - 'cmd.exe /c dir C:\inetpub\logs'

- id: mention.webshell_regeorg_banner
  title: reGeorg tunnel health response
  match:
    literal: ['Georg says, ''All seems fine''']
  case_sensitive: true
  strength: strong
  attack: [T1505.003, T1572, T1090.001]
  telemetry: [any]
  source:
    name: reGeorg tunnel.php (SensePost)
    url: https://github.com/sensepost/reGeorg/blob/1ca54c2a6ab22ded150d04cff8fdb796990b1ced/tunnel.php
    license: CC-BY-NC-SA-4.0
    upstream_id: tunnel.php
  rationale: >-
    Every reGeorg tunnel script (php, aspx, ashx, jsp) answers a GET with this sentence; a response body, proxy or
    DLP log containing it shows a SOCKS tunnel planted on a web server.
  examples:
    positive:
      - '10.0.3.40 - - [20/Nov/2026:17:08:00 +0000] "GET /images/tunnel.php HTTP/1.1" 200 33 body="Georg says, ''All seems fine''"'
    negative:
      - '10.0.3.8 - - [20/Nov/2026:17:08:01 +0000] "GET /health HTTP/1.1" 200 2 body="ok"'
      - 'Nov 20 17:08:02 web01 app[700]: George says hello'

- id: mention.webshell_regeorg_commands
  title: reGeorg tunnel command parameters
  match:
    literal: ['cmd=connect&target', 'cmd=disconnect', 'cmd=forward']
  case_sensitive: false
  strength: medium
  attack: [T1505.003, T1572, T1090.001]
  telemetry: [any]
  source:
    name: 'SigmaHQ: Webshell ReGeorg Detection Via Web Logs (Cian Heasley)'
    url: https://github.com/SigmaHQ/sigma/blob/698f0912f571d5fac3bf8c51f5421139834a011c/rules/web/webserver_generic/web_webshell_regeorg.yml
    license: DRL-1.1
    upstream_id: 2ea44a60-cfda-11ea-87d0-0242ac130003
  rationale: >-
    reGeorg clients drive the tunnel with cmd=connect&target=, cmd=forward and cmd=disconnect query strings. The rule
    also requires POST with no referer or user agent, which cannot be expressed; applications with the same
    parameter names exist, so it is medium. The rule's generic 'cmd=read' is left out.
  examples:
    positive:
      - '203.0.113.64 - - [20/Nov/2026:17:09:00 +0000] "POST /images/tunnel.aspx?cmd=connect&target=10.0.0.10&port=3389 HTTP/1.1" 200 0 "-" "-"'
    negative:
      - '10.0.3.8 - - [20/Nov/2026:17:09:01 +0000] "GET /api?cmd=status HTTP/1.1" 200 12 "-" "Mozilla/5.0"'
      - '10.0.3.8 - - [20/Nov/2026:17:09:02 +0000] "GET /mail?cmd=compose HTTP/1.1" 200 812 "-" "Mozilla/5.0"'

