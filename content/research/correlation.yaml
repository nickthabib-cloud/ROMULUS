  - id: COR-14
    title: Lateral SSH chain across hosts
    claim: "On A, <user> ran ssh to B (exec); flow A->B:22; on B, sshd accepted <user2> from A:port (K4); the chain continues to C (links: tuple-strong for B's auth, hypothesis for A's exec)."
    host_side: {family: "auditd_exec | journal_sshd", fields: [process.executable, process.argv, process.auid, user.name, source.ip, source.port]}
