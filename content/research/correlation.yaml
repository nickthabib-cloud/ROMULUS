    techniques: [T1572, T1090.001, T1021.004]
    backlog: [BL-14]
  - id: COR-12
    title: Large outbound transfer joined to staging and archiving on the host
    claim: "H sent N bytes to D (toserver/toclient ratio R, network aggregate); before it, <exe> on H archived/read <paths> and a process connected to D (link: tuple-partial hypothesis)."
    host_side: {family: "auditd_exec | auditd_path | auditd_net", fields: [process.executable, process.argv, file.path, destination.ip]}
