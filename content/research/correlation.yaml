# ROMULUS research: host <-> network correlation catalog (round 1, 2026-10-19).
# Detections that need both a host-side typed event and a network-side typed event. Families and fields refer to
# content/research/telemetry_families.yaml. Schema and workflow: docs/research/README.md.
#
# Spec §1 governs every entry: correlation can connect supported facts, adjust priority and propose pivots; it
# cannot create an observed fact. Each side keeps its own citation and its own wording ("process X attempted a
# connection to D:P" is a host fact; "a flow D:P carried N bytes" is a network fact). The link between them is
# labelled with the confidence grade below and, unless the grade is `exact`, worded as a hypothesis.
schema_version: 1

join_keys:
  - id: K1
    name: community_id
    description: >-
      Community ID v1 hash of the flow 5-tuple (plus seed). Present on every Suricata EVE record (inside
      event.original, normalized as network.community_id) and on Arkime sessions (communityId); Zeek can emit it.
      ROMULUS can compute it for any record with a full 5-tuple.
    valid_for: network <-> network (EVE <-> EVE, EVE <-> Arkime, EVE/Arkime <-> Zeek, Arkime <-> PCAP)
    caveats:
      - Same seed on every producer (default 0); record the seed in the SourceProfile.
      - A NAT device between two sensors changes the tuple; the hash then differs (no join, not a negative).
      - Port reuse makes the same hash recur over long windows; join only within overlapping flow time ranges.
  - id: K2
    name: host-alias + destination ip + destination port + time window
    description: >-
      Outbound host connect (auditd SOCKADDR) gives the remote address and port but not the kernel-assigned source
      port. Join to network flows whose source IP is one of the host's addresses (alias table), destination
      matches, and flow start lies within [connect_ts - skew, connect_ts + skew + setup].
    valid_for: host connect -> network flow
    caveats:
      - Several flows to the same destination from the same host within the window make the join ambiguous; the
        join records the candidate count and is never collapsed to one silently.
      - NAT between the host and the sensor replaces the source IP; the alias table must carry the post-NAT
        address with provenance, or the join is not attempted.
  - id: K3
    name: accept-side tuple
    description: >-
      Inbound host accept/accept4 SOCKADDR gives the peer address and peer (source) port; the local port comes
      from the listening socket (bind record or service knowledge) and the local IP from the alias table. That is
      a full 5-tuple, so ROMULUS can compute community_id and join exactly to the network record.
    valid_for: host accept -> network flow (inbound sessions, bind shells, relays)
    caveats:
      - Assumes no NAT between sensor and host; a load balancer or reverse proxy changes the peer tuple.
  - id: K4
    name: sshd client tuple
    description: >-
      sshd logs "Accepted <method> for <user> from <ip> port <port>", so the journal auth event carries the
      client IP and source port; with the server's alias and port 22 (or the configured port) that is a full
      5-tuple for joining to EVE ssh/flow, Arkime and Zeek ssh records.
    valid_for: auth event -> network SSH session
    caveats:
      - Same NAT caveat as K3. Message grammar is anchored and typed (normalize.py), so it is not substring matching.
  - id: K5
    name: file name + host + time
    description: >-
      Network file transfer (EVE fileinfo file.name, HTTP URI basename, Arkime http.uri) joined to a host file
      create (auditd PATH CREATE) or exec (PATH item 0 / exe basename) on the receiving host within a window.
    valid_for: network transfer -> host file/exec
    caveats:
      - Names are attacker-chosen text; a name match is a weak link (temporal grade) unless a size or hash also
        matches (fileinfo size vs PATH has no size; hashes need EDR or osquery).
  - id: K6
    name: domain -> resolved address -> connect
    description: >-
      DNS answer (needs dns.answers normalization) from the resolver to client C for name N with address A,
      followed by host connect to A from C, or by a flow C -> A.
    valid_for: DNS -> host connect / flow
    caveats:
      - When the sensor sits upstream of a caching resolver, the visible client is the resolver; host attribution
        needs resolver query logs (dns_server).
  - id: K7
    name: audit login session (auid + ses)
    description: >-
      auditd stamps every syscall with the login uid (auid) and session id (ses) of the PAM session that started
      it, even across su/sudo. Joins host events from one interactive login (sshd USER_LOGIN/USER_START -> execs
      -> connects). Intra-host, kernel-assigned, exact.
    valid_for: host <-> host within one login session
    caveats:
      - ses is not yet normalized (process.session_id proposed). Daemons have auid=unset (4294967295).
  - id: K8
    name: pid / ppid lineage
    description: Process tree from exec events (pid, ppid) within a host and time window; intra-host.
    valid_for: host <-> host
    caveats:
      - pid reuse over long windows and missing parent execs (started before the window) are unknowns; the parent
        is "not observed", never assumed.

confidence_grades:
  - grade: exact
    hypothesis: false
    meaning: >-
      The two records describe the same network flow by a producer-assigned or computed identifier (K1) with
      overlapping time. Used only network <-> network. The joined view may be presented as one observed flow
      seen by two sensors.
  - grade: tuple_strong
    hypothesis: true
    meaning: >-
      Host and network records agree on the full 5-tuple (K3, K4) with overlapping time and exactly one candidate.
      Worded as "the host accept/auth event and the network session share a 5-tuple (link inferred; assumes no
      address translation between host and sensor)".
  - grade: tuple_partial
    hypothesis: true
    meaning: >-
      Host connect and network flow agree on host alias, destination IP and port within the skew window (K2).
      Strength depends on the candidate count in the window, which the link records. Worded as a hypothesis.
  - grade: temporal
    hypothesis: true
    meaning: >-
      Same host or client, time proximity and a shared attacker-controllable attribute (file name, domain, URI)
      (K5, K6 without answers). Weak; raises priority and proposes a pivot only.

prerequisites:
  - id: P1
    name: host alias table
    description: >-
      Per hunt, host.name -> set of IP addresses with validity interval and provenance: operator-supplied asset
      inventory, DHCP leases, and self-derived aliases from tuple_strong sshd joins (K4: the network session's
      server IP is an alias of the host that logged the Accepted line). Unknown aliases leave host<->network joins
      not attempted (recorded as such), never "no match".
  - id: P2
    name: clock-skew estimate per host and sensor
    description: >-
      Estimated from K4 joins (sshd auth time vs network session start) and K3 joins; applied as the skew term of
      K2 windows. Recorded in the hunt manifest; joins outside the calibrated skew are not attempted silently.
  - id: P3
    name: sensor visibility map
    description: >-
      Which host pairs and egress paths each sensor observes (inetfw, corpdns in the lab). A missing network
      record for an unobserved path is "not observed by sensor", never a negative.
  - id: P4
    name: auditd_net normalizer (connect/bind/accept + SOCKADDR) and process.session_id
    description: Required by every host-side network entry below; tracked as BL-01.

correlations:
  - id: COR-01
    title: Process outbound connection joined to a flagged network flow
    claim: "Process <exe> (pid, user) on host H attempted a connection to D:P; a network session H->D:P observed at the sensor was flagged by <alert/rule> (link: hypothesis)."
    host_side: {family: auditd_net, fields: [syscall.name, destination.ip, destination.port, process.executable, process.pid, process.uid, process.auid, event.outcome]}
    network_side: {family: "eve_alert | eve_flow | arkime_spi", fields: [source.ip, destination.ip, destination.port, flow.start, network.community_id, alert.signature]}
    join: [K2, K1]
    confidence: tuple_partial
    lab_feasibility: "needs P1, P2, P4; data present (16k connect syscalls, EVE alert/flow at inetfw)"
    value: Turns a network alert into "which process on which host" — the analyst's first question.
    techniques: [T1071, T1105, T1571, T1095, T1041]
    backlog: [BL-03, BL-23]
  - id: COR-02
    title: Interpreter, shell or web-service account with an external socket
    claim: "<interpreter> running as <service account> on H attempted a connection to external D:P; network shows the session established with N bytes (link: hypothesis)."
    host_side: {family: auditd_net, fields: [process.executable, process.user, process.auid, destination.ip, destination.port, event.outcome]}
    network_side: {family: "eve_flow | arkime_spi", fields: [flow.state, flow.bytes_toserver, flow.bytes_toclient, flow.start, flow.end]}
    join: [K2]
    confidence: tuple_partial
    lab_feasibility: "host side alone is a direct-behaviour finding once BL-01 exists; network side adds outcome (connect alone is 'attempted')"
    value: Detects reverse shells and web-shell callbacks regardless of tool name; resolves the c2_channel class miss.
    techniques: [T1059.004, T1059.006, T1505.003, T1190, T1071]
    backlog: [BL-01, BL-03]
  - id: COR-03
    title: Beaconing session joined to its host process
    claim: "Connections H->D:P recur every ~T s with jitter J (network aggregate); host connect records to D:P at matching times come from <exe> (link: hypothesis)."
    host_side: {family: auditd_net, fields: [process.executable, process.pid, destination.ip, destination.port]}
    network_side: {family: "eve_flow | arkime_spi", fields: [source.ip, destination.ip, destination.port, flow.start, flow.bytes_toserver, flow.bytes_toclient]}
    join: [K2]
    confidence: tuple_partial
    lab_feasibility: "network aggregate feasible now (BL-04); attribution needs P4"
    value: Beacon timing is generic across C2 frameworks; the process gives the host-side pivot.
    techniques: [T1071, T1573, T1102, T1029]
    backlog: [BL-04, BL-03]
  - id: COR-04
    title: Long-lived session joined to its host process
    claim: "Session H<->D:P lasted T and moved N bytes; the connect/accept on H belongs to <exe> (link: hypothesis)."
    host_side: {family: auditd_net, fields: [process.executable, syscall.name, destination.ip, destination.port, source.ip, source.port]}
    network_side: {family: "eve_flow | arkime_spi", fields: [flow.start, flow.end, session.duration, flow.bytes_toserver, flow.bytes_toclient]}
    join: [K2, K3]
    confidence: tuple_partial
    lab_feasibility: "needs P4; Arkime gives duration directly"
    value: Interactive C2 and tunnels show as long sessions; process attribution separates them from backups and admin sessions.
    techniques: [T1572, T1090, T1021.004]
    backlog: [BL-03]
  - id: COR-05
    title: SSH authentication joined to the network SSH session (client software, HASSH, server key)
    claim: "sshd on H accepted <method> for <user> from C:port; the network session with the same 5-tuple advertised client <software>/HASSH <h> (first seen for this account) (link: tuple-strong hypothesis)."
    host_side: {family: journal_sshd, fields: [user.name, source.ip, source.port, auth.method, event.outcome, ssh.key_fingerprint]}
    network_side: {family: "eve_ssh | arkime_spi | zeek_ssh", fields: [ssh.client.software, ssh.client.hassh, ssh.server.hassh, source.ip, source.port, destination.ip, destination.port]}
    join: [K4]
    confidence: tuple_strong
    lab_feasibility: "host side normalized; eve_ssh needs field normalization (BL-14); 69 EVE ssh records"
    value: A login with a client library never used by that account (paramiko, Go x/crypto, libssh) or a new server host key on a known host is a strong lateral-movement or MITM lead.
    techniques: [T1021.004, T1078, T1133, T1557]
    backlog: [BL-14, BL-08]
  - id: COR-06
    title: Download flow followed by execution of the downloaded path
    claim: "Client H received <file.name> (<size>, magic <m>) from D over <proto>; within W minutes a file with that basename was created/executed on H by <exe> (link: temporal hypothesis)."
    host_side: {family: "auditd_path | auditd_exec", fields: [file.path, file.nametype, process.executable, process.cwd]}
    network_side: {family: "eve_fileinfo | eve_http | arkime_spi", fields: [file.name, file.size, file.magic, url.original, http.content_type, destination.ip]}
    join: [K5, K2]
    confidence: temporal
    lab_feasibility: "both sides present; PATH normalizer needed; fileinfo magic availability unverified"
    value: Generic ingress-tool-transfer -> execution chain; strengthens to tuple_partial when the downloader's connect (BL-01) matches the transfer flow.
    techniques: [T1105, T1204.002, T1570, T1036.008]
    backlog: [BL-22]
  - id: COR-07
    title: Inbound web request followed by a web-service child process
    claim: "Request <method> <uri> from S to web host H (status <code>) at t; at t+delta the web-service account on H executed <exe> (link: temporal hypothesis)."
    host_side: {family: auditd_exec, fields: [process.executable, process.user, process.ppid, process.argv]}
    network_side: {family: "apache_access | eve_http", fields: [source.ip, http.request.method, url.original, http.response.status_code]}
    join: ["host + time (seconds)", K3]
    confidence: temporal
    lab_feasibility: "both sides normalized today; K3 upgrade needs accept SOCKADDR on the web server (P4)"
    value: Names the request (and attacker source) that most likely triggered a web-shell or RCE execution.
    techniques: [T1190, T1505.003]
    backlog: [BL-16]
  - id: COR-08
    title: Inbound exploit alert followed by service-account process activity on the target
    claim: "IDS alert <sig> from S to H:P at t; at t+delta the service listening on P (or its account) spawned <exe> (link: temporal hypothesis)."
    host_side: {family: auditd_exec, fields: [process.executable, process.user, process.parent.executable]}
    network_side: {family: eve_alert, fields: [alert.signature, alert.category, source.ip, destination.ip, destination.port]}
    join: ["destination alias = host + time", K3]
    confidence: temporal
    lab_feasibility: "both sides normalized today (alert stack + exec)"
    value: Distinguishes alerts that were followed by execution from the many that were not; ranks the alert stack.
    techniques: [T1190, T1210, T1212, T1499.004]
    backlog: [BL-23]
  - id: COR-09
    title: DNS resolution joined to the connection and the process
    claim: "Client H resolved N to A at t; H's process <exe> connected to A:P at t+delta (link: tuple-partial hypothesis)."
    host_side: {family: auditd_net, fields: [process.executable, destination.ip, destination.port]}
    network_side: {family: "eve_dns | dns_server | zeek_dns", fields: [source.ip, dns.question.name, dns.answers.data]}
    join: [K6, K2]
    confidence: tuple_partial
    lab_feasibility: "needs dns.answers normalization and P4; the lab DNS sensor sits at the resolver (corpdns)"
    value: Gives every outbound connection a name and every suspicious name a process.
    techniques: [T1071.004, T1568, T1016.001, T1001.003]
    backlog: [BL-01, BL-25]
  - id: COR-10
    title: Login session to commands to network effects
    claim: "Login of <user> from S to H (auth event) opened audit session ses; the commands and connections stamped with that session are <list> (intra-host exact; auth-to-network link per K4)."
    host_side: {family: "journal_sshd | auditd_acct | auditd_exec | auditd_net", fields: [user.name, source.ip, process.auid, process.session_id, process.executable, process.argv]}
    network_side: {family: "eve_ssh | eve_flow", fields: [source.ip, source.port, destination.ip]}
    join: [K7, K4]
    confidence: tuple_strong
    lab_feasibility: "needs process.session_id normalization; data present"
    value: Answers "what did the attacker do after logging in" — the remote_login and discovery class misses.
    techniques: [T1078, T1021.004, T1133, T1087, T1082]
    backlog: [BL-05, BL-08]
  - id: COR-11
    title: SSH client with forwarding options joined to a long-lived SSH session (tunnel)
    claim: "ssh on H was executed with forwarding options (-R/-L/-D/-w, grouped flags parsed token-aware) to D; a session H->D:22 lasted T with N bytes (link: tuple-partial hypothesis)."
    host_side: {family: "auditd_exec | auditd_net", fields: [process.executable, process.argv, process.pid, destination.ip, destination.port]}
    network_side: {family: "eve_flow | eve_ssh | arkime_spi", fields: [flow.start, flow.end, flow.bytes_toserver, flow.bytes_toclient]}
