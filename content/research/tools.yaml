    platforms: [Linux, Windows, macOS]
    techniques: [T1572, T1133, T1219]
    behaviors:
      - behavior: Overlay network agent installed on a server, keeping sessions to coordination/relay infrastructure
        telemetry: [auditd_exec, eve_dns, eve_flow]
        detection: "BL-24 rare exe, vendor category list, BL-12 (WireGuard UDP on unusual ports)"
        disposition: "planned | BL-24"
    leads: []
  # ------------------------------------------------------------------ recon and scanning
  - id: tool.nmap_masscan
    name: nmap, masscan, zmap, rustscan, naabu
    category: scanner_recon
    dual_use: true
    attack_software: null
    platforms: [Linux, Windows, macOS]
    techniques: [T1046, T1018, T1595.001]
    behaviors:
      - behavior: One source probing many ports or hosts in a short window
        telemetry: [eve_flow, arkime_spi]
        detection: "net.port_scan (vertical), BL-09 (horizontal)"
        disposition: "covered | net.port_scan; horizontal planned"
      - behavior: Scanner run on a defended host
        telemetry: [auditd_exec, auditd_net]
        detection: "COR-13; raw SYN scans make no connect() calls, so host absence is not a negative"
        disposition: "planned | COR-13"
    leads:
      - {type: user_agent, value: "Nmap Scripting Engine user agent in HTTP probes", note: "self-reported; positive-only (net.tool_user_agent_http style)"}
  - id: tool.web_scanners
    name: nikto, nuclei, gobuster, ffuf, feroxbuster, dirb, wpscan, whatweb
    category: scanner_recon
    dual_use: true
    attack_software: null
    platforms: [Linux, Windows, macOS]
    techniques: [T1595.002, T1595.003]
    behaviors:
      - behavior: High-rate requests with many distinct paths and a high 404 ratio from one source
        telemetry: [apache_access, eve_http]
        detection: "web.scan_burst"
        disposition: "covered | web.scan_burst"
    leads:
      - {type: user_agent, value: "default tool user agents", note: "self-reported; net.tool_user_agent_http (positive-only)"}
  - id: tool.sqlmap
    name: sqlmap
    category: web_attack
    dual_use: true
    attack_software: null
    platforms: [Linux, Windows, macOS]
    techniques: [T1190, T1213.006]
    behaviors:
      - behavior: Bursts of parameter-mutated requests with SQL syntax, then database server process anomalies
        telemetry: [apache_access, eve_http, eve_alert, auditd_exec]
        detection: "web.scan_burst, net.suricata_alert_stack, T1505.001 DB-server child lineage"
        disposition: "covered | burst and alert leads; DB lineage planned"
    leads:
      - {type: user_agent, value: "sqlmap default user agent", note: "self-reported; positive-only"}
  - id: tool.smb_ad_enum_from_linux
    name: enum4linux(-ng), smbmap, smbclient, rpcclient, ldapsearch, kerbrute, NetExec/CrackMapExec
