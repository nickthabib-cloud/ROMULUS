    dual_use: true
    attack_software: null
    platforms: [Linux, Windows, macOS]
    techniques: [T1572, T1090.001, T1021.004]
    behaviors:
      - behavior: ssh with -R/-L/-D/-w (grouped as -fNR etc.), ProxyJump chains, or sshuttle routing traffic
        telemetry: [auditd_exec, auditd_net, eve_flow, eve_ssh]
        detection: "COR-11, T1572 entry"
        disposition: "planned | COR-11"
    leads:
      - {type: argv_token, value: "-R, -L, -D, -w and their grouped forms; -o ProxyCommand/ProxyJump", note: "token-aware; positive-only"}
  - id: tool.dns_tunnels
    name: iodine, dnscat2, dns2tcp
    category: tunnel_proxy
    dual_use: true
    attack_software: null
    platforms: [Linux, Windows, macOS]
    techniques: [T1071.004, T1572, T1048.003]
    behaviors:
      - behavior: Many long, high-entropy queries to one domain using TXT/NULL/CNAME/MX record types
        telemetry: [eve_dns, dns_server]
        detection: "BL-10, COR-16"
        disposition: "planned | BL-10"
    leads:
