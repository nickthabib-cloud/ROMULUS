  - id: tool.impacket
    name: Impacket (secretsdump, psexec/smbexec/wmiexec/atexec, GetUserSPNs, ntlmrelayx)
    category: credential
    dual_use: true
    attack_software: S0357
    platforms: [Linux, Windows]
    techniques: [T1003.006, T1021.002, T1569.002, T1558.003, T1557.001, T1047]
