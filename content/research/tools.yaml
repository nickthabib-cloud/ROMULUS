  - id: tool.responder_mitm
    name: Responder, mitm6, bettercap, ettercap, arpspoof
    category: packet_mitm
    dual_use: true
    attack_software: S0174
    platforms: [Linux]
    techniques: [T1557.001, T1557.002, T1557.003, T1040]
    behaviors:
