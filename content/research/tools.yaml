        telemetry: [auditd_net, eve_flow]
        detection: "BL-01, BL-04 (heartbeats), COR-04"
        disposition: "planned | BL-01"
    leads:
      - {type: default_port, value: "7000/tcp frps bind port", note: "positive-only"}
      - {type: file_path, value: "frpc.ini / frpc.toml configuration files", note: "positive-only"}
  - id: tool.ngrok
