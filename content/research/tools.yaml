# ROMULUS research: offensive and dual-use tool catalog, round 1 (Linux and network tooling), 2026-10-19.
# Spec §7 item 6. Behaviour first: each tool's `behaviors` are what survives renaming and recompilation, each with
# the detection that covers it and a disposition. `leads` are the cheap layer (names, argv tokens, default ports,
# protocol markers): POSITIVE-ONLY (ADR-004). A lead match proves that the text or default was seen, never that the
# tool ran, and its absence is never evidence that the tool is absent.
# attack_software: ATT&CK software IDs transcribed from attack.mitre.org/software (v20) on 2026-10-19 by reading the
# page through a summarizer; null means "not found as its own ATT&CK software entry". Re-verify all IDs against the
# vendored STIX bundle once it is approved (README "Open items").
# Disposition vocabulary is the register's: covered | planned | needs_telemetry | not_observable_by_design | deferred.
schema_version: 1
tools:
  # ------------------------------------------------------------------ C2 frameworks and implants
  - id: tool.sliver
    name: Sliver
    category: c2_framework
    dual_use: true
    attack_software: S0633
    platforms: [Linux, Windows, macOS]
    techniques: [T1071.001, T1071.004, T1573.002, T1095, T1105, T1055, T1572, T1090.001]
    behaviors:
      - behavior: Implant process opens outbound mTLS/HTTP(S)/DNS/WireGuard sessions at a regular interval
        telemetry: [auditd_net, eve_flow, eve_tls, eve_dns, arkime_spi]
        detection: "BL-01 (external connect by unusual exe), BL-04 beaconing, BL-13 rare JA3/self-signed cert"
        disposition: "planned | needs auditd_net normalizer and eve_tls fields"
      - behavior: Interactive shell and command execution spawned by the implant process
        telemetry: [auditd_exec, auditd_net]
        detection: "BL-02 shell started by a process holding an external connection"
        disposition: "planned | BL-02"
      - behavior: Implant executed from a temp or memory-backed path
        telemetry: [auditd_exec]
        detection: "host.exec_from_temp_dir (positive-only), BL-20 memfd/deleted exe"
        disposition: "covered | host.exec_from_temp_dir covers temp paths; BL-20 planned"
      - behavior: Pivot listeners (TCP/named pivots) relaying traffic between internal hosts
        telemetry: [auditd_net, eve_flow]
        detection: "COR-18 new listener with inbound sessions"
        disposition: "planned | COR-18"
    leads:
      - {type: dns_pattern, value: "high-entropy subdomain queries with TXT answers when the DNS C2 transport is used", note: "BL-10 shape, not a Sliver-specific marker"}
      - {type: tls, value: "self-signed implant certificates generated per server", note: "rarity only; no fixed subject to match"}
  - id: tool.metasploit
    name: Metasploit Framework / Meterpreter (incl. mettle Linux payloads)
    category: c2_framework
    dual_use: true
    attack_software: null
    platforms: [Linux, Windows, macOS, Network Devices]
    techniques: [T1190, T1059.004, T1071.001, T1095, T1573, T1105, T1055, T1620]
    behaviors:
      - behavior: Staged payload connects back to a handler, receives the stage, and runs it in memory
        telemetry: [auditd_net, auditd_exec, eve_flow, pcap]
        detection: "BL-01, BL-20 (mettle stages commonly run from memfd or deleted files), COR-02"
        disposition: "planned | BL-01/BL-20"
      - behavior: Exploit module against a public service followed by a shell from the service account
        telemetry: [eve_alert, auditd_exec]
        detection: "host.web_service_spawns_interpreter; COR-08 alert followed by service-account exec"
        disposition: "covered | web-service case covered; other services via BL-02"
      - behavior: Reverse shell payloads (bash/python/perl one-liners, cmd/unix/reverse_*)
        telemetry: [auditd_exec, auditd_net]
        detection: "BL-02 lineage; argv shapes positive-only"
        disposition: "planned | BL-02"
    leads:
      - {type: default_port, value: "4444/tcp handler default", note: "port alone is weak; many tools use 4444"}
      - {type: alert, value: "ET Open Metasploit/Meterpreter signatures in eve_alert", note: "IDS lead with its own FP rate"}
  - id: tool.cobalt_strike
    name: Cobalt Strike (Beacon; Linux via third-party CrossC2)
    category: c2_framework
    dual_use: true
    attack_software: S0154
    platforms: [Windows, Linux]
    techniques: [T1071.001, T1071.004, T1573.002, T1090.001, T1055, T1021.002]
    behaviors:
      - behavior: Beacon check-ins over HTTP(S)/DNS with configurable sleep and jitter
        telemetry: [eve_flow, eve_http, eve_dns, eve_tls, arkime_spi]
        detection: "BL-04 beaconing (jitter-tolerant), BL-13"
        disposition: "planned | BL-04"
      - behavior: Team server exposes default certificate and port when not hardened
        telemetry: [eve_tls, arkime_spi]
        detection: "BL-13 certificate rarity; indicator lead below"
        disposition: "planned | needs eve_tls normalization"
      - behavior: Lateral movement via service creation and admin-share writes (Windows)
        telemetry: [zeek_smb, zeek_dce_rpc, win_security]
        detection: "T1021.002 entry"
        disposition: "needs_telemetry | Windows/Zeek telemetry"
    leads:
      - {type: tls_subject, value: "default team-server certificate subject naming Cobalt Strike", note: "only unhardened deployments; positive-only"}
      - {type: default_port, value: "50050/tcp team server", note: "operator side; rarely visible from inside"}
  - id: tool.mythic
    name: Mythic (agents such as Poseidon, Merlin, Medusa)
    category: c2_framework
    dual_use: true
    attack_software: S0699
    platforms: [Linux, Windows, macOS]
    techniques: [T1071.001, T1573.002, T1105, T1059.004, T1059.006]
    behaviors:
      - behavior: Agent beaconing over HTTP(S)/websocket
        telemetry: [eve_flow, eve_tls, auditd_net]
        detection: "BL-04, BL-01"
        disposition: "planned | BL-04/BL-01"
      - behavior: Python or Go agent spawning shells
        telemetry: [auditd_exec]
        detection: "BL-02"
        disposition: "planned | BL-02"
    leads:
      - {type: default_port, value: "7443/tcp operator UI", note: "operator side"}
  - id: tool.havoc
    name: Havoc
    category: c2_framework
    dual_use: true
    attack_software: S1229
    platforms: [Windows]
    techniques: [T1071.001, T1573.002, T1055]
    behaviors:
      - behavior: Demon implant HTTP(S) check-ins
        telemetry: [eve_flow, eve_tls, arkime_spi]
        detection: "BL-04, BL-13"
        disposition: "planned | network side only from Linux sensors"
    leads: []
  - id: tool.brute_ratel
    name: Brute Ratel C4
    category: c2_framework
    dual_use: true
    attack_software: S1063
    platforms: [Windows, Linux]
    techniques: [T1071.001, T1071.004, T1573.002]
    behaviors:
      - behavior: Badger check-ins over HTTP(S)/DoH
        telemetry: [eve_flow, eve_tls, eve_dns]
        detection: "BL-04, BL-13; DoH to public resolvers from servers (T1071.004 idea)"
        disposition: "planned | network side"
    leads: []
  - id: tool.empire
    name: Empire (python agent on Linux)
    category: c2_framework
    dual_use: true
    attack_software: S0363
    platforms: [Windows, Linux, macOS]
    techniques: [T1059.006, T1071.001, T1132.001]
    behaviors:
      - behavior: python agent launched with an encoded stager and HTTP polling
        telemetry: [auditd_exec, auditd_net, eve_http]
        detection: "BL-01 interpreter external connect; BL-04"
        disposition: "planned | BL-01/BL-04"
    leads:
      - {type: argv_token, value: "python -c with base64 decode and exec of the result", note: "generic stager shape, positive-only"}
  - id: tool.pupy
    name: Pupy
    category: c2_framework
    dual_use: true
    attack_software: S0192
    platforms: [Linux, Windows, macOS]
    techniques: [T1071.001, T1573, T1059.006, T1620]
    behaviors:
      - behavior: Python-based implant loaded in memory, encrypted channel
        telemetry: [auditd_exec, auditd_net, eve_flow]
        detection: "BL-20 memfd exec, BL-01, BL-04"
        disposition: "planned | BL-20/BL-01"
    leads: []
  - id: tool.vshell_supershell
    name: VShell / Supershell family (open-source C2 seen with Linux implants)
    category: c2_framework
    dual_use: false
    attack_software: null
    platforms: [Linux, Windows]
    techniques: [T1071, T1105, T1620, T1059.004]
    behaviors:
      - behavior: Downloader one-liner fetches an implant into /tmp or memory and runs it, then a persistent reverse channel
        telemetry: [auditd_exec, auditd_net, eve_http, eve_flow]
        detection: "host.downloader_feeds_interpreter, host.download_piped_to_shell, BL-20, BL-04"
        disposition: "covered | downloader-to-shell rules cover the staging; channel detections planned"
    leads: []
  # ------------------------------------------------------------------ reverse/bind shells and relays
  - id: tool.netcat
    name: netcat family (nc, ncat, netcat-openbsd, netcat-traditional, busybox nc)
    category: reverse_shell_utility
    dual_use: true
    attack_software: null
    platforms: [Linux, macOS, Windows, Network Devices]
    techniques: [T1059.004, T1095, T1105, T1090.001, T1048.003]
    behaviors:
      - behavior: Process with an external connection whose stdin/stdout drive a shell (-e/-c, or a mkfifo pipe)
        telemetry: [auditd_net, auditd_exec]
        detection: "BL-02 lineage (shell child of a connected process, or sibling shell reading a fifo)"
        disposition: "planned | BL-02"
      - behavior: Listener on a new port (bind shell, file receive)
        telemetry: [auditd_net, eve_flow]
        detection: "COR-18"
        disposition: "planned | COR-18"
    leads:
      - {type: argv_token, value: "nc/ncat with -e or -c (also inside grouped flags such as -lvnp ... -e), --sh-exec, --lua-exec", note: "token-aware; positive-only"}
  - id: tool.socat
    name: socat
    category: reverse_shell_utility
    dual_use: true
    attack_software: null
    platforms: [Linux, macOS]
    techniques: [T1059.004, T1090.001, T1572]
    behaviors:
      - behavior: EXEC/SYSTEM address bound to a TCP connection (reverse or bind shell), often with pty,stderr
        telemetry: [auditd_net, auditd_exec]
        detection: "BL-02"
        disposition: "planned | BL-02"
      - behavior: TCP-LISTEN relay forwarding to an internal host
        telemetry: [auditd_net, eve_flow]
        detection: "COR-18 + BL-01"
        disposition: "planned | COR-18"
    leads:
      - {type: argv_token, value: "address specs EXEC:, SYSTEM:, TCP-LISTEN:, OPENSSL:", note: "positive-only"}
  - id: tool.pwncat
    name: pwncat / pwncat-cs
    category: post_exploitation
    dual_use: true
    attack_software: null
    platforms: [Linux]
    techniques: [T1059.004, T1105, T1053.003, T1098.004]
    behaviors:
      - behavior: Upgrades a reverse shell, uploads tools, installs persistence (authorized_keys, cron)
        telemetry: [auditd_exec, auditd_path, auditd_net]
        detection: "BL-02, BL-17, host.ssh_authorized_keys_write"
        disposition: "covered | authorized_keys writes covered (positive-only); rest planned"
    leads: []
  # ------------------------------------------------------------------ tunnelling and proxies
  - id: tool.chisel
    name: chisel
    category: tunnel_proxy
    dual_use: true
    attack_software: null
    platforms: [Linux, Windows, macOS]
    techniques: [T1572, T1090.001, T1090.002, T1071.001]
    behaviors:
      - behavior: Long-lived HTTP(S) websocket session carrying a SOCKS or port-forward tunnel
        telemetry: [eve_flow, eve_http, arkime_spi, auditd_net]
        detection: "T1572 idea (long bidirectional HTTP session to a rare host), BL-15, COR-04"
        disposition: "planned | network aggregate"
      - behavior: Reverse mode opens a listener on the server side that reaches back into the network
        telemetry: [auditd_net]
        detection: "COR-18 on the internal host, BL-01"
        disposition: "planned | BL-01"
    leads:
      - {type: http_header, value: "websocket upgrade with a chisel-versioned subprotocol", note: "visible in cleartext HTTP or PCAP only; positive-only"}
      - {type: argv_token, value: "client/server subcommands with R: remotes or socks", note: "positive-only"}
  - id: tool.ligolo_ng
    name: ligolo-ng
    category: tunnel_proxy
    dual_use: true
    attack_software: null
    platforms: [Linux, Windows, macOS]
    techniques: [T1572, T1090.001, T1573.002]
    behaviors:
