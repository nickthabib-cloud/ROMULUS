- id: T1059
  name: Command and Scripting Interpreter
  tactics: [execution]
  platforms: [Linux, Network Devices, Windows, macOS, ESXi, IaaS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.ppid, process.user, process.cwd, event.outcome]
  - family: auditd_path
    fields: [file.path, file.item]
  - family: win_sysmon
    fields: [process.executable, process.command_line, process.parent.executable]
  - family: edr
    fields: [process.name, process.parent.name, process.command_line]
  lab_observable:
    status: 'yes'
    reason: auditd execve with SYSCALL exe, argv, uid, ppid and CWD is normalized
  rules: [host.web_service_spawns_interpreter, host.exec_from_temp_dir, host.script_from_temp_dir]
  disposition:
    status: covered
    reason: interpreters run by web-service accounts and from temporary directories are covered (positive-only per ADR-004);
      interpreter runs by other unusual parents need lineage (BL-02, BL-24)
  priority: P1
  detection_ideas:
  - 'Process-lineage theme: interpreter whose parent is a network service (sshd excluded), database, mail or print daemon.'
  - 'BL-24: interpreter plus argument-shape rarity per host and account.'
  - Kernel-recorded script path (auditd PATH item 0) under a temporary or hidden directory, giving a negative-assuring version
    of host.script_from_temp_dir.
  correlation: ['COR-02: interpreter with an external socket.']
  pivots: [Parent chain of the interpreter and its children, Network sockets opened by the interpreter pid]
- id: T1059.001
