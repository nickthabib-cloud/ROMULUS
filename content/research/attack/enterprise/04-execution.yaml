# ROMULUS research register: ATT&CK Enterprise v20.0, entries whose first tactic is execution.
# Schema and workflow: docs/research/README.md. 66 entries (28 assessed, 38 stubs).
# An entry with only id/name/tactics is a stub: walked and listed, not yet assessed.
attack_version: enterprise-attack 20.0
primary_tactic: execution
entries:
- id: T1047
  name: Windows Management Instrumentation
  tactics: [execution]
- id: T1053
  name: Scheduled Task/Job
  tactics: [execution, persistence, privilege-escalation]
  platforms: [Linux, Network Devices, Windows, macOS, Containers]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.parent.executable, process.user]
  - family: auditd_path
    fields: [file.path, file.nametype]
  - family: journal_other
    fields: [journal.identifier, cron.command, journal.unit]
  - family: netdev
    fields: [command]
  lab_observable:
    status: 'yes'
    reason: crontab/at/systemd-run executions in auditd and cron/systemd messages in the journal
  rules: [host.downloader_feeds_interpreter]
  disposition:
    status: planned
    reason: 'sub-techniques planned: kernel PATH writes to schedule locations (BL-17) and scheduled-job children that download
      or open external sockets'
  priority: P1
  detection_ideas:
  - 'BL-17: writes to /var/spool/cron, /etc/cron*, systemd timer units by a process that is not the package manager.'
  - Scheduled job (cron/atd/systemd parent) whose child runs a downloader or opens an external connection.
  correlation:
  - 'COR-15: persistence write followed by periodic outbound connections.'
  pivots:
  - The scheduled command's first run and its network effect
- id: T1053.002
  name: At
