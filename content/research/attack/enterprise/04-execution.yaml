- id: T1574.006
  name: Dynamic Linker Hijacking
  tactics: [execution, stealth]
  platforms: [Linux, macOS]
  telemetry:
  - family: auditd_path
    fields: [file.path, file.nametype, process.executable]
  - family: auditd_exec
    fields: [process.executable, process.argv]
  - family: osquery
    fields: [file.path]
  lab_observable:
    status: partial
    reason: /etc/ld.so.preload writes need a watch rule or open-for-write syscall audit (unverified); LD_PRELOAD in the
      environment is not recorded by auditd
  rules: []
  disposition:
    status: planned
    reason: 'BL-21: write to /etc/ld.so.preload or a new .so in a library directory by a non-package-manager process'
  priority: P1
  detection_ideas:
  - 'BL-21: any write to /etc/ld.so.preload (rare and high-signal); new shared object under /lib, /usr/lib or a temp path
    referenced by it.'
  - Execution with LD_PRELOAD visible only via EDR/eBPF environment capture (needs telemetry).
  correlation: []
  pivots:
  - The .so file's creator and every process started after the write
- id: T1574.007
  name: Path Interception by PATH Environment Variable
  tactics: [execution, stealth]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: auditd_path
    fields: [file.path, file.nametype]
  - family: auditd_exec
    fields: [process.executable, process.argv]
  lab_observable:
    status: partial
    reason: an executable named like a system tool appearing in a PATH directory earlier in the search order is visible
      via PATH CREATE and the later exec path
  rules: []
  disposition:
    status: planned
    reason: kernel exe path for well-known command names outside their system directories (masquerading theme, T1036.005)
  priority: P3
  detection_ideas:
  - Process whose comm/argv[0] is a system tool name (ls, ps, sudo) but whose kernel exe path is in a user-writable directory.
  correlation: []
  pivots:
  - Who wrote the shadowing binary and who executed it
