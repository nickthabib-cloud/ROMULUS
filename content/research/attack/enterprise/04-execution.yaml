  lab_observable:
    status: 'yes'
    reason: systemctl/systemd-run executions in auditd; unit start messages in the journal
  rules: []
  disposition:
    status: planned
    reason: timer unit file writes (BL-17) and transient timers created with systemd-run --on-*
  priority: P2
  detection_ideas:
  - systemd-run with --on-calendar/--on-active by a non-admin account (positive-only argv).
  - New .timer unit in /etc/systemd/system or ~/.config/systemd/user (PATH CREATE).
  correlation: [COR-15]
  pivots:
  - The service unit the timer triggers and its ExecStart command
