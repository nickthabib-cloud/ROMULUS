      is an exe-path rarity case (BL-24)
  priority: P2
  detection_ideas:
  - 'Token-aware argv: -EncodedCommand and every unambiguous prefix (-e, -en, -enc...), -NoProfile/-nop, -WindowStyle Hidden,
    download cradles; positive-only.'
  - pwsh executed on a Linux host whose baseline has no pwsh (kernel exe path).
  correlation: []
  pivots:
  - Script-block text for the process and its network connections
