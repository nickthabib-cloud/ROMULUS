- id: T1569.003
  name: Systemctl
  tactics: [execution]
  platforms: [Linux]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.user, process.auid]
  - family: journal_other
    fields: [journal.unit, systemd.unit_event, journal.message]
  lab_observable:
    status: 'yes'
    reason: systemctl start/enable execs (auditd) and Started/Stopped unit messages (journal)
  rules: []
  disposition:
    status: planned
    reason: systemctl start of a unit created in the hunt window, or by an unusual account, joined to the unit's first execution
  priority: P2
  detection_ideas:
  - Unit started for the first time in the window whose unit file was created in the window (BL-17 + journal Started).
  - systemd-run transient unit launching a shell or interpreter.
  correlation: [COR-15]
  pivots: [The unit's ExecStart process and its children]
- id: T1574
