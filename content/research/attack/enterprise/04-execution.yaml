  - family: journal_other
    fields: [journal.identifier]
  lab_observable:
    status: 'yes'
    reason: at/atd executions appear in auditd
  rules: []
  disposition:
    status: planned
    reason: 'at use is rare on servers: any at job creation plus atd-parented children with downloaders/sockets'
  priority: P3
  detection_ideas:
  - at/batch executed by a non-admin or web-service account; atd child processes running from temp paths.
  correlation: []
  pivots:
  - The job file under /var/spool/at and its content creator
- id: T1053.003
  name: Cron
  tactics: [execution, persistence, privilege-escalation]
  platforms: [Linux, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.user, process.parent.executable]
  - family: auditd_path
    fields: [file.path, file.nametype, process.executable]
  - family: journal_other
    fields: [journal.identifier, cron.command]
  lab_observable:
    status: 'yes'
    reason: crontab executions, cron-spawned commands and CRON journal entries are present
  rules: [host.downloader_feeds_interpreter]
  disposition:
    status: planned
    reason: host.downloader_feeds_interpreter catches cron jobs that pipe downloads into shells (positive-only); crontab
      file writes via PATH records (BL-17) and editor-based crontab edits are planned
  priority: P1
  detection_ideas:
  - 'BL-17: CREATE or write of files under /var/spool/cron/crontabs or /etc/cron.* by any process other than crontab(1)
    or the package manager.'
  - crontab -e / crontab FILE / crontab - by a web-service or recently created account (positive-only argv).
  - Cron child processes that are new for the host in the hunt window (BL-24 scoped to cron lineage).
  correlation:
  - 'COR-15: cron entry followed by periodic outbound connections at the cron cadence.'
  pivots:
  - Every run of the new cron command and its network effect
