attack_version: enterprise-attack 20.0
primary_tactic: command-and-control
entries:
- id: T1001
  name: Data Obfuscation
  tactics: [command-and-control]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: eve_http
    fields: [http.content_type, http.response.length]
  - family: pcap
    fields: [payload.bytes]
  - family: arkime_spi
    fields: [network.bytes_src, network.bytes_dst]
  lab_observable:
    status: partial
    reason: metadata visible; obfuscated content needs PCAP
  rules: []
  disposition:
    status: deferred
    reason: content-level evasion; detected through channel behaviour (beaconing BL-04, protocol mismatch BL-12)
  priority: P4
  detection_ideas: [See BL-04 and BL-12.]
  correlation: []
  pivots: [PCAP of a representative session]
