- id: T1001.003
  name: Protocol or Service Impersonation
  tactics: [command-and-control]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: eve_http
    fields: [http.hostname, user_agent.original, url.original]
  - family: eve_tls
    fields: [tls.sni, tls.ja3, tls.issuer]
  - family: arkime_spi
    fields: [tls.ja3, http.host]
  lab_observable:
    status: partial
    reason: TLS/HTTP metadata visible once normalized
  rules: []
  disposition:
    status: planned
    reason: traffic claiming a well-known service (SNI/Host) that does not resolve to or present that service's certificate
  priority: P3
  detection_ideas:
  - SNI/Host of a well-known domain with a certificate issuer/subject that does not match it (needs eve_tls).
  - HTTP Host of a well-known domain sent to an IP that the domain did not resolve to in the window (needs dns.answers).
  correlation: [COR-09]
  pivots: [The client process]
