    fields: [http.hostname, url.original, user_agent.original]
  - family: eve_dns
    fields: [dns.question.name, dns.question.type]
  - family: eve_tls
    fields: [tls.sni, tls.ja3]
  - family: arkime_spi
    fields: [session.duration, network.bytes_src, network.bytes_dst]
  - family: auditd_net
    fields: [process.executable, destination.ip, destination.port]
  lab_observable:
    status: 'yes'
    reason: flows, HTTP, DNS and (some) TLS metadata exist; host connect syscalls exist but are not normalized
  rules: [net.suricata_alert_stack]
  disposition:
    status: planned
    reason: alert stacking is the only current coverage; beaconing (BL-04), process attribution (BL-01/BL-03), rare destinations
      (BL-25) are the planned core
  priority: P1
  detection_ideas:
  - 'BL-04: per (src, dst, port) interval regularity with jitter tolerance and small consistent sizes.'
  - 'BL-01: interpreter/shell/service-account external connect.'
  - 'BL-25: first-seen external destination per internal host.'
  correlation: ['COR-01, COR-02, COR-03.']
  pivots:
  - Host process behind the channel and its parent chain
