- id: T1018
  name: Remote System Discovery
  tactics: [discovery]
  platforms: [Linux, Network Devices, Windows, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv]
  - family: eve_flow
    fields: [source.ip, destination.ip, destination.port, flow.state]
  - family: eve_dns
    fields: [source.ip, dns.question.name, dns.question.type]
  - family: netdev
    fields: [command]
  lab_observable:
    status: 'yes'
    reason: arp -a, ping sweeps and PTR lookups are visible in auditd and EVE
  rules: []
  disposition:
    status: planned
    reason: net.port_scan finds many ports on one destination, which is service discovery (T1046), not host discovery; ping
      sweeps and PTR sweeps are planned (BL-09, BL-11)
  priority: P1
  detection_ideas:
  - 'BL-09: ICMP echo or TCP SYN to many internal addresses from one source (horizontal sweep).'
  - 'BL-11: PTR queries across an address block from one source.'
  - 'BL-05: arp -a, ip neigh, cat /etc/hosts, getent hosts in a burst.'
  correlation:
  - 'COR-13: sweep source joined to the scanning process.'
  pivots:
  - Hosts the source contacted successfully after the sweep
- id: T1033
