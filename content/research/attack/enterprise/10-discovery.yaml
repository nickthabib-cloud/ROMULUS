    status: planned
    reason: BL-05; whoami/id as the first command of a web-service shell is a high-value lead
  priority: P1
  detection_ideas:
  - 'BL-05: id, whoami, w, who, last, users in a burst.'
  - id/whoami executed by a web-service account (shell spawned from the web server).
  correlation: []
  pivots: [The parent of the discovery commands]
- id: T1046
  name: Network Service Discovery
  tactics: [discovery]
  platforms: [Linux, Network Devices, Windows, macOS, Containers, IaaS]
  telemetry:
  - family: eve_flow
    fields: [source.ip, destination.ip, destination.port, flow.state, flow.pkts_toserver]
  - family: arkime_spi
    fields: [source.ip, destination.ip, destination.port]
  - family: auditd_exec
    fields: [process.executable, process.argv]
  - family: auditd_net
    fields: [process.executable, destination.ip, destination.port]
  lab_observable:
    status: 'yes'
    reason: EVE flow shows multi-port probing; scanners run on hosts appear in auditd
  rules: [net.port_scan]
  disposition:
    status: covered
    reason: net.port_scan (one source, many ports, one destination); horizontal sweeps (BL-09) and host-side scanner attribution
      (COR-13) planned
  priority: P1
  detection_ideas:
  - 'BL-09: horizontal sweep on one port across many internal hosts.'
  - 'BL-01 variant: one process making connect() calls to many distinct destination ports or hosts in seconds (host-side
    scan, survives renaming).'
  correlation:
  - 'COR-13: internal scan source joined to the scanning process.'
  pivots: [Ports that answered and later sessions to them]
