- id: T1016.001
  name: Internet Connection Discovery
  tactics: [discovery]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv]
  - family: auditd_net
    fields: [process.executable, destination.ip, destination.port]
  - family: eve_dns
    fields: [dns.question.name]
  - family: eve_http
    fields: [http.hostname, url.original]
  lab_observable:
    status: 'yes'
    reason: connectivity checks (ping 8.8.8.8, curl ifconfig.me) are visible as execs and as DNS/HTTP at sensors
  rules: []
  disposition:
    status: planned
    reason: requests to public IP-echo services or ping to public resolvers from servers that do not normally do so
  priority: P2
  detection_ideas:
  - DNS/HTTP to IP-echo services (ifconfig.me, ipinfo.io, api.ipify.org, icanhazip.com) from a server; indicator list, positive-only.
  - ping/curl to well-known public IPs inside a BL-05 burst.
  correlation:
  - 'COR-09: the DNS query joined to the host process that issued it.'
  pivots:
  - The host process issuing the check and what followed
