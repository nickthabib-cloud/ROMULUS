# ROMULUS research register: ATT&CK Enterprise v20.0, entries whose first tactic is discovery.
# Schema and workflow: docs/research/README.md. 43 entries (32 assessed, 11 stubs).
# An entry with only id/name/tactics is a stub: walked and listed, not yet assessed.
attack_version: enterprise-attack 20.0
primary_tactic: discovery
entries:
- id: T1007
  name: System Service Discovery
  tactics: [discovery]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.auid, process.session_id]
  lab_observable:
    status: 'yes'
    reason: systemctl list-units/service --status-all execs are in auditd
  rules: []
  disposition:
    status: planned
    reason: feature of BL-05 discovery burst
  priority: P2
  detection_ideas:
  - 'BL-05: systemctl list-units/list-unit-files, service --status-all, ls /etc/systemd/system inside a burst.'
  correlation: []
  pivots: [The session's other commands]
