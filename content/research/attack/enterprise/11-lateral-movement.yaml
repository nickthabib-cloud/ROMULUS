    fields: [process.executable, process.argv, process.user]
  - family: auditd_path
    fields: [file.path, file.nametype, process.executable]
  - family: eve_flow
    fields: [source.ip, destination.ip, destination.port, flow.bytes_toserver]
  - family: eve_fileinfo
    fields: [file.name, file.size, file.magic]
  - family: zeek_files
    fields: [mime_type, filename]
  lab_observable:
    status: 'yes'
    reason: scp/rsync/curl between internal hosts visible in auditd and EVE (when crossing sensors)
  rules: []
  disposition:
    status: planned
    reason: file received over SSH/HTTP/SMB from an internal peer then executed on the destination (BL-22 internal variant)
  priority: P2
  detection_ideas:
  - scp/sftp server (sshd child) creating an executable file (PATH CREATE) that is executed within minutes on the destination.
  - Internal HTTP transfer of an ELF/script (fileinfo magic) between peers that do not normally exchange files.
  correlation: [COR-06 (internal source variant)., COR-14]
  pivots: [The source host's process that sent the file]
