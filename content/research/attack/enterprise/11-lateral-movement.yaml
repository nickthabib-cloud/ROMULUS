- id: T1021.004
  name: SSH
  tactics: [lateral-movement]
  platforms: [Linux, macOS, ESXi]
  telemetry:
  - family: journal_sshd
    fields: [user.name, source.ip, source.port, auth.method, event.outcome]
  - family: auditd_exec
    fields: [process.executable, process.argv, process.user, process.auid]
  - family: eve_flow
    fields: [source.ip, destination.ip, destination.port, flow.bytes_toserver, flow.bytes_toclient, flow.start, flow.end]
  - family: eve_ssh
    fields: [ssh.client.software, ssh.client.hassh, ssh.server.hassh]
  - family: arkime_spi
    fields: [ssh.hassh, ssh.hassh_server, session.duration]
  lab_observable:
    status: 'yes'
    reason: all three views of SSH exist in the lab
  rules: [host.ssh_login_external_source]
  disposition:
    status: covered
    reason: external-source SSH logins covered (lead); internal lateral SSH chains, first-seen pairs and key-based hops
      are planned (BL-08, COR-14)
  priority: P1
  detection_ideas:
  - 'BL-08: first-seen (source host, destination host, account) SSH triple.'
  - 'COR-14: chain A->B->C within a window by the same operator account.'
  - SSH login by a service or web account; SSH from a host that only ever received SSH.
  correlation:
  - 'COR-14: lateral SSH chain.'
  - 'COR-05: auth success joined to network SSH metadata.'
  - 'COR-10: login -> session commands.'
  pivots:
  - Commands run under the destination login's audit session
  - Other destinations reached from the same source
