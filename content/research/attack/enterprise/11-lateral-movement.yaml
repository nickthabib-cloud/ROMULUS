# ROMULUS research register: ATT&CK Enterprise v20.0, entries whose first tactic is lateral-movement.
# Schema and workflow: docs/research/README.md. 21 entries (21 assessed, 0 stubs).
# An entry with only id/name/tactics is a stub: walked and listed, not yet assessed.
attack_version: enterprise-attack 20.0
primary_tactic: lateral-movement
entries:
- id: T1021
  name: Remote Services
  tactics: [lateral-movement]
  platforms: [Linux, Windows, macOS, IaaS, SaaS, Identity Provider]
  telemetry:
  - family: journal_sshd
    fields: [user.name, source.ip, source.port, event.outcome]
  - family: eve_flow
    fields: [source.ip, destination.ip, destination.port, flow.bytes_toserver, flow.bytes_toclient]
  - family: eve_ssh
    fields: [ssh.client.software, ssh.client.hassh]
  - family: auditd_exec
    fields: [process.executable, process.argv, process.user]
  - family: zeek_conn
    fields: [id.orig_h, id.resp_h, id.resp_p]
  lab_observable:
    status: 'yes'
    reason: SSH logins (journal), SSH sessions (EVE flow/ssh) and ssh client execs (auditd) are present
  rules: [host.ssh_login_external_source]
  disposition:
    status: covered
    reason: external-source SSH logins are covered (lead); internal peer-to-peer remote services between hosts that do not
      normally talk are planned (network allowed-pairs baseline)
  priority: P1
  detection_ideas:
  - Internal remote-service sessions (22, 3389, 5900, 5985/5986, 445) between host pairs with no conversation in the baseline
    window.
  - One internal source authenticating to many internal hosts in a short window (fan-out).
  correlation:
  - 'COR-14: A ssh exec -> flow A->B:22 -> B sshd accepted from A.'
  pivots:
  - What the source did on each destination after login
