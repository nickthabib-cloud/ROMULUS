- id: T1563.001
  name: SSH Hijacking
  tactics: [lateral-movement]
  platforms: [Linux, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.auid, process.uid]
  - family: auditd_path
    fields: [file.path, process.executable]
  - family: journal_sshd
    fields: [user.name, source.ip, auth.method]
  lab_observable:
    status: partial
    reason: SSH_AUTH_SOCK is an environment variable (invisible); access to /tmp/ssh-*/agent.* sockets is visible only with
      PATH/connect(AF_UNIX) audit
  rules: []
  disposition:
    status: planned
    reason: root or another uid connecting to a user's ssh-agent socket, then outbound ssh using that identity
  priority: P3
  detection_ideas:
  - connect(AF_UNIX) to /tmp/ssh-*/agent.* by a uid different from the socket owner, followed by an ssh client exec (needs
    syscall audit).
  - 'ControlMaster socket reuse: ssh -S <socket> by a different uid (positive-only argv).'
  correlation: [COR-14]
  pivots: [Destinations reached with the hijacked agent]
