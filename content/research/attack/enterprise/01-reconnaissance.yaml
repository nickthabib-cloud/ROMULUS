- id: T1595
  name: Active Scanning
  tactics: [reconnaissance]
  platforms: [PRE]
  telemetry:
  - family: eve_flow
    fields: [source.ip, destination.ip, destination.port, flow.state, flow.pkts_toserver, flow.pkts_toclient]
  - family: apache_access
    fields: [source.ip, url.original, http.response.status_code, user_agent.original]
  - family: arkime_spi
    fields: [source.ip, destination.ip, destination.port, network.packets_src, network.packets_dst]
  - family: zeek_conn
    fields: [conn_state, history, id.orig_h, id.resp_h, id.resp_p]
  lab_observable:
    status: 'yes'
    reason: inetfw EVE flow sees inbound connection attempts from the internet; apache access logs see web probing
  rules: [net.port_scan, web.scan_burst]
  disposition:
    status: covered
    reason: parent covered through its sub-techniques; see .001-.003 for the gaps
  priority: P2
  detection_ideas:
  - 'Group inbound attempts by external source across the hunt window: distinct destination hosts and ports, failure ratio
    from flow.state, with the source''s later successful sessions as the escalation hook.'
  correlation:
  - 'COR-08: an external scanner that later appears as the source of an exploit alert or an accepted login is a stage link
    (hypothesis).'
  pivots:
  - All later successful sessions and logins from the scanning source
  - Whether any scanned service later spawned unusual children (host)
- id: T1595.001
  name: Scanning IP Blocks
  tactics: [reconnaissance]
  platforms: [PRE]
  telemetry:
  - family: eve_flow
    fields: [source.ip, destination.ip, destination.port, flow.state, flow.pkts_toserver]
  - family: arkime_spi
    fields: [source.ip, destination.ip, destination.port, network.packets_src]
  - family: zeek_conn
    fields: [conn_state, history, id.resp_p]
  - family: firewall
    fields: [action, source.ip, destination.ip, destination.port]
  lab_observable:
    status: 'yes'
    reason: EVE flow carries 5-tuple and state for traffic crossing inetfw
  rules: [net.port_scan]
  disposition:
    status: covered
    reason: net.port_scan finds one source contacting many ports on one destination (vertical); horizontal sweeps across
      many hosts are not covered (BL-09)
  priority: P2
  detection_ideas:
  - 'BL-09: horizontal sweep: one source, one port, many destination addresses in a short window, with denominators and
    failure ratio.'
  - 'Scan-to-success transition: the first completed handshake with payload after a sweep from the same source.'
  correlation:
  - COR-13 when the scanning source is an internal host with host telemetry.
  pivots:
  - Sessions from the source that completed with application payload
  - Other sources sharing the same port set and timing (distributed scan)
- id: T1595.002
  name: Vulnerability Scanning
  tactics: [reconnaissance]
  platforms: [PRE]
  telemetry:
  - family: apache_access
    fields: [source.ip, url.original, http.response.status_code, user_agent.original, http.request.method]
  - family: eve_http
    fields: [source.ip, http.hostname, url.original, user_agent.original, http.response.status_code]
  - family: eve_alert
    fields: [alert.signature, alert.category, source.ip]
  lab_observable:
    status: 'yes'
    reason: apache access logs and EVE http in the lab; Suricata scanner signatures fire on EVE alert
  rules: [web.scan_burst]
  disposition:
    status: covered
    reason: web.scan_burst finds high-volume error-heavy request bursts per source; low-and-slow scanning stays a gap
  priority: P2
  detection_ideas:
  - Request burst followed by a 2xx on a URI never requested by other sources (scanner hit, then targeted request).
  - Rare URI paths per web server stacked against the server's own baseline (known-vulnerable paths as positive-only leads).
  correlation:
  - 'COR-07: a scanning source whose later request precedes a web-service child process on the target host.'
  pivots:
  - 2xx responses to the scanning source and the URIs involved
  - Web-service child processes on the target within minutes of those requests
- id: T1595.003
  name: Wordlist Scanning
  tactics: [reconnaissance]
  platforms: [PRE]
  telemetry:
  - family: apache_access
    fields: [source.ip, url.original, http.response.status_code]
  - family: eve_http
    fields: [source.ip, url.original, http.response.status_code]
  - family: eve_dns
    fields: [source.ip, dns.question.name, dns.response_code]
  lab_observable:
    status: 'yes'
    reason: apache access and EVE http/dns in the lab
  rules: [web.scan_burst]
  disposition:
    status: covered
    reason: web.scan_burst covers content-discovery bursts (many distinct paths, mostly 404); DNS wordlist brute force is
      covered by net.dns_subdomain_enumeration under T1590.002
  priority: P3
  detection_ideas:
  - Distinct-path count per source with 404 ratio, separated from crawler user agents only as context (UA is self-reported).
  correlation: []
  pivots:
  - Paths that returned 200/301/401 to the source during the burst
