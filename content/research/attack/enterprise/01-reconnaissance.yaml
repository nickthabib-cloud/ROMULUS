- id: T1590.001
  name: Domain Properties
  tactics: [reconnaissance]
- id: T1590.002
  name: DNS
  tactics: [reconnaissance]
  platforms: [PRE]
  telemetry:
  - family: eve_dns
    fields: [source.ip, dns.question.name, dns.question.type, dns.response_code]
  - family: dns_server
    fields: [client.ip, dns.question.name, dns.question.type, dns.response_code]
  - family: zeek_dns
    fields: [query, qtype_name, rcode_name]
  lab_observable:
    status: 'yes'
    reason: corpdns sensor sees queries to the lab resolver
  rules: [net.dns_subdomain_enumeration]
  disposition:
    status: covered
    reason: net.dns_subdomain_enumeration finds many distinct subdomains of one domain from one source; zone-transfer requests
      and PTR sweeps are not covered (BL-11)
  priority: P2
  detection_ideas:
  - 'BL-11: AXFR/IXFR requests from sources that are not configured secondaries.'
  - 'BL-11: PTR sweep: one source requesting reverse names across a contiguous address block.'
  correlation: []
  pivots:
  - Whether the enumerating source later connected to any resolved internal name
