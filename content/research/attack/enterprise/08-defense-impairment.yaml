- id: T1686
  name: Disable or Modify System Firewall
  tactics: [defense-impairment]
  platforms: [Linux, Network Devices, Windows, macOS, IaaS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.user]
  - family: auditd_acct
    fields: [audit.record_type]
  - family: journal_other
    fields: [journal.unit, systemd.unit_event]
  - family: eve_flow
    fields: [source.ip, destination.ip, destination.port, flow.state]
  - family: netdev
    fields: [config.change]
  lab_observable:
    status: 'yes'
    reason: iptables/nft/ufw/firewall-cmd execs are in auditd; the lab storyline includes firewall commands
  rules: [host.firewall_rule_change_command]
  disposition:
    status: covered
    reason: host.firewall_rule_change_command (metadata still says T1562.004, revoked in v20) detects host firewall commands
      that block/unblock specific addresses (positive-only); service stop/flush and new allow rules are planned
  priority: P1
  detection_ideas:
  - iptables -F / nft flush ruleset / ufw disable / systemctl stop firewalld|ufw (positive-only argv plus journal unit stop).
  - New ACCEPT rule for an inbound port followed by inbound flows to that port (COR-25).
  correlation:
  - 'COR-25: host firewall change followed by new inbound flows.'
  pivots:
  - Flows to/from the affected address or port before and after the change
