- id: T1222
  name: File and Directory Permissions Modification
  tactics: [defense-impairment]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.user]
  - family: auditd_sys
    fields: [syscall.name, syscall.args]
  - family: auditd_path
    fields: [file.path, file.mode]
  lab_observable:
    status: partial
    reason: chmod/chown/chattr execs visible (positive-only); chmod syscalls need audit rules
  rules: []
  disposition:
    status: planned
    reason: see T1222.002
  priority: P2
  detection_ideas: [See T1222.002.]
  correlation: []
  pivots: [Use of the file after the permission change]
