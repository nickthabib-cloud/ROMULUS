- id: T1690
  name: Prevent Command History Logging
  tactics: [defense-impairment]
  platforms: [Linux, Network Devices, Windows, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv]
  - family: auditd_path
    fields: [file.path, file.nametype]
  - family: netdev
    fields: [config.change]
  lab_observable:
    status: partial
    reason: HISTFILE/HISTSIZE settings are shell variables (invisible to auditd unless in init files); history file symlinks
      and init-file edits are visible
  rules: []
  disposition:
    status: planned
    reason: history disabled via init-file writes (BL-17 feature) or history file pointed to /dev/null; auditd still records
      the commands
  priority: P3
  detection_ideas:
  - ln -s /dev/null ~/.bash_history; init files written with HISTFILE= or unset HISTFILE (positive-only text when the write
    is a command line).
  - Interactive session with execs but no history-file writes (needs PATH coverage), as context only.
  correlation: []
  pivots: [Commands run in the session (auditd keeps them)]
