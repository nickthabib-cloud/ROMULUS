  tactics: [defense-impairment]
  platforms: [Linux]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv]
  - family: auditd_acct
    fields: [audit.record_type, audit.config_op, event.outcome]
  - family: auditd_path
    fields: [file.path, file.nametype]
  - family: journal_other
    fields: [journal.unit, systemd.unit_event]
  lab_observable:
    status: 'yes'
    reason: auditctl execs and auditd service stops are visible; CONFIG_CHANGE records are expected when audit rules change
      (unverified in lab)
  rules: []
  disposition:
    status: planned
    reason: 'BL-19: auditctl -D/-e 0/-a never, writes to /etc/audit/*, auditd stop/kill, plus loss of audit records from
      a host'
  priority: P1
  detection_ideas:
  - 'BL-19: CONFIG_CHANGE audit record with op=remove_rule or audit_enabled=0; auditctl -D/-e 0 exec.'
  - 'BL-19: write to /etc/audit/audit.rules or rules.d by a non-package process.'
  - Kill/stop of auditd followed by an audit record gap for that host (silence detector).
  correlation: []
  pivots:
  - What the host did on the network during the audit gap
