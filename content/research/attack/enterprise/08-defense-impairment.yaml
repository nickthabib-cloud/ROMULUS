- id: T1685
  name: Disable or Modify Tools
  tactics: [defense-impairment]
  platforms: [Linux, Network Devices, Windows, macOS, Containers, IaaS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.user]
  - family: auditd_acct
    fields: [audit.record_type, audit.config_op]
  - family: journal_other
    fields: [journal.unit, systemd.unit_event]
  - family: netdev
    fields: [command]
  lab_observable:
    status: 'yes'
    reason: systemctl stop of security services and their journal stop messages are visible; ingestion gaps are visible
      as volume drops
  rules: []
  disposition:
    status: planned
    reason: 'BL-19: security/logging service stop or disable, and per-host telemetry silence'
  priority: P1
  detection_ideas:
  - 'BL-19: stop/disable/mask of auditd, rsyslog, systemd-journald, EDR or AV units by any session.'
  - 'BL-19: per-host, per-family event rate drops to zero while the host''s network flows continue (telemetry silence).'
  correlation:
  - Network activity from a host whose host telemetry went silent (BL-19 correlation).
  pivots: [Network activity of the host during the gap]
