- id: T1222.002
  name: Linux and Mac Permissions
  tactics: [defense-impairment]
  platforms: [Linux, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.user]
  - family: auditd_sys
    fields: [syscall.name, syscall.args]
  - family: auditd_path
    fields: [file.path, file.mode]
  lab_observable:
    status: partial
    reason: chmod/chown/chattr execs visible; fchmodat syscalls with mode need audit rules (unverified)
  rules: []
  disposition:
    status: planned
    reason: setuid bit added (T1548.001), world-writable permissions on system/persistence files, chattr -i on protected
      files before modification
  priority: P2
  detection_ideas:
  - chmod adding 04000/02000 to files outside package paths; chmod 777/666 on /etc/passwd, /etc/shadow, /etc/sudoers, unit
    files.
  - chattr -i on a protected file followed by its modification (sequence).
  - chmod +x on a file created in the same session under a temp dir, then exec (part of BL-22).
  correlation: []
  pivots: [The changed file's subsequent use]
