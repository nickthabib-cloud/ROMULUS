- id: T1110.001
  name: Password Guessing
  tactics: [credential-access]
  platforms: [Linux, Network Devices, Windows, macOS, Containers, IaaS, SaaS, Office Suite, Identity Provider]
  telemetry:
  - family: journal_sshd
    fields: [user.name, source.ip, event.outcome]
  - family: apache_access
    fields: [source.ip, url.original, http.response.status_code]
  - family: eve_flow
    fields: [source.ip, destination.port, flow.bytes_toserver, flow.pkts_toserver]
  lab_observable:
    status: 'yes'
    reason: sshd failure records are normalized
  rules: []
  disposition:
    status: planned
    reason: 'BL-07: failures per (source, account) over a window with denominators; success after N failures as high'
  priority: P1
  detection_ideas:
  - 'BL-07: >= N failed sshd auths for one account from one source in T minutes, then any success.'
  - Short SSH sessions (few packets, similar sizes) repeated from one source at sensors without host logs (network-only
    guessing shape).
  correlation:
  - 'COR-05: failures and the final success joined to network sessions by client port.'
  pivots: [The successful session's commands]
