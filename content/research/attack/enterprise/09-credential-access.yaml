- id: T1003.008
  name: /etc/passwd and /etc/shadow
  tactics: [credential-access]
  platforms: [Linux]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.user]
  - family: auditd_path
    fields: [file.path, process.executable, syscall.name, process.auid]
  lab_observable:
    status: 'yes'
    reason: file-reading tools with /etc/shadow operands are visible in argv; kernel PATH records for open() require a watch
      on /etc/shadow (unverified)
  rules: [host.credential_store_read]
  disposition:
    status: covered
    reason: host.credential_store_read (positive-only); BL-17-style kernel PATH watch on /etc/shadow, /etc/gshadow, /etc/security/opasswd
      would give negative assurance
  priority: P1
  detection_ideas:
  - Kernel PATH open of /etc/shadow by an exe outside the authentication baseline (sshd, login, sudo, su, passwd, unix_chkpwd,
    systemd).
  - unshadow/john/hashcat execution on any host (positive-only).
  correlation: ['COR-12: transfer of the copied file off-host.']
  pivots:
  - Copies of the shadow file (cp/tar argv) and outbound transfers after the read
- id: T1040
  name: Network Sniffing
  tactics: [credential-access, discovery]
  platforms: [Linux, Network Devices, Windows, macOS, IaaS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.user]
  - family: auditd_net
    fields: [socket.family, process.executable]
  - family: auditd_sys
    fields: [syscall.name, syscall.args]
  - family: netdev
    fields: [command]
  lab_observable:
    status: 'yes'
    reason: tcpdump/tshark execs are visible; AF_PACKET socket creation needs syscall audit
  rules: []
  disposition:
    status: planned
    reason: packet-capture tools or raw sockets on hosts where capture is not part of the baseline
  priority: P2
  detection_ideas:
  - tcpdump/tshark/dumpcap exe on a non-sensor host, especially writing to a temp path or run by a non-admin account.
  - socket(AF_PACKET) by an exe outside the capture baseline (shared with T1205.002).
  - Interface placed in promiscuous mode (kernel 'entered promiscuous mode' journal message).
  correlation: []
  pivots: [The capture file's later transfer]
