- id: T1557.002
  name: ARP Cache Poisoning
  tactics: [credential-access, collection]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: eve_alert
    fields: [alert.signature]
  - family: netdev
    fields: [arp.event]
  - family: pcap
    fields: [payload.bytes]
  - family: auditd_exec
    fields: [process.executable, process.argv]
  lab_observable:
    status: partial
    reason: ARP is layer 2 and only visible if the sensor captures it; arpspoof/ettercap execs on a lab host are visible
  rules: []
  disposition:
    status: needs_telemetry
    reason: switch/ARP-inspection logs or a sensor with layer-2 capture; host-side tool execution is a positive-only lead
  priority: P3
  detection_ideas:
  - One MAC answering for many IPs, or a gateway IP's MAC changing (PCAP/Zeek arp, needs telemetry).
  - arpspoof/ettercap/bettercap exe on a defended host (tool catalog).
  correlation: []
  pivots: [Traffic redirected through the spoofing host]
