# ROMULUS research register: ATT&CK Enterprise v20.0, entries whose first tactic is credential-access.
# Schema and workflow: docs/research/README.md. 58 entries (36 assessed, 22 stubs).
# An entry with only id/name/tactics is a stub: walked and listed, not yet assessed.
attack_version: enterprise-attack 20.0
primary_tactic: credential-access
entries:
- id: T1003
  name: OS Credential Dumping
  tactics: [credential-access]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.user]
  - family: auditd_path
    fields: [file.path, process.executable, syscall.name]
  - family: auditd_sys
    fields: [syscall.name, target.pid]
  lab_observable:
    status: 'yes'
    reason: reads of credential files by file-reading tools appear in auditd argv
  rules: [host.credential_store_read]
  disposition:
    status: covered
    reason: host.credential_store_read covers /etc/shadow reads by file-reading tools (positive-only); kernel-recorded open
      of credential stores planned
  priority: P1
  detection_ideas: [See T1003.007/.008.]
  correlation: []
  pivots: [Exfiltration or cracking activity after the read]
