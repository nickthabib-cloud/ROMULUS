    status: partial
    reason: SSSD/Winbind credential caches (/var/lib/sss/db) reads are visible only with PATH records on those paths
  rules: []
  disposition:
    status: planned
    reason: open of /var/lib/sss/db/* or Kerberos cache databases by a process other than sssd/winbind (domain-joined Linux)
  priority: P3
  detection_ideas:
  - Read of /var/lib/sss/db/cache_*.ldb or secrets.ldb by a non-sssd exe (watch rule).
  correlation: []
  pivots:
  - The reader's session and any transfer of the file
