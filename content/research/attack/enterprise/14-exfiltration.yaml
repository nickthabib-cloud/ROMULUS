# ROMULUS research register: ATT&CK Enterprise v20.0, entries whose first tactic is exfiltration.
# Schema and workflow: docs/research/README.md. 20 entries (20 assessed, 0 stubs).
# An entry with only id/name/tactics is a stub: walked and listed, not yet assessed.
attack_version: enterprise-attack 20.0
primary_tactic: exfiltration
entries:
- id: T1011
  name: Exfiltration Over Other Network Medium
  tactics: [exfiltration]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: journal_other
    fields: [kernel.message]
  - family: auditd_exec
    fields: [process.executable, process.argv]
  lab_observable:
    status: 'no'
    reason: non-primary network media (Bluetooth, cellular, radio) are not monitored
  rules: []
  disposition:
    status: not_observable_by_design
    reason: traffic over other media bypasses the monitored network; only host-side interface/tool use is visible
  priority: P4
  detection_ideas:
  - New network interface brought up (kernel messages, ip link) on a server followed by reduced egress on the monitored
    path.
  correlation: []
  pivots: [Interface events and processes using it]
- id: T1011.001
  name: Exfiltration Over Bluetooth
  tactics: [exfiltration]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv]
  lab_observable:
    status: 'no'
    reason: no Bluetooth
  rules: []
  disposition:
    status: not_observable_by_design
    reason: Bluetooth transfers are off-network
  priority: P4
  detection_ideas:
  - bluetoothctl/obexftp executed on servers (positive-only).
  correlation: []
  pivots: [Files accessed before]
- id: T1020
  name: Automated Exfiltration
  tactics: [exfiltration]
  platforms: [Linux, Network Devices, Windows, macOS]
  telemetry:
  - family: eve_flow
    fields: [source.ip, destination.ip, flow.bytes_toserver, flow.start]
  - family: auditd_exec
    fields: [process.executable, process.parent.executable]
  lab_observable:
    status: 'yes'
    reason: periodic uploads visible in flow volumes
  rules: []
  disposition:
    status: planned
    reason: 'scheduled or looping uploads: regular outbound sessions with large toserver bytes (BL-04 + BL-15)'
  priority: P2
  detection_ideas:
  - 'BL-04 + BL-15: periodic sessions whose toserver bytes dominate toclient bytes to a rare destination.'
  correlation: ['COR-12, COR-15']
  pivots: [The scheduler entry and the uploading process]
- id: T1020.001
  name: Traffic Duplication
  tactics: [exfiltration]
  platforms: [Network Devices]
  telemetry:
  - family: netdev
    fields: [config.change, span.session]
  - family: eve_flow
    fields: [destination.ip, flow.bytes]
  lab_observable:
    status: 'no'
    reason: no device configuration telemetry
  rules: []
  disposition:
    status: needs_telemetry
    reason: device logs for SPAN/ERSPAN/mirror configuration; GRE/ERSPAN flows to external addresses are visible on the
      network side
  priority: P3
  detection_ideas:
  - GRE (proto 47) or ERSPAN flows from a network device to an address outside the monitoring infrastructure.
  correlation: []
  pivots: [Who configured the mirror session]
- id: T1029
  name: Scheduled Transfer
  tactics: [exfiltration]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: eve_flow
    fields: [flow.start, flow.bytes_toserver, destination.ip]
  - family: auditd_exec
    fields: [process.parent.executable]
  lab_observable:
    status: 'yes'
    reason: timing of outbound transfers visible
  rules: []
  disposition:
    status: planned
    reason: uploads at a fixed schedule (cron cadence) to rare destinations (BL-04 with byte asymmetry)
  priority: P3
  detection_ideas:
  - Outbound transfers repeating at a fixed wall-clock time from a cron-parented process.
  correlation: [COR-15]
  pivots: [The cron entry]
- id: T1030
  name: Data Transfer Size Limits
  tactics: [exfiltration]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: eve_flow
    fields: [flow.bytes_toserver, destination.ip]
  - family: eve_http
    fields: [http.request.method, http.response.length]
  lab_observable:
    status: 'yes'
    reason: per-session byte sizes visible
  rules: []
  disposition:
    status: planned
    reason: many outbound sessions to one destination with near-identical toserver byte counts (chunked exfil), summed per
      destination (BL-15 aggregate)
  priority: P3
  detection_ideas:
  - 'BL-15: sum of toserver bytes per (src, dst) over the window with chunk-size uniformity as a feature.'
  correlation: []
  pivots: [The host process and staged archive (T1074)]
- id: T1041
  name: Exfiltration Over C2 Channel
  tactics: [exfiltration]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: eve_flow
    fields: [flow.bytes_toserver, flow.bytes_toclient, destination.ip]
  - family: arkime_spi
    fields: [network.bytes_src, network.bytes_dst]
  lab_observable:
    status: 'yes'
    reason: flow byte asymmetry is computable
  rules: []
