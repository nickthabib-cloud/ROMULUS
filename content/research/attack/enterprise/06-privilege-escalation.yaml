- id: T1548.001
  name: Setuid and Setgid
  tactics: [privilege-escalation]
  platforms: [Linux, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.uid, process.euid, process.auid, process.ppid]
  - family: auditd_sys
    fields: [syscall.name, syscall.args]
  - family: auditd_path
    fields: [file.path, file.mode]
  lab_observable:
    status: 'yes'
    reason: exec records carry uid and euid, so a setuid execution by a non-root auid is visible; chmod u+s needs syscall
      audit
  rules: []
  disposition:
    status: planned
    reason: 'BL-06: euid 0 with non-root uid/auid from an executable not in the host''s setuid baseline; chmod/chown giving
      u+s to a file outside system paths'
  priority: P1
  detection_ideas:
  - 'BL-06: exec with euid=0, uid!=0 where the exe is not a standard setuid binary (or is one in an unusual path).'
  - fchmodat/chmod setting mode with 04000 on a file under /tmp, /home, /dev/shm (needs syscall audit).
  - 'GTFOBins shape: standard setuid binary whose child is a shell running with euid 0.'
  correlation: []
  pivots:
  - Creator of the setuid file and every execution of it
- id: T1548.002
  name: Bypass User Account Control
  tactics: [privilege-escalation]
- id: T1548.003
  name: Sudo and Sudo Caching
  tactics: [privilege-escalation]
  platforms: [Linux, macOS]
  telemetry:
  - family: journal_sudo
    fields: [user.name, auth.target_user, sudo.command, event.outcome]
  - family: auditd_exec
    fields: [process.executable, process.parent.executable, process.argv, process.euid]
  - family: auditd_path
    fields: [file.path]
  lab_observable:
    status: 'yes'
    reason: sudo command records (success and failure) are normalized
  rules: []
  disposition:
    status: planned
    reason: sudo baselines per account, sudo -l enumeration, sudo failures, sudoers writes and shell escapes from sudo'd
      programs
  priority: P1
  detection_ideas:
  - First sudo-to-root by an account in the baseline window, or sudo by a web-service account.
  - sudo-run editor/pager/find/awk (GTFOBins) whose child is a root shell (lineage, kernel exe).
  - 'BL-17: write to /etc/sudoers or /etc/sudoers.d/* (urgent class); timestamp_timeout/!tty_tickets changes (positive-only
    text).'
  correlation: []
  pivots:
  - All commands run as root in the same audit session after the sudo
