  name: Ptrace System Calls
  tactics: [privilege-escalation, stealth]
  platforms: [Linux]
  telemetry:
  - family: auditd_sys
    fields: [syscall.name, syscall.args, target.pid, process.executable, process.uid]
  - family: auditd_exec
    fields: [process.executable, process.argv]
  lab_observable:
    status: partial
    reason: ptrace syscalls are only recorded if audited (unverified); gdb/strace execs visible (positive-only)
  rules: []
  disposition:
    status: planned
    reason: ptrace ATTACH/POKETEXT against another user's or a privileged process by a non-debugger exe; gdb -p against
      sshd/sudo
  priority: P2
  detection_ideas:
  - ptrace(PTRACE_ATTACH|PTRACE_SEIZE|PTRACE_POKETEXT) where target is sshd, sudo, a shell of another user, or a root daemon.
  - gdb/strace/ltrace attached (-p) to sshd or login processes (credential sniffing, positive-only).
  correlation: []
  pivots:
  - Target process identity and any credential material access afterwards
