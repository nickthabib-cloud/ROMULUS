- id: T1068
  name: Exploitation for Privilege Escalation
  tactics: [privilege-escalation]
  platforms: [Linux, Windows, macOS, Containers]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.uid, process.euid, process.auid, process.parent.executable]
  - family: auditd_exec
    fields: [process.cwd]
  - family: eve_alert
    fields: [alert.signature, alert.category]
  - family: journal_other
    fields: [kernel.message]
  lab_observable:
    status: 'yes'
    reason: uid/euid transitions and exploit compilation (gcc in /tmp) are visible in auditd
  rules: [host.exec_from_temp_dir]
  disposition:
    status: planned
    reason: BL-06 detects the result (unbrokered root process); compile-and-run from temp is partly covered by host.exec_from_temp_dir
  priority: P1
  detection_ideas:
  - 'BL-06: process with euid/uid 0 whose parent chain is a non-root login session without sudo/su/pkexec/sshd/cron/systemd
    as broker.'
  - Compiler (gcc/cc/clang) run in a temp directory followed by execution of its output and then a root shell (sequence).
  - Kernel oops/segfault messages for setuid binaries right before a root shell (pwnkit/dirtypipe style, positive-only).
  correlation: []
  pivots:
  - The exploit binary's origin (download flow) and the root process's children
