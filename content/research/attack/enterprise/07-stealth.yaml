- id: T1027.010
  name: Command Obfuscation
  tactics: [stealth]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.argv, process.executable, process.parent.executable]
  - family: win_powershell
    fields: [powershell.script_block_text]
  lab_observable:
    status: 'yes'
    reason: obfuscated shell command lines appear in auditd argv
  rules: [host.download_piped_to_shell]
  disposition:
    status: planned
    reason: 'positive-only obfuscation features over argv: base64/hex blobs piped to an interpreter, ${IFS}, variable-substitution
      tricks, eval of decoded data'
  priority: P2
  detection_ideas:
  - 'Token-aware: sh -c operand containing base64 -d|--decode piped to sh/bash/python; eval with $( ) of a decoder; ${IFS}
    separators (positive-only lead).'
  - Long high-entropy argv operand passed to an interpreter -c (entropy as feature, rarity against host baseline).
  correlation: []
  pivots:
  - Decoded content and the children of the interpreter
- id: T1027.011
  name: Fileless Storage
  tactics: [stealth]
  platforms: [Linux, Windows]
  telemetry:
  - family: auditd_exec
    fields: [process.executable]
  - family: auditd_sys
    fields: [syscall.name]
  - family: auditd_path
    fields: [file.path]
  lab_observable:
    status: 'yes'
    reason: SYSCALL exe shows memfd:/(deleted)/dev/shm paths for fileless execution
  rules: []
  disposition:
    status: planned
    reason: 'BL-20: execution whose kernel exe is a memfd, a deleted file, or under /dev/shm'
  priority: P1
  detection_ideas:
  - 'BL-20: process.executable beginning with /memfd: or ending in '' (deleted)'', or under /dev/shm or /run/user.'
  - memfd_create followed by execveat/fexecve from the same pid (needs syscall audit).
  correlation:
  - 'COR-02: memory-resident process with an external socket.'
  pivots:
  - Parent that created the memfd and its network sessions
