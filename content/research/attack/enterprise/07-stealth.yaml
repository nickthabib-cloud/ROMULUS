  lab_observable:
    status: 'no'
    reason: modification of tools to evade signatures is not itself observable
  rules: []
  disposition:
    status: not_observable_by_design
    reason: removing indicators from tools defeats signatures; ROMULUS relies on behaviour layers that do not depend on
