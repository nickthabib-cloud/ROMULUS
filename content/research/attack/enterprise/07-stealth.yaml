- id: T1027.004
  name: Compile After Delivery
  tactics: [stealth]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.cwd, process.user]
  - family: auditd_path
    fields: [file.path, file.nametype]
  lab_observable:
    status: 'yes'
    reason: compiler executions and the execution of their output are in auditd
  rules: [host.exec_from_temp_dir]
  disposition:
    status: planned
    reason: 'sequence: compiler run by a non-developer account or in a temp dir, then execution of the output path'
  priority: P2
  detection_ideas:
  - gcc/cc/clang/go build invoked in /tmp, /dev/shm or a web-service account context, followed by exec of the -o target
    (kernel exe path).
  correlation: []
  pivots:
  - Source file origin and the compiled binary's behaviour
- id: T1027.005
