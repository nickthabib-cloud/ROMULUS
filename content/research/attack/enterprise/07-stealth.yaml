    fields: [process.ppid, process.pid, process.executable, process.argv]
  lab_observable:
    status: 'yes'
    reason: ppid is recorded; reparenting to init after double-fork is visible as ppid 1
  rules: []
  disposition:
    status: planned
    reason: process with ppid 1 (or a subreaper) whose exe is not a daemon in the baseline, started from an interactive
      session (auid set)
  priority: P2
  detection_ideas:
  - Exec with ppid=1 and a real auid (login session), not a systemd unit (BL-02 lineage feature).
  - setsid/nohup/disown chains launching a network-connecting process (positive-only argv).
  correlation: [COR-02]
  pivots: [The session (auid/ses) that launched it]
