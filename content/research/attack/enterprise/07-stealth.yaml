  rules: []
  disposition:
    status: planned
    reason: service units whose name imitates a system service but whose executable lives outside package paths
  priority: P2
  detection_ideas:
  - Unit name similar to a distribution service (edit-distance to known units) with ExecStart in /tmp, /var/tmp, /dev/shm,
    /opt/<random> or a hidden directory.
  correlation: []
  pivots: [Unit file creation and its process activity]
- id: T1036.005
  name: Match Legitimate Resource Name or Location
  tactics: [stealth]
  platforms: [Linux, Windows, macOS, Containers]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.comm, process.argv]
  - family: auditd_path
    fields: [file.path]
  lab_observable:
    status: 'yes'
    reason: kernel exe path is recorded for every exec
  rules: [host.exec_from_temp_dir, host.script_from_temp_dir]
  disposition:
    status: planned
    reason: the two temp-dir rules claim T1036.005 in their metadata but detect execution location, not name matching; a
      dedicated rule for system-binary names in the wrong location is planned
  priority: P1
  detection_ideas:
  - Exe basename equal to a system binary (sshd, cron, systemd, kworker, dbus-daemon...) but exe path outside its packaged
    location.
  - Kernel-thread-like names ([kworker/0:1]) as argv[0] for a userland exe (pairs with T1036.011).
  correlation:
  - 'COR-02: masquerading process with an external socket.'
  pivots: [The file's creator and the process's sockets]
