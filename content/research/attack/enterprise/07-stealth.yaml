  - Copy (cp/install syscall PATH) of a system binary to a new name in a writable dir followed by execution of the copy.
  - Process whose argv shape is a known tool (e.g. nc -e, socat exec:) but whose exe basename is not that tool (positive-only).
  correlation: []
  pivots:
  - The copy operation and every execution of the renamed file
- id: T1036.004
