- id: T1036.011
  name: Overwrite Process Arguments
  tactics: [stealth]
  platforms: [Linux]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.comm]
  - family: edr
    fields: [process.title]
  lab_observable:
    status: partial
    reason: auditd records argv at exec time; overwriting argv later is invisible to auditd but the exe path still shows
      the real image
  rules: []
  disposition:
    status: planned
    reason: exec-time argv[0] that differs from the exe basename in a way typical of masquerade (bracketed kernel-thread
      names, system daemon names)
  priority: P2
  detection_ideas:
  - argv[0] like [kworker/*], [kthreadd], or a daemon name, while process.executable is a userland binary in a writable
    directory.
  correlation: []
  pivots: [Process sockets and parent]
