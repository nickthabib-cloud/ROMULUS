# ROMULUS research register: ATT&CK Enterprise v20.0, entries whose first tactic is stealth.
# Schema and workflow: docs/research/README.md. 100 entries (67 assessed, 33 stubs).
# An entry with only id/name/tactics is a stub: walked and listed, not yet assessed.
attack_version: enterprise-attack 20.0
primary_tactic: stealth
entries:
- id: T1006
  name: Direct Volume Access
  tactics: [stealth]
  platforms: [Network Devices, Windows]
  telemetry:
  - family: auditd_path
    fields: [file.path, syscall.name, process.executable]
  - family: netdev
    fields: [command]
  - family: win_sysmon
    fields: [event.code, file.path]
  lab_observable:
    status: partial
    reason: raw block-device opens (/dev/sd*, /dev/nvme*) are visible only with PATH records for open syscalls (unverified)
  rules: []
  disposition:
    status: planned
    reason: read of raw disk devices by processes outside the backup/imaging baseline
  priority: P3
  detection_ideas:
  - open of /dev/sd*, /dev/nvme*, /dev/mapper/* by a non-baseline process (debugfs, dd, custom tools) on a production host.
  correlation: []
  pivots: [What the process wrote or transferred afterwards]
- id: T1014
  name: Rootkit
  tactics: [stealth]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: auditd_sys
    fields: [syscall.name, module.name]
  - family: auditd_path
    fields: [file.path, file.nametype]
  - family: journal_other
    fields: [kernel.message]
  - family: eve_flow
    fields: [source.ip, destination.ip, destination.port]
  lab_observable:
    status: partial
    reason: module loads and ld.so.preload writes are observable with the right audit rules; hidden processes are by design
      invisible on the host but their traffic is not
  rules: []
  disposition:
    status: planned
    reason: 'BL-21 (module load and preload) plus host/network discrepancy: flows from a host with no process holding a
      matching socket (COR-01 inverse, hypothesis)'
  priority: P2
  detection_ideas:
  - 'BL-21: kernel module load or /etc/ld.so.preload write.'
  - Network sessions from a host that has auditd connect coverage but no connect record for the flow's destination in the
    window (discrepancy lead, hypothesis).
  correlation:
  - 'COR-01 inverse: network flow with no host-side connect record on a fully audited host.'
  pivots:
  - Module and preload files; flows without host attribution
