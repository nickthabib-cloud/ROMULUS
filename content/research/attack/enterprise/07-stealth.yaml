- id: T1036.003
  name: Rename Legitimate Utilities
  tactics: [stealth]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.comm, process.argv]
  - family: auditd_path
    fields: [file.path, file.inode]
  lab_observable:
    status: 'yes'
    reason: exe path and comm are kernel-recorded
  rules: []
  disposition:
    status: planned
    reason: 'renamed copies of utilities: well-known tool behaviour (argv shape) from an exe path whose basename is different
