# ROMULUS research register: ATT&CK Enterprise v20.0, entries whose first tactic is collection.
# Schema and workflow: docs/research/README.md. 31 entries (22 assessed, 9 stubs).
# An entry with only id/name/tactics is a stub: walked and listed, not yet assessed.
attack_version: enterprise-attack 20.0
primary_tactic: collection
entries:
- id: T1005
  name: Data from Local System
  tactics: [collection]
  platforms: [Linux, Network Devices, Windows, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.user]
  - family: auditd_path
    fields: [file.path, process.executable]
  - family: netdev
    fields: [command]
  lab_observable:
    status: partial
    reason: reads of sensitive files visible via argv; bulk reads need PATH coverage
  rules: []
  disposition:
    status: planned
    reason: collection is mostly visible through staging (T1074) and archiving (T1560)
  priority: P3
  detection_ideas:
  - Many distinct files under home or data directories opened by one non-service process in a short window (PATH volume).
  correlation: [COR-12]
  pivots: [Archive or transfer that followed]
- id: T1025
  name: Data from Removable Media
  tactics: [collection]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv]
  - family: journal_other
    fields: [kernel.message]
  lab_observable:
    status: 'no'
    reason: no removable media on lab servers
  rules: []
  disposition:
    status: deferred
    reason: rare on servers; mount of removable media by non-admin sessions is a positive-only lead
  priority: P4
  detection_ideas:
  - Mount of /dev/sd[b-z]* (USB mass storage) followed by copies from it.
  correlation: []
  pivots: [Files copied]
- id: T1039
  name: Data from Network Shared Drive
  tactics: [collection]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv]
  - family: auditd_path
    fields: [file.path]
  - family: zeek_smb
    fields: [path, action]
  - family: eve_flow
    fields: [destination.port, flow.bytes_toclient]
  lab_observable:
    status: partial
    reason: NFS/SMB mounts and copies visible as execs; large share reads visible as flow bytes
  rules: []
  disposition:
    status: planned
    reason: bulk reads from network shares by a host or account that does not normally read them (flow bytes from file servers,
      BL-15 variant)
  priority: P3
  detection_ideas:
  - Bytes from a file server to one client far above that client's baseline (BL-15 internal variant).
  correlation: []
  pivots: [Where the data went next]
