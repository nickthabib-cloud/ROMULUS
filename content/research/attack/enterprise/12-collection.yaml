- id: T1560.001
  name: Archive via Utility
  tactics: [collection]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.cwd, process.user]
  - family: auditd_path
    fields: [file.path, file.nametype]
  lab_observable:
    status: 'yes'
    reason: archive utilities and their operands visible in auditd
  rules: []
  disposition:
    status: planned
    reason: archive of sensitive paths (/etc, /home, /root, web roots, DB dirs) or with encryption options by non-backup
      sessions, followed by outbound transfer (COR-12)
  priority: P2
  detection_ideas:
  - tar/zip/7z with -P/--password/-e or piped to openssl/gpg (positive-only argv).
  - Archive output written in /tmp, /dev/shm or the web root by a web-service or interactive account.
  correlation: ['COR-12: archive then large outbound transfer.']
  pivots: [The transfer of the archive (scp/curl/HTTP GET)]
