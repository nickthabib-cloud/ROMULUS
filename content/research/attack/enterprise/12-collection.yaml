    fields: [source.ip, destination.ip, flow.bytes_toserver]
  - family: auditd_exec
    fields: [process.argv]
  lab_observable:
    status: partial
    reason: internal transfers to a staging host visible at sensors when crossing them
  rules: []
  disposition:
    status: planned
