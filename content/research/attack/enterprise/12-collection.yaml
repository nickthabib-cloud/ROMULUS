    fields: [file.path, file.nametype, process.executable]
  - family: auditd_exec
    fields: [process.executable, process.argv, process.cwd]
  lab_observable:
    status: partial
    reason: archive/copy commands into /tmp, /dev/shm or web roots visible
  rules: []
  disposition:
    status: planned
    reason: archive created in a temp or web-served directory followed by an outbound transfer or a web GET of that file
      (COR-12)
  priority: P2
