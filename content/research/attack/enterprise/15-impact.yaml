# ROMULUS research register: ATT&CK Enterprise v20.0, entries whose first tactic is impact.
# Schema and workflow: docs/research/README.md. 33 entries (30 assessed, 3 stubs).
# An entry with only id/name/tactics is a stub: walked and listed, not yet assessed.
attack_version: enterprise-attack 20.0
primary_tactic: impact
entries:
- id: T1485
  name: Data Destruction
  tactics: [impact]
  platforms: [Linux, Windows, macOS, Containers, ESXi, IaaS]
  telemetry:
  - family: auditd_exec
    fields: [process.executable, process.argv, process.user]
  - family: auditd_path
    fields: [file.path, file.nametype, syscall.name]
  lab_observable:
    status: partial
    reason: rm -rf, shred, dd of=/dev/* execs visible; mass DELETE PATH records need syscall coverage
  rules: []
  disposition:
    status: planned
    reason: mass deletion rate per process (PATH DELETE count) and destructive argv (rm -rf on data dirs, shred, dd to devices)
  priority: P2
  detection_ideas:
  - PATH DELETE count per process per minute far above baseline under data directories.
  - rm -rf /, shred -u on many files, dd if=/dev/zero of=/dev/sd* (positive-only argv).
  correlation: []
  pivots: [The session that started it]
- id: T1485.001
  name: Lifecycle-Triggered Deletion
  tactics: [impact]
- id: T1486
  name: Data Encrypted for Impact
  tactics: [impact]
  platforms: [Linux, Windows, macOS, ESXi, IaaS]
  telemetry:
  - family: auditd_path
    fields: [file.path, file.nametype, syscall.name, process.executable]
  - family: auditd_exec
    fields: [process.executable, process.argv]
  lab_observable:
    status: partial
    reason: rename/write bursts visible via PATH where audited; openssl/gpg mass-encrypt argv visible
  rules: []
  disposition:
    status: planned
    reason: burst of renames to a new extension or CREATE+DELETE pairs by one process across many directories; ransom note
      file names created in many directories
  priority: P2
  detection_ideas:
  - One process renaming/creating files with a single new extension across many directories in minutes (PATH rename volume).
  - Same new file name (ransom note) created in many directories.
  correlation: []
  pivots:
  - The process's origin and the first encrypted path
