# ROMULUS research register: ATT&CK Enterprise v20.0, entries whose first tactic is persistence.
# Schema and workflow: docs/research/README.md. 100 entries (42 assessed, 58 stubs).
# An entry with only id/name/tactics is a stub: walked and listed, not yet assessed.
attack_version: enterprise-attack 20.0
primary_tactic: persistence
entries:
- id: T1037
  name: Boot or Logon Initialization Scripts
  tactics: [persistence, privilege-escalation]
  platforms: [Linux, Network Devices, Windows, macOS]
  telemetry:
  - family: auditd_path
    fields: [file.path, file.nametype, process.executable]
  - family: auditd_exec
    fields: [process.executable, process.argv]
  - family: netdev
    fields: [config.change]
  lab_observable:
    status: partial
    reason: writes to rc/init scripts visible via PATH records where watched (unverified)
  rules: []
  disposition:
    status: planned
    reason: see T1037.004
  priority: P2
  detection_ideas: [See T1037.004.]
  correlation: []
  pivots: [Next boot's process tree for the modified script]
