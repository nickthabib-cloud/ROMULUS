    fields: [syscall.name, syscall.args, process.executable]
  - family: auditd_net
    fields: [socket.family, process.executable]
  - family: osquery
    fields: [process_open_sockets]
  lab_observable:
    status: partial
    reason: setsockopt(SO_ATTACH_FILTER)/socket(AF_PACKET) need explicit audit rules (unverified)
  rules: []
  disposition:
    status: planned
    reason: detect raw packet sockets (AF_PACKET/SOCK_RAW) opened by processes outside the packet-capture baseline (BPFDoor-style)
  priority: P2
  detection_ideas:
  - socket(AF_PACKET or SOCK_RAW) or bpf() by a process whose exe is not tcpdump/dhclient/known agents, especially running
    as root with a masqueraded name.
  correlation:
  - 'COR-22: raw-socket process joined to unusual non-TCP traffic.'
  pivots:
  - The process's exe path, start time and parent; inbound packets with magic sequences (PCAP)
