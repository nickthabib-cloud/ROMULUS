- id: T1205.001
  name: Port Knocking
  tactics: [persistence, stealth, command-and-control]
  platforms: [Linux, Network Devices, Windows, macOS]
  telemetry:
  - family: eve_flow
    fields: [source.ip, destination.ip, destination.port, flow.state, flow.start]
  - family: firewall
    fields: [action, destination.port]
  - family: auditd_exec
    fields: [process.executable, process.argv]
  lab_observable:
    status: partial
    reason: knock sequences of closed-port attempts followed by an open port are visible in EVE flow at inetfw
  rules: []
  disposition:
    status: planned
    reason: 'sequence: several unanswered attempts to distinct closed ports from one source, then a successful session to
      a normally filtered port'
  priority: P3
  detection_ideas:
  - Same source, ordered set of 3+ rejected/unanswered ports within seconds, followed by an established session to a new
    port on the same host; repeated with the same order on another day.
  - knockd or iptables recent-module rules installed (argv, positive-only).
  correlation:
  - 'COR-25: firewall change on host followed by new inbound flows.'
  pivots:
  - The session that followed the knock and the process that accepted it (accept SOCKADDR)
- id: T1205.002
  name: Socket Filters
  tactics: [persistence, stealth, command-and-control]
  platforms: [Linux, Windows, macOS]
