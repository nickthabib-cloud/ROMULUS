- id: T1566.002
  name: Spearphishing Link
  tactics: [initial-access]
  platforms: [Linux, Windows, macOS, SaaS, Office Suite, Identity Provider]
  telemetry:
  - family: email_gw
    fields: [url, recipient]
  - family: proxy
    fields: [url.original, user.name]
  - family: eve_http
    fields: [url.original, http.hostname]
  - family: eve_dns
    fields: [dns.question.name]
  lab_observable:
    status: partial
    reason: link clicks over HTTP/DNS are visible to the sensors, but the mail that carried them is not
  rules: []
  disposition:
    status: needs_telemetry
    reason: the phishing link is only attributable with mail telemetry; the click alone is an ordinary web request
  priority: P3
  detection_ideas:
  - Newly registered or first-seen domain requested by several internal clients within a short window (campaign shape).
  correlation: []
  pivots:
  - Clients that resolved the same domain and what they downloaded
- id: T1566.003
  name: Spearphishing via Service
  tactics: [initial-access]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: proxy
    fields: [url.original, category]
  - family: eve_tls
    fields: [tls.sni]
  - family: edr
    fields: [process.name, file.path]
  lab_observable:
    status: 'no'
    reason: messaging-service content is not visible
  rules: []
  disposition:
    status: not_observable_by_design
    reason: delivery happens inside third-party services; only the follow-on download/execution is observable (T1105, T1204)
  priority: P4
  detection_ideas:
  - Executable downloaded from a messaging or social service domain followed by execution (COR-06).
  correlation: ['COR-06: download flow followed by execution.']
  pivots: [The downloading client's subsequent processes]
- id: T1566.004
  name: Spearphishing Voice
  tactics: [initial-access]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: vpn
    fields: [user.name, source.ip]
  - family: idp_signin
    fields: [user.name, mfa.result]
  lab_observable:
    status: 'no'
    reason: voice channel is out of scope of all supported telemetry
  rules: []
  disposition:
    status: not_observable_by_design
    reason: the call itself is never in telemetry; consequences (remote-access tool installs, new sign-ins) are covered
      under T1219 and T1078
  priority: P4
  detection_ideas:
  - Remote-desktop tool first seen on a host shortly after a help-desk style password reset (identity logs plus T1219.002).
  correlation: []
  pivots:
  - Remote-access tool sessions and new sign-ins for the affected user
- id: T1659
  name: Content Injection
  tactics: [initial-access, command-and-control]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: eve_http
    fields: [source.ip, destination.ip, http.hostname, url.original, http.content_type, http.response.length]
  - family: eve_tls
    fields: [tls.sni, tls.issuer, tls.subject]
  - family: arkime_spi
    fields: [http.host, http.uri, http.body_md5, tls.cert.issuer]
  - family: pcap
    fields: [payload.bytes, http.request.uri]
  - family: auditd_exec
    fields: [process.executable, process.ppid, process.argv]
  lab_observable:
    status: partial
    reason: cleartext HTTP responses are visible to EVE/Arkime; injected content inside TLS is not; host follow-on execution
      is visible in auditd
  rules: []
  disposition:
    status: deferred
    reason: injection happens on an upstream path ROMULUS does not observe; the observable consequence is a download or
      execution handled by T1105/T1204 rules
  priority: P4
  detection_ideas:
  - Same URL returning different content hashes (Arkime http.body_md5) to different clients in the window, where the publisher
    is expected to be static.
  - Plain-HTTP software update or script fetch followed by execution of the fetched content (COR-06).
  correlation:
  - 'COR-06: download flow followed by execution of the downloaded path.'
  pivots:
  - Other clients that fetched the same URL and the body hashes they received
- id: T1669
  name: Wi-Fi Networks
  tactics: [initial-access]
  platforms: [Linux, Network Devices, Windows, macOS]
  telemetry:
  - family: netdev
    fields: [wireless controller association/auth events]
  - family: dhcp
    fields: [client.mac, client.ip]
  - family: eve_flow
    fields: [source.ip, flow.start]
  lab_observable:
    status: 'no'
    reason: no wireless infrastructure telemetry
  rules: []
  disposition:
    status: needs_telemetry
    reason: requires wireless controller/WIDS logs; downstream activity of a new wireless client is generic first-seen-source
      detection
  priority: P4
  detection_ideas:
  - Wireless client association on an SSID from a MAC never seen before followed by internal scanning.
  correlation: []
  pivots: [The new client's DHCP binding and conversations]
