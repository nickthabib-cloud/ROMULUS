# ROMULUS research register: ATT&CK Enterprise v20.0, entries whose first tactic is initial-access.
# Schema and workflow: docs/research/README.md. 22 entries (22 assessed, 0 stubs).
# An entry with only id/name/tactics is a stub: walked and listed, not yet assessed.
attack_version: enterprise-attack 20.0
primary_tactic: initial-access
entries:
- id: T1078
  name: Valid Accounts
  tactics: [initial-access, persistence, privilege-escalation, stealth]
  platforms: [Linux, Network Devices, Windows, macOS, Containers, IaaS, SaaS, Office Suite, Identity Provider]
  telemetry:
  - family: journal_sshd
    fields: [user.name, source.ip, auth.method, event.outcome]
  - family: journal_sudo
    fields: [user.name, auth.target_user, event.outcome]
  - family: auditd_acct
    fields: [user.name, source.ip, audit.record_type, event.outcome]
  - family: win_security
    fields: [event.code, user.name, logon.type, source.ip]
  - family: idp_signin
    fields: [user.name, source.ip, event.outcome]
  lab_observable:
    status: 'yes'
    reason: sshd and sudo journal records are normalized
  rules: [host.ssh_login_external_source]
  disposition:
    status: covered
    reason: host.ssh_login_external_source flags successful SSH from external sources (lead); behavioural misuse of valid
      accounts needs baselines (BL-08)
  priority: P1
  detection_ideas:
  - 'BL-08: first-seen source per account; login at hours outside the account''s baseline; interactive login by a service
    account.'
  - 'BL-07: success after failures (credential guessing that worked).'
  - Same account authenticated from two sources too far apart in network terms within minutes (only with mission site context).
  correlation:
  - 'COR-10: login session -> commands -> network effects.'
  - 'COR-26: account created then first used from a network source.'
  pivots:
  - All sessions of the account in the window and the commands run under each audit session
  - Other accounts that authenticated from the same source
- id: T1078.001
  name: Default Accounts
  tactics: [initial-access, persistence, privilege-escalation, stealth]
  platforms: [Linux, Network Devices, Windows, macOS, Containers, IaaS, SaaS, Office Suite, Identity Provider]
  telemetry:
  - family: journal_sshd
    fields: [user.name, source.ip, event.outcome]
  - family: apache_access
    fields: [url.original, source.ip, http.response.status_code]
  - family: zoneminder
    fields: [user.name, source.ip, event.outcome]
  - family: netdev
    fields: [user.name, source.ip, event.outcome]
  lab_observable:
    status: partial
    reason: default-credential logins to SSH are visible; application logins (e.g. ZoneMinder admin) need the app log normalized
  rules: []
  disposition:
    status: planned
    reason: mission-supplied list of default and vendor account names, matched as typed user.name on successful auth
  priority: P2
  detection_ideas:
  - Successful authentication with a vendor-default account name (root, admin, pi, ubnt, cisco...) from a non-management
    source.
  - Application default admin login success from a source that never used it before (app logs).
  correlation: []
  pivots: [Commands run after the default-account login]
- id: T1078.002
  name: Domain Accounts
  tactics: [initial-access, persistence, privilege-escalation, stealth]
  platforms: [Linux, Windows, macOS, Identity Provider]
  telemetry:
  - family: win_security
    fields: [event.code, user.domain, logon.type, source.ip]
  - family: zeek_kerberos
    fields: [client, service, success]
  - family: journal_sshd
    fields: [user.name, source.ip]
  lab_observable:
    status: 'no'
    reason: no Active Directory or domain-joined hosts in the lab
  rules: []
  disposition:
    status: needs_telemetry
    reason: domain account misuse needs DC Security logs or Zeek Kerberos/NTLM
  priority: P2
  detection_ideas:
  - Domain account authenticating to a host class it never touched in the baseline (peer-group rarity).
  correlation: []
  pivots:
  - The account's Kerberos service tickets and logon hosts
- id: T1078.003
  name: Local Accounts
  tactics: [initial-access, persistence, privilege-escalation, stealth]
  platforms: [Linux, Network Devices, Windows, macOS, Containers, ESXi]
  telemetry:
  - family: journal_sshd
    fields: [user.name, source.ip, auth.method, event.outcome]
  - family: journal_sudo
