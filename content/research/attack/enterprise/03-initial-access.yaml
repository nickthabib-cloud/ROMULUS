  name: Spearphishing Attachment
  tactics: [initial-access]
  platforms: [Linux, Windows, macOS]
  telemetry:
  - family: email_gw
    fields: [attachment.sha256, attachment.name, sender, recipient]
  - family: edr
    fields: [process.parent.name, process.name, file.path]
  - family: auditd_exec
    fields: [process.parent.executable, process.executable]
  lab_observable:
